<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Paperpile Radio 🎧</title>
<style>
  :root { --bg: #0d1117; --card: #161b22; --border: #30363d; --text: #c9d1d9; --muted: #8b949e; --accent: #58a6ff; --green: #3fb950; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; line-height:1.6; min-height:100vh; }
  header { background:var(--card); border-bottom:1px solid var(--border); padding:1.5rem 2rem; text-align:center; position:sticky; top:0; z-index:10; }
  header h1 { font-size:1.8rem; }
  header p { color:var(--muted); font-size:.9rem; margin-top:.25rem; }
  .container { max-width:900px; margin:0 auto; padding:1.5rem; }
  
  .now-playing { background:var(--card); border:1px solid var(--accent); border-radius:12px; padding:1.25rem; margin-bottom:2rem; }
  .now-playing-inner { display:flex; gap:1rem; align-items:center; }
  .now-playing img { width:80px; height:80px; border-radius:8px; object-fit:cover; flex-shrink:0; background:var(--border); }
  .now-playing-info { flex:1; min-width:0; }
  .now-playing h2 { font-size:1rem; }
  .now-playing .author { color:var(--muted); font-size:.8rem; }
  audio { width:100%; margin-top:.5rem; height:36px; border-radius:8px; }
  
  .stats { text-align:center; color:var(--muted); margin-bottom:1.5rem; font-size:.85rem; }
  .stats span { color:var(--green); font-weight:bold; }
  
  .episodes { display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:1rem; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:10px; overflow:hidden; cursor:pointer; transition:border-color .2s,transform .15s; }
  .card:hover { border-color:var(--accent); transform:translateY(-2px); }
  .card-img { width:100%; height:140px; object-fit:cover; background:var(--border); display:flex; align-items:center; justify-content:center; font-size:3rem; }
  .card-body { padding:.75rem; }
  .card h3 { font-size:.85rem; margin-bottom:.25rem; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .card .year { color:var(--accent); font-size:.75rem; font-weight:600; }
  .card .desc { color:var(--muted); font-size:.72rem; margin-top:.25rem; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  
  footer { text-align:center; padding:2rem; color:var(--muted); font-size:.8rem; border-top:1px solid var(--border); margin-top:2rem; }
  footer a { color:var(--accent); }
</style>
</head>
<body>
<header>
  <h1>🎧 Paperpile Radio</h1>
  <p>論文の音声概要ポッドキャスト — NotebookLM AIによる日本語ダイジェスト</p>
</header>
<div class="container">
  <div class="stats">全 <span id="ep-count">0</span> エピソード</div>
  <div class="now-playing" id="now-playing" style="display:none">
    <div class="now-playing-inner">
      <img id="np-img" src="" alt="">
      <div class="now-playing-info">
        <h2 id="np-title"></h2>
        <div class="author" id="np-desc"></div>
      </div>
    </div>
    <audio id="player" controls></audio>
  </div>
  <div class="episodes" id="episodes"></div>
</div>
<footer>
  Generated by <a href="https://github.com/shks/paperpile-radio">Paperpile Radio</a> ·
  <a href="feed.xml">RSS Feed</a> ·
  Powered by NotebookLM
</footer>
<script>
var EPISODES = [{"title": "Heirani Moghaddam et al. (2021) — Explicit processes in visuomotor adaptation", "year": "2021", "desc": "本資料は、視覚運動適応（visuomotor adaptation）における「明示的プロセス（意識的なプロセス）」と「暗示的プロセス（無意識的なプロセス）」の評価手法を比較した研究（Heirani Moghaddam et al., 2021）の内容をまとめたものである。 この研究の核心的な問いは、現在広く用いられている2つの評価手法、**プロセス解離手続（PDP）**と**言語報告フレームワーク", "audio": "Heirani%20Moghaddam%20et%20al.%20%282021%29%20%E2%80%94%20Explicit%20processes%20in%20visuomotor%20adaptation/Heirani_Moghaddam_et_al_2021_Explicit_processes_visuomotor_radio.mp3", "img": ""}, {"title": "Brooks et al. (2023) — Deep learning reveals what vocal bursts express", "year": "2023", "desc": "本ドキュメントは、2023年に発表された論文「Deep learning reveals what vocal bursts express in different cultures（深層学習が明らかにする、異なる文化におけるボーカル・バーストの表現内容）」に基づき、非言語音声が持つ感情的意味の構造、文化的共通性、および最新の解析手法についてまとめたものである。 本研究は、ため息、笑い声、叫び声", "audio": "Brooks%20et%20al.%20%282023%29%20%E2%80%94%20Deep%20learning%20reveals%20what%20vocal%20bursts%20express/Brooks_et_al_2023_Deep_learning_vocal_bursts_radio.mp3", "img": ""}, {"title": "Mehring et al. (2019) — Augmented manipulation ability", "year": "2019", "desc": "本ドキュメントは、Mehringら（2019年）による、多指症（六本指）の被験者を対象とした神経力学および操作能力に関する調査結果をまとめたものである。この研究は、人間の脳が追加の自由度（dof）をどのように制御し、それが身体能力の向上にどのように寄与するかを明らかにしている。 ---", "audio": "Mehring%20et%20al.%20%282019%29%20%E2%80%94%20Augmented%20manipulation%20ability/Mehring_et_al_2019_Augmented_manipulation_ability_radio.mp3", "img": ""}, {"title": "Luo et al. (2024) — Precise and dexterous robotic manipulation", "year": "2024", "desc": "本文書は、カリフォルニア大学バークレー校の研究チーム（Luo et al., 2024）が開発した、ビジョンベースのロボット操作システム「HIL-SERL（Human-in-the-Loop Sample-Efficient Robotic Reinforcement Learning）」に関するブリーフィング・ドキュメントである。本システムは、実世界での短時間のトレーニングにより、人間を凌駕する", "audio": "Luo%20et%20al.%20%282024%29%20%E2%80%94%20Precise%20and%20dexterous%20robotic%20manipulation/Luo_et_al_2024_Precise_and_dexterous_robotic_manipulation_radio.mp3", "img": ""}, {"title": "Diaz et al. (2023) — Human-in-the-loop optimization of wearable robotic devices", "year": "2023", "desc": "", "audio": "Diaz%20et%20al.%20%282023%29%20%E2%80%94%20Human-in-the-loop%20optimization%20of%20wearable%20robotic%20devices/Diaz_et_al_2023_Human-in-the-loop_optimization_of_wearable_robotic_devices_radio.mp3", "img": ""}, {"title": "Eden et al. (2022) — Principles of human movement augmentation", "year": "2022", "desc": "", "audio": "Eden%20et%20al.%20%282022%29%20%E2%80%94%20Principles%20of%20human%20movement%20augmentation/Eden_et_al_2022_Principles_of_human_movement_augmentation_radio.mp3", "img": ""}, {"title": "Legaspi et al. (2024) — The sense of agency in human–AI interactions", "year": "2024", "desc": "", "audio": "Legaspi%20et%20al.%20%282024%29%20%E2%80%94%20The%20sense%20of%20agency%20in%20human%E2%80%93AI%20interactions/Legaspi_et_al_2024_The_sense_of_agency_in_human-AI_interactions_radio.mp3", "img": ""}, {"title": "Zeraati et al. (2026) — Neural timescales from a computational perspective", "year": "2026", "desc": "", "audio": "Zeraati%20et%20al.%20%282026%29%20%E2%80%94%20Neural%20timescales%20from%20a%20computational%20perspective/Zeraati_et_al_2026_Neural_timescales_from_a_computational_perspective_radio.mp3", "img": ""}, {"title": "Nowak and Sigmund (2004) — Evolutionary dynamics", "year": "2004", "desc": "本資料は、マーティン・A・ノヴァク（Martin A. Nowak）とカール・シグムンド（Karl Sigmund）による研究「生物学的ゲームの進化動力学（Evolutionary Dynamics of Biological Games）」に基づき、進化生物学におけるゲーム理論の重要性と、その数学的枠組みをまとめたものである。 伝統的な進化観では、進化を固定された「フィットネス・ランドスケープ（", "audio": "Nowak%20and%20Sigmund%20%282004%29%20%E2%80%94%20Evolutionary%20dynamics/Nowak_Sigmund_2004_Evolutionary_dynamics_radio.mp3", "img": ""}, {"title": "Almaatouq et al. (2020) — Adaptive social networks", "year": "2020", "desc": "本報告書は、Abdullah Almaatouq氏らによる研究論文「Adaptive social networks promote the wisdom of crowds（適応型ソーシャルネットワークが群衆の知恵を促進する）」に基づき、社会的なつながりの動的な変化とフィードバックが、集団の知性および個人の判断精度にどのような影響を与えるかを詳細に分析したものである。 ---", "audio": "Almaatouq%20et%20al.%20%282020%29%20%E2%80%94%20Adaptive%20social%20networks/Almaatouq_et_al_2020_Adaptive_social_networks_radio.mp3", "img": ""}, {"title": "Littman (1994) — Markov games", "year": "1994", "desc": "本文書は、マイケル・L・リットマン（Michael L. Littman）の研究に基づき、マルチエージェント環境における強化学習の枠組みとしての「マルコフゲーム」の有効性を分析したものである。 従来の強化学習が依拠してきたマルコフ決定過程（MDP）は、環境が静止しており、他の適応的なエージェントが存在しないことを前提とする「独我論的」な視点に留まっていた。しかし、現実の環境では、エージェントは共通", "audio": "Littman%20%281994%29%20%E2%80%94%20Markov%20games/Littman_1994_Markov_games_radio.mp3", "img": ""}, {"title": "Piao et al. (2025) — AgentSociety", "year": "2025", "desc": "本文書は、大規模言語モデル（LLM）を活用した大規模社会シミュレータ「AgentSociety」に関するブリーフィング・ドキュメントである。AgentSocietyは、1万体以上のエージェントと500万件以上の相互作用を通じて、人間行動のメカニズム解明と社会現象の予測を目指す「計算社会科学2.0」の基盤となるプラットフォームである。 「AgentSociety」は、LLM駆動型の生成社会エージェン", "audio": "Piao%20et%20al.%20%282025%29%20%E2%80%94%20AgentSociety/Piao_et_al_2025_AgentSociety_radio.mp3", "img": "Piao%20et%20al.%20%282025%29%20%E2%80%94%20AgentSociety/Piao_et_al_2025_AgentSociety_infographic.png"}, {"title": "Gero et al. (2026) — From planning to revision", "year": "2026", "desc": "", "audio": "Gero%20et%20al.%20%282026%29%20%E2%80%94%20From%20planning%20to%20revision/Gero_et_al_2026_From_planning_to_revision_radio.mp3", "img": ""}, {"title": "Logg et al. (2026) — The Cost of Generative AI Collaboration Strategies", "year": "2026", "desc": "", "audio": "Logg%20et%20al.%20%282026%29%20%E2%80%94%20The%20Cost%20of%20Generative%20AI%20Collaboration%20Strategies/Logg_et_al_2026_The_Cost_of_Generative_AI_Collaboration_Strategies_radio.mp3", "img": ""}, {"title": "Smolla and Akcay (2019) — Cultural selection shapes network structure", "year": "2019", "desc": "本ドキュメントは、Marco Smolla氏とErol Akçay氏による研究論文「Cultural selection shapes network structure（文化選択がネットワーク構造を形成する）」の深い分析に基づき、社会ネットワークと文化進化の相互作用についてまとめたものである。 本研究は、人口の社会ネットワーク構造が文化の伝達に影響を与えるだけでなく、どのような文化的特性（スキル", "audio": "Smolla%20and%20Akcay%20%282019%29%20%E2%80%94%20Cultural%20selection%20shapes%20network%20structure/Smolla_and_Akcay_2019_Cultural_selection_shapes_network_structure_radio.mp3", "img": ""}, {"title": "Glickman and Sharot (2025) — How human AI feedback loops", "year": "2025", "desc": "本資料は、人間と人工知能（AI）の相互作用が、人間の知覚、感情、および社会的判断における偏見（バイアス）をどのように増幅させるかを調査した研究結果をまとめたものである。 1,401名の参加者を対象とした一連の実験により、**「人間とAIのフィードバックループ」**の存在が明らかになった。このループにおいて、AIは学習データに含まれる微細な人間由来の偏見を増幅して出力し、人間はそのAIの出力を学習す", "audio": "Glickman%20and%20Sharot%20%282025%29%20%E2%80%94%20How%20human%20AI%20feedback%20loops/Glickman_and_Sharot_2025_How_human_AI_feedback_loops_radio.mp3", "img": ""}, {"title": "Yang et al. (2017) — Medical robotics", "year": "2017", "desc": "医療用ロボット工学は、低侵襲手術、標的治療、病院の最適化から緊急対応、義肢、在宅支援に至るまで、医療機器業界の中で最も急速に成長している分野の一つである。技術が進歩し、自律性が高まるにつれ、規制、倫理、法的な障壁が顕在化しており、これらを慎重に検討する必要がある。 本ドキュメントでは、自動運転車の定義を参考に提案された「医療用ロボットにおける6段階の自律性レベル」を軸に、技術的要件、規制上のコスト", "audio": "Yang%20et%20al.%20%282017%29%20%E2%80%94%20Medical%20robotics/yang2017_medical_robotics_radio.mp3", "img": ""}, {"title": "Battaglia et al. (2021) — Autonomous surgery", "year": "2021", "desc": "本報告書は、論文「Rethinking Autonomous Surgery: Focusing on Enhancement over Autonomy（自律型手術の再考：自律性から機能強化への焦点移行）」に基づき、手術支援ロボットの現状、技術的課題、および将来の方向性についてまとめたものである。 ---", "audio": "Battaglia%20et%20al.%20%282021%29%20%E2%80%94%20Autonomous%20surgery/battaglia2021_autonomous_surgery_radio.mp3", "img": ""}, {"title": "Ehrsson (2020) — Multisensory processes in body ownership", "year": "2020", "desc": "", "audio": "Ehrsson%20%282020%29%20%E2%80%94%20Multisensory%20processes%20in%20body%20ownership/Ehrsson_2020_Multisensory_processes_in_body_ownership_radio.mp3", "img": ""}];

function render() {
  document.getElementById('ep-count').textContent = EPISODES.length;
  var html = '';
  for (var i = 0; i < EPISODES.length; i++) {
    var ep = EPISODES[i];
    var imgHtml = ep.img
      ? '<img class="card-img" src="' + ep.img + '" alt="" loading="lazy">'
      : '<div class="card-img">🎧</div>';
    html += '<div class="card" onclick="play(' + i + ')">'
      + imgHtml
      + '<div class="card-body">'
      + '<h3>' + ep.title + '</h3>'
      + '<div class="year">' + (ep.year || '') + '</div>'
      + '<div class="desc">' + (ep.desc || '') + '</div>'
      + '</div></div>';
  }
  document.getElementById('episodes').innerHTML = html;
}

function play(i) {
  var ep = EPISODES[i];
  var np = document.getElementById('now-playing');
  np.style.display = 'block';
  document.getElementById('np-img').src = ep.img || '';
  document.getElementById('np-title').textContent = ep.title;
  document.getElementById('np-desc').textContent = ep.desc || '';
  var p = document.getElementById('player');
  p.src = ep.audio;
  p.play();
  np.scrollIntoView({behavior: 'smooth'});
}

render();
</script>
</body>
</html>
