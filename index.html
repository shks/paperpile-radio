<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#121212">
<title>Paperpile Radio 🎧</title>
<style>
  :root { --bg:#121212; --card:#181818; --card-hover:#282828; --text:#fff; --muted:#b3b3b3; --sub:#a7a7a7; --green:#1db954; --green-hover:#1ed760; --track:#4d4d4d; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html { scroll-behavior:smooth; }
  body { background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif; line-height:1.5; padding-bottom:130px; }
  a { color:var(--muted); }
  a:hover { color:var(--text); }

  /* ---- hero ---- */
  .hero { background:linear-gradient(180deg,#1f4a38 0%,#16281f 45%,var(--bg) 100%); padding:56px 24px 36px; }
  .hero-inner { max-width:1200px; margin:0 auto; display:flex; align-items:flex-end; gap:28px; }
  .hero-inner > div { min-width:0; }
  .hero-art { width:168px; height:168px; flex-shrink:0; border-radius:10px; background:linear-gradient(135deg,#1db954,#0e5c2f 60%,#083b1e); display:flex; align-items:center; justify-content:center; font-size:72px; box-shadow:0 16px 48px rgba(0,0,0,.55); }
  .eyebrow { font-size:.78rem; font-weight:700; letter-spacing:.06em; }
  .hero h1 { font-size:clamp(2.2rem,5.5vw,4.2rem); font-weight:900; letter-spacing:-.02em; line-height:1.1; margin:.2em 0 .25em; }
  .hero-desc { color:var(--muted); font-size:.95rem; }
  .hero-meta { color:var(--muted); font-size:.85rem; margin-top:.6em; }
  .hero-meta b { color:var(--text); font-weight:700; }

  /* ---- episode grid ---- */
  main { max-width:1200px; margin:0 auto; padding:0 24px; }
  .section-title { font-size:1.45rem; font-weight:800; margin:28px 0 18px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:22px; }
  .card { background:var(--card); border-radius:8px; padding:14px; cursor:pointer; transition:background .25s; }
  .card:hover { background:var(--card-hover); }
  .card-art { position:relative; aspect-ratio:1/1; border-radius:6px; overflow:hidden; margin-bottom:12px; box-shadow:0 8px 24px rgba(0,0,0,.4); }
  .card-art img, .card-art .ph { width:100%; height:100%; object-fit:cover; display:flex; align-items:center; justify-content:center; font-size:52px; }
  .card h3 { font-size:.95rem; font-weight:700; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .card-meta { color:var(--sub); font-size:.8rem; line-height:1.6; margin-top:.4em; display:-webkit-box; -webkit-line-clamp:5; -webkit-box-orient:vertical; overflow:hidden; }
  .card.active h3 { color:var(--green); }
  .card-play { position:absolute; right:8px; bottom:8px; width:44px; height:44px; border:none; border-radius:50%; background:var(--green); color:#000; display:flex; align-items:center; justify-content:center; cursor:pointer; opacity:0; transform:translateY(8px); transition:opacity .25s,transform .25s,background .15s; box-shadow:0 8px 16px rgba(0,0,0,.5); }
  .card:hover .card-play { opacity:1; transform:none; }
  .card-play:hover { background:var(--green-hover); transform:scale(1.05); }
  .card-play svg { width:18px; height:18px; fill:currentColor; }
  .eq { position:absolute; left:10px; bottom:10px; display:none; gap:2.5px; align-items:flex-end; height:16px; }
  .card.active .eq { display:flex; }
  .eq i { width:3px; height:5px; background:var(--green); border-radius:1px; animation:eq 1.1s infinite ease-in-out; }
  .eq i:nth-child(2) { animation-delay:.25s; }
  .eq i:nth-child(3) { animation-delay:.5s; }
  @keyframes eq { 0%,100%{height:5px} 50%{height:16px} }
  body:not(.playing) .eq i { animation-play-state:paused; }

  footer { text-align:center; padding:44px 0 24px; color:var(--sub); font-size:.8rem; }

  /* ---- now-playing panel ---- */
  main, .hero-inner { transition:margin-right .3s; }
  .panel { position:fixed; top:0; right:0; bottom:86px; width:min(580px,46vw); max-width:100vw; background:#121212; border-left:1px solid #282828; z-index:40; transform:translateX(102%); transition:transform .3s; overflow-y:auto; overscroll-behavior:contain; }
  body.panel-open .panel { transform:none; }
  .panel-head { position:sticky; top:0; z-index:2; display:flex; justify-content:space-between; align-items:center; padding:10px 14px; background:rgba(18,18,18,.88); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); }
  .panel-label { font-size:.75rem; font-weight:700; letter-spacing:.05em; color:var(--muted); }
  .panel-art img { width:100%; display:block; cursor:zoom-in; }
  .panel-art .ph { width:100%; height:180px; display:flex; align-items:center; justify-content:center; font-size:56px; background:linear-gradient(135deg,#1f3d2f,#132218); }
  .panel-body { padding:18px 20px 40px; }
  .panel-body h2 { font-size:1.05rem; font-weight:800; line-height:1.4; }
  .panel-year { color:var(--sub); font-size:.8rem; margin:.3em 0 1em; }
  .links-row { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:1.2em; }
  .pill { display:inline-flex; align-items:center; gap:6px; border:1px solid #3e3e3e; border-radius:999px; padding:6px 14px; font-size:.78rem; color:var(--text); background:none; text-decoration:none; cursor:pointer; transition:border-color .15s,transform .1s; }
  .pill:hover { border-color:#fff; color:var(--text); transform:scale(1.03); }
  .md { color:#c9c9c9; font-size:.86rem; line-height:1.75; }
  .md h2 { font-size:1rem; color:#fff; margin:1.5em 0 .5em; }
  .md h3 { font-size:.92rem; color:#fff; margin:1.2em 0 .4em; }
  .md h4 { font-size:.86rem; color:#fff; margin:1em 0 .3em; }
  .md p { margin:.6em 0; }
  .md ul, .md ol { margin:.4em 0 .9em; padding-left:1.4em; }
  .md li { margin:.28em 0; }
  .md strong { color:#fff; }
  .md hr { border:none; border-top:1px solid #2e2e2e; margin:1.3em 0; }
  .md code { background:#2a2a2a; padding:.1em .4em; border-radius:4px; font-size:.85em; }
  .md a { color:var(--green); }
  .md-missing { color:var(--sub); font-size:.85rem; }
  @media (min-width:761px) {
    body.panel-open main, body.panel-open .hero-inner { margin-right:calc(min(580px,46vw) + 16px); }
  }

  /* ---- lightbox ---- */
  .lightbox { position:fixed; inset:0; z-index:100; background:rgba(0,0,0,.93); display:none; overflow:auto; cursor:zoom-out; }
  .lightbox.open { display:block; }
  .lightbox img { display:block; margin:28px auto; width:min(96vw,1400px); }

  /* ---- player bar ---- */
  .playerbar { position:fixed; left:0; right:0; bottom:0; z-index:50; background:#181818; border-top:1px solid #282828; display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1.5fr) minmax(0,1fr); align-items:center; gap:16px; padding:12px 18px; min-height:86px; }
  .pb-left { display:flex; align-items:center; gap:12px; min-width:0; cursor:pointer; }
  .pb-art { width:56px; height:56px; flex-shrink:0; border-radius:6px; overflow:hidden; background:linear-gradient(135deg,#2a2a2a,#1a1a1a); display:flex; align-items:center; justify-content:center; font-size:24px; }
  .pb-art img { width:100%; height:100%; object-fit:cover; }
  .pb-info { min-width:0; }
  .pb-title { font-size:.85rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .pb-sub { font-size:.75rem; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .pb-center { display:flex; flex-direction:column; align-items:center; gap:7px; min-width:0; }
  .pb-buttons { display:flex; align-items:center; gap:18px; }
  .ctl { background:none; border:none; color:var(--muted); cursor:pointer; padding:2px; display:flex; }
  .ctl:hover { color:var(--text); }
  .ctl svg { width:17px; height:17px; fill:currentColor; }
  .play-btn { width:34px; height:34px; border:none; border-radius:50%; background:#fff; color:#000; display:flex; align-items:center; justify-content:center; cursor:pointer; transition:transform .1s; }
  .play-btn:hover { transform:scale(1.07); }
  .play-btn svg { width:17px; height:17px; fill:currentColor; }
  .pb-progress { display:flex; align-items:center; gap:9px; width:100%; max-width:600px; }
  .pb-progress time { font-size:.7rem; color:var(--sub); min-width:35px; text-align:center; font-variant-numeric:tabular-nums; }
  .pb-right { display:flex; align-items:center; justify-content:flex-end; gap:14px; min-width:0; }
  #vu { width:150px; height:38px; background:#0a0a0a; border-radius:5px; flex-shrink:0; }
  .vol-wrap { display:flex; align-items:center; gap:7px; color:var(--muted); }
  .vol-wrap svg { width:16px; height:16px; fill:currentColor; flex-shrink:0; }
  #vol { width:92px; }

  /* ---- sliders ---- */
  input[type=range] { -webkit-appearance:none; appearance:none; height:4px; border-radius:2px; flex:1; background:linear-gradient(to right,var(--fill,#fff) var(--p,0%),var(--track) var(--p,0%)); cursor:pointer; outline:none; }
  input[type=range]:hover { --fill:var(--green); }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; width:12px; height:12px; border-radius:50%; background:#fff; opacity:0; transition:opacity .15s; }
  input[type=range]:hover::-webkit-slider-thumb { opacity:1; }
  input[type=range]::-moz-range-thumb { width:12px; height:12px; border:none; border-radius:50%; background:#fff; opacity:0; transition:opacity .15s; }
  input[type=range]:hover::-moz-range-thumb { opacity:1; }

  @media (max-width:760px) {
    .hero { padding:36px 18px 24px; }
    .hero-inner { gap:18px; }
    .hero-art { width:104px; height:104px; font-size:44px; }
    .hero h1 { font-size:clamp(1.5rem,7.5vw,2.4rem); }
    .hero-meta { font-size:.78rem; }
    main { padding:0 18px; }
    .grid { grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:16px; }
    .card-meta { -webkit-line-clamp:3; }
    .playerbar { grid-template-columns:minmax(0,1fr) auto; grid-template-rows:auto auto; row-gap:8px; }
    .pb-left { grid-column:1; grid-row:1; }
    .pb-right { grid-column:2; grid-row:1; }
    .pb-center { grid-column:1/-1; grid-row:2; }
    .pb-art { width:42px; height:42px; }
    #vu { width:104px; height:32px; }
    .vol-wrap { display:none; }
    body { padding-bottom:150px; }
    .panel { width:100%; bottom:0; border-left:none; }
    .panel-body { padding-bottom:170px; }
  }
</style>
</head>
<body>

<div class="hero">
  <div class="hero-inner">
    <div class="hero-art">🎧</div>
    <div>
      <div class="eyebrow">公開ポッドキャスト</div>
      <h1>Paperpile Radio</h1>
      <p class="hero-desc">論文の音声概要ポッドキャスト — NotebookLM AIによる日本語ダイジェスト</p>
      <p class="hero-meta"><b>Paperpile Radio</b> · 全 <b id="ep-count">0</b> エピソード · <a href="feed.xml">RSS Feed</a></p>
    </div>
  </div>
</div>

<main>
  <h2 class="section-title">すべてのエピソード</h2>
  <div class="grid" id="episodes"></div>
  <footer>
    Generated by <a href="https://github.com/shks/paperpile-radio">Paperpile Radio</a> ·
    <a href="feed.xml">RSS Feed</a> ·
    Powered by NotebookLM
  </footer>
</main>

<aside class="panel" id="panel">
  <div class="panel-head">
    <span class="panel-label">エピソード解説</span>
    <button class="ctl" id="panel-close" aria-label="閉じる"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" fill="none"/></svg></button>
  </div>
  <div class="panel-art" id="panel-art"></div>
  <div class="panel-body">
    <h2 id="panel-title"></h2>
    <div class="panel-year" id="panel-year"></div>
    <div class="links-row" id="panel-links"></div>
    <div class="md" id="panel-md"></div>
  </div>
</aside>
<div class="lightbox" id="lightbox"><img id="lightbox-img" alt="インフォグラフィック拡大表示"></div>

<div class="playerbar">
  <div class="pb-left" id="pb-left" title="解説パネルを開く">
    <div class="pb-art" id="pb-art">🎧</div>
    <div class="pb-info">
      <div class="pb-title" id="pb-title">Paperpile Radio</div>
      <div class="pb-sub" id="pb-sub">エピソードを選んでください</div>
    </div>
  </div>
  <div class="pb-center">
    <div class="pb-buttons">
      <button class="ctl" id="btn-prev" aria-label="前のエピソード"><svg viewBox="0 0 24 24"><path d="M6 6h2.5v12H6zM20 6l-10.5 6L20 18z"/></svg></button>
      <button class="play-btn" id="btn-play" aria-label="再生 / 一時停止">
        <svg id="ic-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        <svg id="ic-pause" viewBox="0 0 24 24" style="display:none"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>
      </button>
      <button class="ctl" id="btn-next" aria-label="次のエピソード"><svg viewBox="0 0 24 24"><path d="M15.5 6H18v12h-2.5zM4 6l10.5 6L4 18z"/></svg></button>
    </div>
    <div class="pb-progress">
      <time id="t-cur">0:00</time>
      <input type="range" id="seek" min="0" max="0" step="0.1" value="0" aria-label="シーク">
      <time id="t-dur">0:00</time>
    </div>
  </div>
  <div class="pb-right">
    <canvas id="vu" aria-hidden="true"></canvas>
    <div class="vol-wrap">
      <svg viewBox="0 0 24 24"><path d="M3 10v4h4l5 4V6L7 10H3zm13.5 2a3.5 3.5 0 0 0-2-3.15v6.3a3.5 3.5 0 0 0 2-3.15zm-2-7v2.06A5 5 0 0 1 18 12a5 5 0 0 1-3.5 4.94V19A7 7 0 0 0 20 12a7 7 0 0 0-5.5-7z"/></svg>
      <input type="range" id="vol" min="0" max="1" step="0.01" value="1" aria-label="音量">
    </div>
  </div>
</div>

<audio id="player" preload="none"></audio>

<script>
var EPISODES = [{"title": "Guterstam et al. (2020) — Duplication of the bodily self", "year": "2020", "desc": "本レポートは、Guterstamら（2020年）による、多感覚統合を通じて人間の健康な参加者に「二つの身体を同時に所有している」および「二つの場所に同時に存在している」という感覚（錯覚）を誘発できるかを検証した研究をまとめたものである。 本研究は、健康な人間が二つの全身を同時に所有し、さらに単一であるはずの自己位置の感覚を二つに分割できるかどうかを調査した。ヘッドマウントディスプレイ（HMD）を用", "audio": "episodes/Guterstam%20et%20al.%20%282020%29%20%E2%80%94%20Duplication%20of%20the%20bodily%20self/Guterstam_2020_radio.mp3", "img": "episodes/Guterstam%20et%20al.%20%282020%29%20%E2%80%94%20Duplication%20of%20the%20bodily%20self/Guterstam_2020_infographic.png", "report": "episodes/Guterstam%20et%20al.%20%282020%29%20%E2%80%94%20Duplication%20of%20the%20bodily%20self/Guterstam_2020_report.md", "paper": ""}, {"title": "Zhang et al. (2022) — Working memory for spatial sequences", "year": "2022", "desc": "本ドキュメントは、Zhangら（2022年）による研究「Working Memory for Spatial Sequences: Developmental and Evolutionary Factors in Encoding Ordinal and Relational Structures」に基づき、ヒトの大人、子供、およびマカクザルにおける空間シーケンスの保持と符号化メカニズムを比較・", "audio": "episodes/Zhang%20et%20al.%20%282022%29%20%E2%80%94%20Working%20memory%20for%20spatial%20sequences/Zhang_2022_radio.mp3", "img": "episodes/Zhang%20et%20al.%20%282022%29%20%E2%80%94%20Working%20memory%20for%20spatial%20sequences/Zhang_2022_infographic.png", "report": "episodes/Zhang%20et%20al.%20%282022%29%20%E2%80%94%20Working%20memory%20for%20spatial%20sequences/Zhang_2022_report.md", "paper": ""}, {"title": "Andres et al. (2020) — Introducing Peripheral Awareness as a Neurological State for Human-computer Integration", "year": "2020", "desc": "本ドキュメントは、人間とコンピュータの統合（Human-Computer Integration）における新たな神経学的状態として「周辺視野意識（Peripheral Awareness）」を導入した研究報告書「Ena, the eBike」に基づく要約である。 従来、人間とコンピュータの関係は「操作（Interaction）」や「拡張（Augmentation）」の枠組みで捉えられてきたが、本研", "audio": "episodes/Andres%20et%20al.%20%282020%29%20%E2%80%94%20Introducing%20Peripheral%20Awareness%20as%20a%20Neurological%20State%20for%20Human-computer%20Integration/Andres_2020_radio.mp3", "img": "episodes/Andres%20et%20al.%20%282020%29%20%E2%80%94%20Introducing%20Peripheral%20Awareness%20as%20a%20Neurological%20State%20for%20Human-computer%20Integration/Andres_2020_infographic.png", "report": "episodes/Andres%20et%20al.%20%282020%29%20%E2%80%94%20Introducing%20Peripheral%20Awareness%20as%20a%20Neurological%20State%20for%20Human-computer%20Integration/Andres_2020_report.md", "paper": ""}, {"title": "Farooq and Grudin (2017) — Paradigm Shift from Human Computer Interaction to Integration", "year": "2017", "desc": "本資料は、Umer Farooq氏（Facebook）とJonathan T. Grudin氏（Microsoft）による論文およびCHI 2017での議論に基づき、人間とコンピュータの関係性における歴史的な転換点を分析したものである。 長年続いてきた「人間とコンピュータの相互作用（HCI）」の時代は、人間とソフトウェアが互いに自律性を持って行動し、パートナーシップを築く「人間とコンピュータの統合", "audio": "episodes/Farooq%20and%20Grudin%20%282017%29%20%E2%80%94%20Paradigm%20Shift%20from%20Human%20Computer%20Interaction%20to%20Integration/Farooq_Grudin_2017_radio.mp3", "img": "episodes/Farooq%20and%20Grudin%20%282017%29%20%E2%80%94%20Paradigm%20Shift%20from%20Human%20Computer%20Interaction%20to%20Integration/Farooq_Grudin_2017_infographic.png", "report": "episodes/Farooq%20and%20Grudin%20%282017%29%20%E2%80%94%20Paradigm%20Shift%20from%20Human%20Computer%20Interaction%20to%20Integration/Farooq_Grudin_2017_report.md", "paper": ""}, {"title": "Pataranutaporn et al. (2021) — Machinoia, Machine of Multiple Me", "year": "2021", "desc": "本文書は、MITメディアラボの研究者らによって提案されたウェアラブル・インスタレーション「Machinoia（マキノイア）」に関する包括的な分析である。Machinoiaは、AI（人工知能）を用いてユーザーの「過去の自己」と「未来の自己」を2つの追加の頭部として具現化し、それらと対話することを可能にする共生的な拡張システムである。 このプロジェクトの核心は、身体と精神の境界が固定されたものではなく", "audio": "episodes/Pataranutaporn%20et%20al.%20%282021%29%20%E2%80%94%20Machinoia%2C%20Machine%20of%20Multiple%20Me/Pataranutaporn_2021_radio.mp3", "img": "", "report": "episodes/Pataranutaporn%20et%20al.%20%282021%29%20%E2%80%94%20Machinoia%2C%20Machine%20of%20Multiple%20Me/pataranutaporn2021_report.md", "paper": ""}, {"title": "Ehrsson (2009) — How many arms make a pair", "year": "2009", "desc": "本資料は、H. Henrik Ehrsso %80%94%20Review%20of%20Image%20Memorability%20Prediction/Liu_et_al_2019_report.md", "paper": ""}, {"title": "Tanaka and Watanabe (2018) — Effects of model types in observational learning on implicit sequential learning", "year": "2018", "desc": "本ドキュメントは、田中（Kanji Tanaka）および渡辺（Katsumi Watanabe）による2018年の研究「Effects of model types in observational learning on implicit sequential learning（観察学習におけるモデルのタイプが潜在的潜在的系列学習に与える影響）」に基づき、主要な知見、分析、および実用的な洞察をま", "audio": "episodes/Tanaka%20and%20Watanabe%20%282018%29%20%E2%80%94%20Effects%20of%20model%20types%20in%20observational%20learning%20on%20implicit%20sequential%20learning/Tanaka_and_Watanabe_2018_radio.mp3", "img": "episodes/Tanaka%20and%20Watanabe%20%282018%29%20%E2%80%94%20Effects%20of%20model%20types%20in%20observational%20learning%20on%20implicit%20sequential%20learning/Tanaka_and_Watanabe_2018_infographic.png", "report": "episodes/Tanaka%20and%20Watanabe%20%282018%29%20%E2%80%94%20Effects%20of%20model%20types%20in%20observational%20learning%20on%20implicit%20sequential%20learning/Tanaka_and_Watanabe_2018_report.md", "paper": ""}, {"title": "Vechev et al. (2019) — TacTiles", "year": "2019", "desc": "本文書は、ETH ZurichおよびEPFLの研究チームによって開発された革新的な触覚アクチュエータ「TacTiles」に関する詳細なブリーフィングである。VR（バーチャルリアリティ）空間における没入感を高めるためには、仮想物体との接触や表面の質感をリアルに伝える触覚フィードバックが不可欠である。 TacTilesは、従来の振動型アクチュエータの限界を克服し、小型（1cm³）、軽量（1.8g）、か", "audio": "episodes/Vechev%20et%20al.%20%282019%29%20%E2%80%94%20TacTiles/Vechev_et_al_2019_radio.mp3", "img": "episodes/Vechev%20et%20al.%20%282019%29%20%E2%80%94%20TacTiles/Vechev_et_al_2019_infographic.png", "report": "episodes/Vechev%20et%20al.%20%282019%29%20%E2%80%94%20TacTiles/Vechev_et_al_2019_report.md", "paper": ""}, {"title": "Heiner and Asokan (2008) — Using Salience Differentials", "year": "2008", "desc": "本ドキュメントは、Andreas Heiner氏およびN. Asokan氏（Nokia Research Center）による研究「Using Salience Differentials to Making Visual Cues Noticeable」に基づき、ユーザーインターフェース設計における視覚的メッセージの視認性を高めるための新しいアプローチをまとめたものである。 ---", "audio": "episodes/Heiner%20and%20Asokan%20%282008%29%20%E2%80%94%20Using%20Salience%20Differentials/Heiner_and_Asokan_2008_radio.mp3", "img": "episodes/Heiner%20and%20Asokan%20%282008%29%20%E2%80%94%20Using%20Salience%20Differentials/Heiner_and_Asokan_2008_infographic.png", "report": "episodes/Heiner%20and%20Asokan%20%282008%29%20%E2%80%94%20Using%20Salience%20Differentials/Heiner_and_Asokan_2008_report.md", "paper": ""}, {"title": "Tajadura-Jiménez et al. (2015) — As Light as your Footsteps", "year": "2015", "desc": "本報告書は、歩行時に発生する自身の足音の周波数特性をリアルタイムで変化させることにより、個人の身体知覚、情動、および歩行行動（歩容）にどのような影響を及ぼすかを調査した研究に基づいている。 現代社会における運動不足や身体イメージへの懸念という課題に対し、従来の目標設定や報酬に基づくアプローチとは異なる、神経科学的知見を活用した新しい手法が提案されている。研究の結果、足音の高周波成分を強調することで", "audio": "episodes/Tajadura-Jim%C3%A9nez%20et%20al.%20%282015%29%20%E2%80%94%20As%20Light%20as%20your%20Footsteps/Tajadura_Jimenez_et_al_2015_radio.mp3", "img": "episodes/Tajadura-Jim%C3%A9nez%20et%20al.%20%282015%29%20%E2%80%94%20As%20Light%20as%20your%20Footsteps/Tajadura_Jimenez_et_al_2015_infographic.png", "report": "episodes/Tajadura-Jim%C3%A9nez%20et%20al.%20%282015%29%20%E2%80%94%20As%20Light%20as%20your%20Footsteps/Tajadura_Jimenez_et_al_2015_report.md", "paper": ""}, {"title": "Umezawa et al. (2022) — Bodily ownership of an independent supernumerary limb", "year": "2022", "desc": "本報告書は、梅澤氏ら（2022年）による、既存の肢とは独立して制御・感覚フィードバックが可能な「第六の指」を用いた探索的研究の結果をまとめたものである。 従来、身体所有感（人工物が自分の身体の一部であると感じる感覚）の研究は、主に既存の肢を置き換える「代替肢」に焦点を当ててきた。しかし、本研究は「他のどの肢とも独立して動き、独自の感覚フィードバックを提供する人工肢を、脳は自らの身体として認識できる", "audio": "episodes/Umezawa%20et%20al.%20%282022%29%20%E2%80%94%20Bodily%20ownership%20of%20an%20independent%20supernumerary%20limb/Umezawa_et_al_2022_radio.mp3", "img": "episodes/Umezawa%20et%20al.%20%282022%29%20%E2%80%94%20Bodily%20ownership%20of%20an%20independent%20supernumerary%20limb/Umezawa_et_al_2022_infographic.png", "report": "episodes/Umezawa%20et%20al.%20%282022%29%20%E2%80%94%20Bodily%20ownership%20of%20an%20independent%20supernumerary%20limb/Umezawa_et_al_2022_report.md", "paper": ""}, {"title": "Krakauer et al. (2019) — Motor Learning", "year": "2019", "desc": "本文書は、Krakauerら（2019年）による「Motor Learning」の深層分析に基づき、運動学習の定義、主要な研究パラダイム、神経科学的基盤、および将来の展望をまとめたものである。 ---", "audio": "episodes/Krakauer%20et%20al.%20%282019%29%20%E2%80%94%20Motor%20Learning/Krakauer_et_al_2019_radio.mp3", "img": "episodes/Krakauer%20et%20al.%20%282019%29%20%E2%80%94%20Motor%20Learning/Krakauer_et_al_2019_infographic.png", "report": "episodes/Krakauer%20et%20al.%20%282019%29%20%E2%80%94%20Motor%20Learning/Krakauer_et_al_2019_report.md", "paper": ""}, {"title": "Kirby et al. (2019) — Brain functional differences in visuo-motor task adaptation between dominant and non-dominant hand training", "year": "2019", "desc": "本資料は、視覚運動課題の習得および新しい条件への適応における、利き手（右手）と非利き手（左手）のトレーニングが脳機能に与える影響を比較した研究（Kirby et al., 2019）を分析したものである。 研究の結果、利き手と非利き手のどちらを訓練するかによって、脳の活動パターンが大幅に異なることが明らかになった。非利き手のトレーニングは、課題習得中の視覚および運動領域（左中後頭回、左中心前回）の", "audio": "episodes/Kirby%20et%20al.%20%282019%29%20%E2%80%94%20Brain%20functional%20differences%20in%20visuo-motor%20task%20adaptation%20between%20dominant%20and%20non-dominant%20hand%20training/Kirby_et_al_2019_radio.mp3", "img": "episodes/Kirby%20et%20al.%20%282019%29%20%E2%80%94%20Brain%20functional%20differences%20in%20visuo-motor%20task%20adaptation%20between%20dominant%20and%20non-dominant%20hand%20training/Kirby_et_al_2019_infographic.png", "report": "episodes/Kirby%20et%20al.%20%282019%29%20%E2%80%94%20Brain%20functional%20differences%20in%20visuo-motor%20task%20adaptation%20between%20dominant%20and%20non-dominant%20hand%20training/Kirby_et_al_2019_report.md", "paper": ""}, {"title": "Longo et al. (2022) — Distortion of mental body representations", "year": "2022", "desc": "Trends in Cognitive Sciences, March 2022, Vol. 26, No. 3 * **健康な人においても身体表現の歪みは一般的である:** 身体の歪みや誤認は摂食障害や慢性疼痛などの臨床疾患において顕著な特徴ですが、疾患特有のものではなく、健康な人においても触覚の空間知覚、固有受容覚、意識的な身体イメージなどの領域で一般的に存在します。", "audio": "episodes/Longo%20et%20al.%20%282022%29%20%E2%80%94%20Distortion%20of%20mental%20body%20representations/Longo_et_al_2022_radio.mp3", "img": "episodes/Longo%20et%20al.%20%282022%29%20%E2%80%94%20Distortion%20of%20mental%20body%20representations/Longo_et_al_2022_infographic.png", "report": "episodes/Longo%20et%20al.%20%282022%29%20%E2%80%94%20Distortion%20of%20mental%20body%20representations/Longo_et_al_2022_report.md", "paper": ""}, {"title": "Taylor-Clarke et al. (2004) — Keeping the world a constant size", "year": "2004", "desc": "Nature Neuroscience, 2004 * **部位による触覚距離の知覚バイアス（ウェーバーの錯覚）:** 触覚受容器の密度が高い部位（指や顔など）では、密度が低い部位（前腕や背中など）に比べて、同じ物理的距離の触覚刺激をより長く（大きく）感じる傾向があります。しかし、この知覚の差は、実際の受容器密度の違いから予測されるほどの大きさではありません。", "audio": "episodes/Taylor-Clarke%20et%20al.%20%282004%29%20%E2%80%94%20Keeping%20the%20world%20a%20constant%20size/TaylorClarke_et_al_2004_radio.mp3", "img": "episodes/Taylor-Clarke%20et%20al.%20%282004%29%20%E2%80%94%20Keeping%20the%20world%20a%20constant%20size/TaylorClarke_et_al_2004_infographic.png", "report": "episodes/Taylor-Clarke%20et%20al.%20%282004%29%20%E2%80%94%20Keeping%20the%20world%20a%20constant%20size/TaylorClarke_et_al_2004_report.md", "paper": ""}, {"title": "Nishida et al. (2019) — Demonstrating preemptive reaction", "year": "2019", "desc": "本資料は、西田氏ら（2019年）による、電気筋肉刺激（EMS）を用いて人間の反応速度を加速させつつ、自らが行動を起こしたという感覚（主体性：Sense of Agency）を維持する技術「プリエンプティブ・リアクション（先行的反応）」に関する研究をまとめたものである。 従来のハプティック・インターフェースやEMSを用いた支援システムは、反応速度を大幅に向上させる一方で、ユーザーの意図に基づかない不", "audio": "episodes/Nishida%20et%20al.%20%282019%29%20%E2%80%94%20Demonstrating%20preemptive%20reaction/Nishida_et_al_2019_radio.mp3", "img": "episodes/Nishida%20et%20al.%20%282019%29%20%E2%80%94%20Demonstrating%20preemptive%20reaction/Nishida_et_al_2019_infographic.png", "report": "episodes/Nishida%20et%20al.%20%282019%29%20%E2%80%94%20Demonstrating%20preemptive%20reaction/Nishida_et_al_2019_report.md", "paper": ""}, {"title": "Cataldo et al. (2022) — Interplay of tactile and motor information in constructing spatial self-perception", "year": "2022", "desc": "本ドキュメントは、Cataldoら（2022年）による研究「Interplay of tactile and motor information in constructing spatial self-perception（空間的自己知覚の構築における触覚情報と運動情報の相互作用）」に基づき、自己触覚における身体意識の形成メカニズムを分析したものである。 ---", "audio": "episodes/Cataldo%20et%20al.%20%282022%29%20%E2%80%94%20Interplay%20of%20tactile%20and%20motor%20information%20in%20constructing%20spatial%20self-perception/Cataldo_et_al_2022_radio.mp3", "img": "episodes/Cataldo%20et%20al.%20%282022%29%20%E2%80%94%20Interplay%20of%20tactile%20and%20motor%20information%20in%20constructing%20spatial%20self-perception/Cataldo_et_al_2022_infographic.png", "report": "episodes/Cataldo%20et%20al.%20%282022%29%20%E2%80%94%20Interplay%20of%20tactile%20and%20motor%20information%20in%20constructing%20spatial%20self-perception/Cataldo_et_al_2022_report.md", "paper": ""}, {"title": "Serino et al. (2015) — Tuning of temporo-occipital activity by frontal oscillations during virtual mirror exposure causes erroneous self-recognition", "year": "2015", "desc": "本資料は、Andrea Serino氏らによる研究「仮想鏡への露出中に生じる前頭部の振動による側頭後頭部活動の調整が、誤った自己認識を引き起こす（Tuning of temporo-occipital activity by frontal oscillations during virtual mirror exposure causes erroneous self-recognition）」", "audio": "episodes/Serino%20et%20al.%20%282015%29%20%E2%80%94%20Tuning%20of%20temporo-occipital%20activity%20by%20frontal%20oscillations%20during%20virtual%20mirror%20exposure%20causes%20erroneous%20self-recognition/Serino_et_al_2015_radio.mp3", "img": "episodes/Serino%20et%20al.%20%282015%29%20%E2%80%94%20Tuning%20of%20temporo-occipital%20activity%20by%20frontal%20oscillations%20during%20virtual%20mirror%20exposure%20causes%20erroneous%20self-recognition/Serino_et_al_2015_infographic.png", "report": "episodes/Serino%20et%20al.%20%282015%29%20%E2%80%94%20Tuning%20of%20temporo-occipital%20activity%20by%20frontal%20oscillations%20during%20virtual%20mirror%20exposure%20causes%20erroneous%20self-recognition/Serino_et_al_2015_report.md", "paper": ""}, {"title": "Hirashima and Nozaki (2012) — Distinct motor plans form and retrieve distinct motor memories for physically identical movements", "year": "2012", "desc": "本資料は、平島雅也氏および野崎大地氏による研究論文（2012年）に基づき、人間がいかにして異なる環境（力場）に適応し、複数の運動記憶を使い分けているかを分析したものである。 従来、特定の関節運動（運動学）に対しては、一度に一つの内部モデル（運動記憶）しか割り当てられないと考えられてきた。しかし、本研究は「運動計画（視覚空間における目標設定）」が異なる場合、**物理的な手の動きが全く同一であっても、", "audio": "episodes/Hirashima%20and%20Nozaki%20%282012%29%20%E2%80%94%20Distinct%20motor%20plans%20form%20and%20retrieve%20distinct%20motor%20memories%20for%20physically%20identical%20movements/Hirashima_and_Nozaki_2012_radio.mp3", "img": "episodes/Hirashima%20and%20Nozaki%20%282012%29%20%E2%80%94%20Distinct%20motor%20plans%20form%20and%20retrieve%20distinct%20motor%20memories%20for%20physically%20identical%20movements/Hirashima_and_Nozaki_2012_infographic.png", "report": "episodes/Hirashima%20and%20Nozaki%20%282012%29%20%E2%80%94%20Distinct%20motor%20plans%20form%20and%20retrieve%20distinct%20motor%20memories%20for%20physically%20identical%20movements/Hirashima_and_Nozaki_2012_report.md", "paper": ""}, {"title": "Quintard et al. (2020) — Getting closer", "year": "2020", "desc": "本ドキュメントは、Quintardら（2020年）による研究「Getting closer: Synchronous interpersonal multisensory stimulation increases closeness and attraction toward an opposite-sex other in female participants」に基づき、対人マルチセンサ刺激", "audio": "episodes/Quintard%20et%20al.%20%282020%29%20%E2%80%94%20Getting%20closer/Quintard_et_al_2020_radio.mp3", "img": "episodes/Quintard%20et%20al.%20%282020%29%20%E2%80%94%20Getting%20closer/Quintard_et_al_2020_infographic.png", "report": "episodes/Quintard%20et%20al.%20%282020%29%20%E2%80%94%20Getting%20closer/Quintard_et_al_2020_report.md", "paper": ""}, {"title": "Porciello et al. (2018) — The Enfacement illusion", "year": "2018", "desc": "本ドキュメントは、自己表象の構築、維持、および更新のメカニズムを解明するための窓口としての「アンフェイスメント（Enfacement）錯覚」に関する包括的な分析をまとめたものである。従来、自己の顔の認識は変化しにくい安定した構成概念と考えられてきたが、近年の研究により、多感覚統合プロセスの操作によって、他者の顔の特徴を自己の顔表象に取り込ませる「アンフェイスメント」という現象が頑健に発生することが", "audio": "episodes/Porciello%20et%20al.%20%282018%29%20%E2%80%94%20The%20Enfacement%20illusion/Porciello_et_al_2018_radio.mp3", "img": "episodes/Porciello%20et%20al.%20%282018%29%20%E2%80%94%20The%20Enfacement%20illusion/Porciello_et_al_2018_infographic.png", "report": "episodes/Porciello%20et%20al.%20%282018%29%20%E2%80%94%20The%20Enfacement%20illusion/Porciello_et_al_2018_report.md", "paper": ""}, {"title": "Sivkovich Fagin and Mack (2022) — Negative Color Aftereffect in the Absence of a Colored Stimulus", "year": "2022", "desc": "本ドキュメントは、Oksana Sivkovich FaginおよびArien Mackによる研究論文「Sivkovich Fagin and Mack 2022 - Negative Color Aftereffect.pdf」の深い分析に基づき、色彩刺激を伴わない負の補色残像の発生メカニズムとその心理学的・神経科学的意義をまとめたものである。 ---", "audio": "episodes/Sivkovich%20Fagin%20and%20Mack%20%282022%29%20%E2%80%94%20Negative%20Color%20Aftereffect%20in%20the%20Absence%20of%20a%20Colored%20Stimulus/Sivkovich_2022_NCA_radio.mp3", "img": "episodes/Sivkovich%20Fagin%20and%20Mack%20%282022%29%20%E2%80%94%20Negative%20Color%20Aftereffect%20in%20the%20Absence%20of%20a%20Colored%20Stimulus/Sivkovich_2022_NCA_infographic.png", "report": "episodes/Sivkovich%20Fagin%20and%20Mack%20%282022%29%20%E2%80%94%20Negative%20Color%20Aftereffect%20in%20the%20Absence%20of%20a%20Colored%20Stimulus/Sivkovich_2022_NCA_report.md", "paper": ""}, {"title": "Constant et al. (2022) — Judgments of agency are affected by sensory noise without recruiting metacognitive processing", "year": "2022", "desc": "本報告書は、人間が自らの行動とその結果をどの程度制御しているかという主観的な感覚、すなわち「エージェンシー判断（Judgments of Agency: JoAs）」が、感覚ノイズの下でどのような計算プロセスを経て形成されるかを分析したものである。 Constantら（2022年）の研究は、エージェンシー判断が確信度判断（Confidence Judgments）と同様にメタ認知的処理（信号の不確", "audio": "episodes/Constant%20et%20al.%20%282022%29%20%E2%80%94%20Judgments%20of%20agency%20are%20affected%20by%20sensory%20noise%20without%20recruiting%20metacognitive%20processing/Constant_2022_JOA_radio.mp3", "img": "episodes/Constant%20et%20al.%20%282022%29%20%E2%80%94%20Judgments%20of%20agency%20are%20affected%20by%20sensory%20noise%20without%20recruiting%20metacognitive%20processing/Constant_2022_JOA_infographic.png", "report": "episodes/Constant%20et%20al.%20%282022%29%20%E2%80%94%20Judgments%20of%20agency%20are%20affected%20by%20sensory%20noise%20without%20recruiting%20metacognitive%20processing/Constant_2022_JOA_report.md", "paper": ""}, {"title": "Ayala et al. (2015) — Concurrent adaptation to opposing visuomotor rotations by varying hand and body postures", "year": "2015", "desc": "本文書は、Ayalaら（2015年）による研究論文「手と身体の姿勢変化による相反する視覚運動回転への同時適応（Concurrent adaptation to opposing visuomotor rotations by varying hand and body postures）」の内容を網羅的に分析し、主要な知見、理論的背景、および実用的な洞察をまとめたものである。 ---", "audio": "episodes/Ayala%20et%20al.%20%282015%29%20%E2%80%94%20Concurrent%20adaptation%20to%20opposing%20visuomotor%20rotations%20by%20varying%20hand%20and%20body%20postures/ayala_2015_concurrent_adaptation_radio.mp3", "img": "episodes/Ayala%20et%20al.%20%282015%29%20%E2%80%94%20Concurrent%20adaptation%20to%20opposing%20visuomotor%20rotations%20by%20varying%20hand%20and%20body%20postures/ayala_2015_concurrent_adaptation_infographic.png", "report": "episodes/Ayala%20et%20al.%20%282015%29%20%E2%80%94%20Concurrent%20adaptation%20to%20opposing%20visuomotor%20rotations%20by%20varying%20hand%20and%20body%20postures/ayala_2015_concurrent_adaptation_report.md", "paper": ""}, {"title": "Tacikowski et al. (2020) — Perception", "year": "2020", "desc": "本資料は、Pawel Tacikowski氏らによる研究「自身の身体の知覚が自己概念に影響を与え、自己の不整合がエピソード記憶を損なう（Perception of Our Own Body Influences Self-Concept and Self-Incoherence Impairs Episodic Memory）」の主要な知見をまとめたものである。 この研究は、友人同士が身体を入れ替", "audio": "episodes/Tacikowski%20et%20al.%20%282020%29%20%E2%80%94%20Perception/Tacikowski%20et%20al.%20%282020%29_radio.mp3", "img": "episodes/Tacikowski%20et%20al.%20%282020%29%20%E2%80%94%20Perception/Tacikowski%20et%20al.%20%282020%29_infographic.png", "report": "episodes/Tacikowski%20et%20al.%20%282020%29%20%E2%80%94%20Perception/Tacikowski%20et%20al.%20%282020%29_report.md", "paper": ""}, {"title": "Kiridoshi et al. (2022) — Spatial auditory presentation", "year": "2022", "desc": "本資料は、仮想現実（VR）環境における「社会的実在感（Social Presence）」の向上において、他者の音響情報の空間化がいかに重要な役割を果たすかを調査した研究（Kiridoshi et al. 2022）の結果をまとめたものである。 現在の遠隔通信システムでは、他者の音声が空間情報（位置情報）を伴わずに提示されることが多い。本研究では、動的なバイノーラル合成システムを用い、「社会的サイモ", "audio": "episodes/Kiridoshi%20et%20al.%20%282022%29%20%E2%80%94%20Spatial%20auditory%20presentation/Kiridoshi%20et%20al.%20%282022%29_radio.mp3", "img": "episodes/Kiridoshi%20et%20al.%20%282022%29%20%E2%80%94%20Spatial%20auditory%20presentation/Kiridoshi%20et%20al.%20%282022%29_infographic.png", "report": "episodes/Kiridoshi%20et%20al.%20%282022%29%20%E2%80%94%20Spatial%20auditory%20presentation/Kiridoshi%20et%20al.%20%282022%29_report.md", "paper": ""}, {"title": "Will et al. (2021) — The Medusa effect reveals levels of mind perception in pictures", "year": "2021", "desc": "", "audio": "episodes/Will%20et%20al.%20%282021%29%20%E2%80%94%20The%20Medusa%20effect%20reveals%20levels%20of%20mind%20perception%20in%20pictures/Will%20et%20al.%202021_radio.mp3", "img": "episodes/Will%20et%20al.%20%282021%29%20%E2%80%94%20The%20Medusa%20effect%20reveals%20levels%20of%20mind%20perception%20in%20pictures/Will%20et%20al.%202021_infographic.png", "report": "", "paper": ""}, {"title": "Kasahara and Takada (2021) — Stealth Updates of Visual Information", "year": "2021", "desc": "本報告書は、ソニーコンピュータサイエンス研究所の笠原俊一氏と高田一馬氏による研究「変化盲と計算機によるモーフィングを活用した視覚情報の隠密更新（Stealth Updates of Visual Information）」を分析したものである。 現代のパーベイシブ・ディスプレイやウェアラブル・ディスプレイ（ARグラス等）において、情報の更新は不可欠だが、画面の変化はユーザーの注意を削ぎ、本来のタス", "audio": "episodes/Kasahara%20and%20Takada%20%282021%29%20%E2%80%94%20Stealth%20Updates%20of%20Visual%20Information/Kasahara%20and%20Takada%202021_radio.mp3", "img": "episodes/Kasahara%20and%20Takada%20%282021%29%20%E2%80%94%20Stealth%20Updates%20of%20Visual%20Information/Kasahara_and_Takada_2021_infographic.png", "report": "episodes/Kasahara%20and%20Takada%20%282021%29%20%E2%80%94%20Stealth%20Updates%20of%20Visual%20Information/Kasahara_and_Takada_2021_report.md", "paper": ""}, {"title": "Synofzik et al. (2008) — Beyond the comparator model - a multifactorial two-step account of agency", "year": "2008", "desc": "本文書は、Synofzikら（2008年）による論文「Beyond the comparator model: A multifactorial two-step account of agency（比較モデルを超えて：行為的主体性に関する多要因二段階の説明）」に基づき、行為的主体性（Sense of Agency: SoA）のメカニズム、従来の比較モデル（Comparator Model: CM", "audio": "episodes/Synofzik%20et%20al.%20%282008%29%20%E2%80%94%20Beyond%20the%20comparator%20model%20-%20a%20multifactorial%20two-step%20account%20of%20agency/Synofzik%20et%20al.%202008_radio.mp3", "img": "episodes/Synofzik%20et%20al.%20%282008%29%20%E2%80%94%20Beyond%20the%20comparator%20model%20-%20a%20multifactorial%20two-step%20account%20of%20agency/Synofzik_et_al_2008_infographic.png", "report": "episodes/Synofzik%20et%20al.%20%282008%29%20%E2%80%94%20Beyond%20the%20comparator%20model%20-%20a%20multifactorial%20two-step%20account%20of%20agency/Synofzik_et_al_2008_report.md", "paper": ""}, {"title": "Rhodes et al. (2003) — Fitting the mind to the world", "year": "2003", "desc": "本文書は、Gillian Rhodes氏らによる研究論文「FITTING THE MIND TO THE WORLD: Face Adaptation and Attractiveness Aftereffects（世界に適合する精神：顔の順応と魅力の残効）」に基づき、顔の知覚、魅力の基準、および経験が個人の美的嗜好をいかに形成するかについての主要な知見をまとめたものである。 本研究は、顔の「魅力", "audio": "episodes/Rhodes%20et%20al.%20%282003%29%20%E2%80%94%20Fitting%20the%20mind%20to%20the%20world/Rhodes_et_al_2003_radio.mp3", "img": "episodes/Rhodes%20et%20al.%20%282003%29%20%E2%80%94%20Fitting%20the%20mind%20to%20the%20world/Rhodes_et_al_2003_infographic.png", "report": "episodes/Rhodes%20et%20al.%20%282003%29%20%E2%80%94%20Fitting%20the%20mind%20to%20the%20world/Rhodes_et_al_2003_report.md", "paper": ""}, {"title": "Rashidi et al. (2021) — Right parietotemporal activity predicts sense of agency", "year": "2021", "desc": "本ドキュメントは、Rashidiら（2021年）による研究に基づき、自発的な行動とその結果として生じる感覚事象の間の時間的遅延が不確実な状況において、脳がどのように「行為主体感（Sense of Agency）」を構築するかについての主要な知見をまとめたものである。 ---", "audio": "episodes/Rashidi%20et%20al.%20%282021%29%20%E2 21", "desc": "本ドキュメントは、Gülbetekinら（2021年）による研究に基づき、**エンフェースメント錯覚（Enfacement Illusion）**—他者の顔が触れられる視覚情報と自分の顔への触覚刺激が同期することで、自己の顔認識が変化する現象—のメカニズムを分析したものである。 研究の主要な結論として、顔の**左側**への刺激は、同期・非同期条件を識別する上で右側よりも敏感であり、自己認識における", "audio": "episodes/G%C3%BClbetekin%20et%20al.%20%282021%29%20%E2%80%94%20Effects%20of%20right%20or%20left%20face%20stimulation%20on%20self%20and%20other%20perception%20in%20enfacement%20illusion/G%C3%BClbetekin%20et%20al.%202021_radio.mp3", "img": "episodes/G%C3%BClbetekin%20et%20al.%20%282021%29%20%E2%80%94%20Effects%20of%20right%20or%20left%20face%20stimulation%20on%20self%20and%20other%20perception%20in%20enfacement%20illusion/G%C3%BClbetekin%20et%20al.%202021_infographic.png", "report": "episodes/G%C3%BClbetekin%20et%20al.%20%282021%29%20%E2%80%94%20Effects%20of%20right%20or%20left%20face%20stimulation%20on%20self%20and%20other%20perception%20in%20enfacement%20illusion/G%C3%BClbetekin%20et%20al.%202021_report.md", "paper": ""}, {"title": "Salgado-Pineda et al. (2021) — Neural correlates of disturbance", "year": "2021", "desc": "本ドキュメントは、統合失調症における自己意識および自己主体感（Sense of Agency）の混乱を、脳機能画像（fMRI）と「enfacement（顔の同調）イリュージョン」パラダイムを用いて調査した研究論文（Salgado-Pineda et al., 2021）に基づき、その主要な知見をまとめたものである。 ---", "audio": "episodes/Salgado-Pineda%20et%20al.%20%282021%29%20%E2%80%94%20Neural%20correlates%20of%20disturbance/Salgado-Pineda%20et%20al.%202021_radio.mp3", "img": "episodes/Salgado-Pineda%20et%20al.%20%282021%29%20%E2%80%94%20Neural%20correlates%20of%20disturbance/Salgado-Pineda%20et%20al.%202021_infographic.png", "report": "episodes/Salgado-Pineda%20et%20al.%20%282021%29%20%E2%80%94%20Neural%20correlates%20of%20disturbance/Salgado-Pineda%20et%20al.%202021_report.md", "paper": ""}, {"title": "David et al. (2016) — The sense of agency is more sensitive to manipulations of outcome than movement-related feedback", "year": "2016", "desc": "本文書は、Nicole Davidらによる研究「The Sense of Agency Is More Sensitive to Manipulations of Outcome than Movement-Related Feedback Irrespect odes/Gonzalez-Franco%20et%20al.%20%282020%29%20%E2%80%94%20Using%20Facial%20Animation%20to%20Increase%20the%20Enfacement%20Illusion%20and%20Avatar%20Self-Identification/Gonzalez-Franco%20et%20al.%20%282020%29_infographic.png", "report": "episodes/Gonzalez-Franco%20et%20al.%20%282020%29%20%E2%80%94%20Using%20Facial%20Animation%20to%20Increase%20the%20Enfacement%20Illusion%20and%20Avatar%20Self-Identification/Gonzalez-Franco%20et%20al.%20%282020%29_report.md", "paper": ""}, {"title": "Morita et al. (2017) — Self-face recognition shares brain regions", "year": "2017", "desc": "本ドキュメントは、2017年に*Neuroscience*誌に掲載されたMoritaらによる研究論文「Self-face recognition shares brain regions active during proprioceptive illusion in the right inferior fronto-parietal superior longitudinal fascicul", "audio": "episodes/Morita%20et%20al.%20%282017%29%20%E2%80%94%20Self-face%20recognition%20shares%20brain%20regions/Morita_et_al_2017_radio.mp3", "img": "episodes/Morita%20et%20al.%20%282017%29%20%E2%80%94%20Self-face%20recognition%20shares%20brain%20regions/Morita_et_al_2017_infographic.png", "report": "episodes/Morita%20et%20al.%20%282017%29%20%E2%80%94%20Self-face%20recognition%20shares%20brain%20regions/Morita_et_al_2017_report.md", "paper": ""}, {"title": "Apps et al. (2012) — The different faces of one's self", "year": "2012", "desc": "本ドキュメントは、Matthew A. J. Appsら（2012年）による研究「The different faces of one’s self: an fMRI study into the recognition of current and past self-facial appearances（自己の異なる顔：現在および過去の自己の顔容貌の認識に関するfMRI研究）」の分析結果をまと", "audio": "episodes/Apps%20et%20al.%20%282012%29%20%E2%80%94%20The%20different%20faces%20of%20one%27s%20self/Apps_et_al_2012_radio.mp3", "img": "episodes/Apps%20et%20al.%20%282012%29%20%E2%80%94%20The%20different%20faces%20of%20one%27s%20self/Apps_et_al_2012_infographic.png", "report": "episodes/Apps%20et%20al.%20%282012%29%20%E2%80%94%20The%20different%20faces%20of%20one%27s%20self/Apps_et_al_2012_report.md", "paper": ""}, {"title": "Dobricki and Mohler (2015) — Self-Identification With Another's Body Alters Self-Other Face Distinction", "year": "2015", "desc": "本報告書は、Martin Dobricki氏とBetty J. Mohler氏の研究（2015年）に基づき、全身の自己知覚と顔の自己認識の間の動的な関係を分析したものである。この研究は、被験者の体幹への視覚・触覚的な同期刺激を通じて「フルボディ・イリュージョン（他者の身体を自分のものと感じる感覚）」を誘発し、それが自己と他者の顔を区別する能力にどのような影響を与えるかを調査した。 研究の結果、他者", "audio": "episodes/Dobricki%20and%20Mohler%20%282015%29%20%E2%80%94%20Self-Identification%20With%20Another%27s%20Body%20Alters%20Self-Other%20Face%20Distinction/Dobricki_and_Mohler_2015_radio.mp3", "img": "episodes/Dobricki%20and%20Mohler%20%282015%29%20%E2%80%94%20Self-Identification%20With%20Another%27s%20Body%20Alters%20Self-Other%20Face%20Distinction/Dobricki_and_Mohler_2015_infographic.png", "report": "episodes/Dobricki%20and%20Mohler%20%282015%29%20%E2%80%94%20Self-Identification%20With%20Another%27s%20Body%20Alters%20Self-Other%20Face%20Distinction/Dobricki_and_Mohler_2015_report.md", "paper": ""}, {"title": "Shahu et al. (2022) — Would Users Accept Electric Muscle Stimu", "year": "2022", "desc": "本報告書は、電気筋肉刺激（EMS）技術がユーザーの身体を直接制御することに対する受容性を調査した研究（Shahu et al. 2022）に基づき、その主要な知見をまとめたものである。EMSは、電気信号を用いて筋肉を収縮させ、身体の動きを制御する技術であり、従来の医療やスポーツの枠を超え、ヒューマン・コンピュータ・インタラクション（HCI）の分野で新たな可能性を提示している。 本研究では、113名", "audio": "episodes/Shahu%20et%20al.%20%282022%29%20%E2%80%94%20Would%20Users%20Accept%20Electric%20Muscle%20Stimu/Shahu_et_al_2022_radio.mp3", "img": "episodes/Shahu%20et%20al.%20%282022%29%20%E2%80%94%20Would%20Users%20Accept%20Electric%20Muscle%20Stimu/Shahu_et_al_2022_infographic.png", "report": "episodes/Shahu%20et%20al.%20%282022%29%20%E2%80%94%20Would%20Users%20Accept%20Electric%20Muscle%20Stimu/Shahu_et_al_2022_report.md", "paper": ""}, {"title": "Schjerlund et al. (2022) — OVRlap", "year": "2022", "desc": "本報告書は、大規模な仮想現実（VR）環境内での操作効率を向上させる革新的なインタラクション手法「OVRlap」に関する調査・分析をまとめたものである。従来、遠く離れた複数の場所を同時に把握することは不可能とされていたが、OVRlapは複数地点の視点を一人称視点（FPV）で重畳（オーバーラップ）させることにより、この制約を解消する。 20名の参加者を対象とした実証研究の結果、OVRlapは従来の「地", "audio": "episodes/Schjerlund%20et%20al.%20%282022%29%20%E2%80%94%20OVRlap/Schjerlund_2022_radio.mp3", "img": "", "report": "episodes/Schjerlund%20et%20al.%20%282022%29%20%E2%80%94%20OVRlap/Schjerlund_2022_report.md", "paper": ""}, {"title": "Janaka et al. (2022) — Paracentral and near-peripheral visualizations", "year": "2022", "desc": "本ドキュメントは、対面での社会的なやり取り（ソーシャル・インタラクション）において、光学的透過型ヘッドマウントディスプレイ（OHMD：スマートグラス）を介したセカンダリ情報（通知など）の提示が、いかにユーザーの注意をそらし、アイコンタクトの質を低下させるかという問題、およびその解決策を提示した研究論文「Janaka et al. 2022」に基づき作成されたものである。 OHMDは、主要なタスクを", "audio": "episodes/Janaka%20et%20al.%20%282022%29%20%E2%80%94%20Paracentral%20and%20near-peripheral%20visualizations/Janaka_2022_radio.mp3", "img": "episodes/Janaka%20et%20al.%20%282022%29%20%E2%80%94%20Paracentral%20and%20near-peripheral%20visualizations/Janaka_2022_infographic.png", "report": "episodes/Janaka%20et%20al.%20%282022%29%20%E2%80%94%20Paracentral%20and%20near-peripheral%20visualizations/Janaka_2022_report.md", "paper": ""}, {"title": "Küçüktabak et al. (2021) — Human-machine-human interaction in motor control and rehabilitation", "year": "2021", "desc": "本文書は、Küçüktabakら（2021年）によるレビュー論文「Human-machine-human interaction in motor control and rehabilitation: a review」に基づき、人間同士の相互作用が機械（ロボットやセンサーデバイス）を介した際、運動制御やリハビリテーションにどのような影響を及ぼすかを詳細に分析したものである。 ---", "audio": "episodes/K%C3%BC%C3%A7%C3%BCktabak%20et%20al.%20%282021%29%20%E2%80%94%20Human-machine-human%20interaction%20in%20motor%20control%20and%20rehabilitation/Kucuktobak_2021_radio.mp3", "img": "episodes/K%C3%BC%C3%A7%C3%BCktabak%20et%20al.%20%282021%29%20%E2%80%94%20Human-machine-human%20interaction%20in%20motor%20control%20and%20rehabilitation/Kucuktobak_2021_infographic.png", "report": "episodes/K%C3%BC%C3%A7%C3%BCktabak%20et%20al.%20%282021%29%20%E2%80%94%20Human-machine-human%20interaction%20in%20motor%20control%20and%20rehabilitation/Kucuktobak_2021_report.md", "paper": ""}, {"title": "Cherry (1953) — Some Experiments on the Recognition of Speech, with One and with Two Ears", "year": "1953", "desc": "本文書は、1953年にE. Colin %20interference/Pashler_1994_infographic.png", "report": "episodes/Pashler%20%281994%29%20%E2%80%94%20Graded%20capacity-sharing%20in%20dual-task%20interference/Pashler_1994_report.md", "paper": ""}, {"title": "Garner and Dux (2015) — Training conquers multitasking costs", "year": "2015", "desc": "本資料は、K. G. GarnerおよびPaul E. Duxによる研究論文（2015年）「Training conquers multitasking costs by dividing task representations in the frontoparietal-subcortical system」に基づき、脳が訓練を通じてどのようにマルチタスクの限界を克服するかについての詳細な分析", "audio": "episodes/Garner%20and%20Dux%20%282015%29%20%E2%80%94%20Training%20conquers%20multitasking%20costs/garner_dux_2015_radio.mp3", "img": "episodes/Garner%20and%20Dux%20%282015%29%20%E2%80%94%20Training%20conquers%20multitasking%20costs/garner_dux_2015_infographic.png", "report": "episodes/Garner%20and%20Dux%20%282015%29%20%E2%80%94%20Training%20conquers%20multitasking%20costs/garner_dux_2015_report.md", "paper": ""}, {"title": "Sigman and Dehaene (2008) — Brain mechanisms of serial and parallel processing during dual-task performance", "year": "2008", "desc": "本文書は、Mariano SigmanおよびStanislas Dehaene（2008年）の研究に基づき、人間が二つの課題を同時に実行する際の脳内メカニズムを分析したものである。心理学的不応期（PRP）として知られる現象、すなわち「人間は通常、二つの課題を同時に遂行できない」という制約に対し、本研究は脳波（EEG）と機能的磁気共鳴画像法（fMRI）を組み合わせた革新的な時間分解分析を用いてアプロ", "audio": "episodes/Sigman%20and%20Dehaene%20%282008%29%20%E2%80%94%20Brain%20mechanisms%20of%20serial%20and%20parallel%20processing%20during%20dual-task%20performance/sigman_2008_radio.mp3", "img": "episodes/Sigman%20and%20Dehaene%20%282008%29%20%E2%80%94%20Brain%20mechanisms%20of%20serial%20and%20parallel%20processing%20during%20dual-task%20performance/sigman_2008_infographic.png", "report": "episodes/Sigman%20and%20Dehaene%20%282008%29%20%E2%80%94%20Brain%20mechanisms%20of%20serial%20and%20parallel%20processing%20during%20dual-task%20performance/sigman_2008_report.md", "paper": ""}, {"title": "Schumacher et al. (2001) — Virtually perfect time sharing in dual-task performance", "year": "2001", "desc": "本報告書は、Schumacherら（2001年）の研究に基づき、人間が2つの知覚運動課題を同時に実行する能力、およびその限界に関する最新の知見をまとめたものである。 心理学における長年の論争は、人間が2つのタスクを同時に行う際、中央の「認知的ボトルネック」によって一方が必ず遅延するのか、あるいは練習によって並列処理が可能になるのかという点にある。Schumacherらの研究は、適切な練習と条件の下", "audio": "episodes/Schumacher%20et%20al.%20%282001%29%20%E2%80%94%20Virtually%20perfect%20time%20sharing%20in%20dual-task%20performance/schumacher_2001_radio.mp3", "img": "episodes/Schumacher%20et%20al.%20%282001%29%20%E2%80%94%20Virtually%20perfect%20time%20sharing%20in%20dual-task%20performance/schumacher_2001_infographic.png", "report": "episodes/Schumacher%20et%20al.%20%282001%29%20%E2%80%94%20Virtually%20perfect%20time%20sharing%20in%20dual-task%20performance/schumacher_2001_report.md", "paper": ""}, {"title": "Just and Buchweitz (2017) — What Brain Imaging Reveals About the Nature of Multitasking", "year": "2017", "desc": "本文書は、Marcel Adam Just氏とAugusto Buchweitz氏による研究「脳画像解析が明らかにするマルチタスクの性質（What Brain Imaging Reveals About the Nature of Multitasking）」に基づき、マルチタスクの神経科学的メカニズム、その限界、およびトレーニングの効果をまとめたものである。 現代のデジタル技術の普及により、マル", "audio": "episodes/Just%20and%20Buchweitz%20%282017%29%20%E2%80%94%20What%20Brain%20Imaging%20Reveals%20About%20the%20Nature%20of%20Multitasking/just_buchweitz_2017_radio.mp3", "img": "episodes/Just%20and%20Buchweitz%20%282017%29%20%E2%80%94%20What%20Brain%20Imaging%20Reveals%20About%20the%20Nature%20of%20Multitasking/just_buchweitz_2017_infographic.png", "report": "episodes/Just%20and%20Buchweitz%20%282017%29%20%E2%80%94%20What%20Brain%20Imaging%20Reveals%20About%20the%20Nature%20of%20Multitasking/just_buchweitz_2017_report.md", "paper": ""}, {"title": "Dux et al. (2009) — Training Improves Multitasking Performance", "year": "2009", "desc": "本ドキュメントは、Duxら（2009年）の研究論文「Training Improves Multitasking Performance by Increasing the Speed of Information Processing in Human Prefrontal Cortex（訓練はヒト前頭前野における情報処理速度を向上させることでマルチタスク・パフォーマンスを改善する）」に基づき、", "audio": "episodes/Dux%20et%20al.%20%282009%29%20%E2%80%94%20Training%20Improves%20Multitasking%20Performance/dux_2009_radio.mp3", "img": "episodes/Dux%20et%20al.%20%282009%29%20%E2%80%94%20Training%20Improves%20Multitasking%20Performance/dux_2009_infographic.png", "report": "episodes/Dux%20et%20al.%20%282009%29%20%E2%80%94%20Training%20Improves%20Multitasking%20Performance/dux_2009_report.md", "paper": ""}, {"title": "Reipschläger et al. (2022) — AvatAR", "year": "2022", "desc": "本文書は、複雑な人間活動データ（ヒューマン・モーション・データ）を分析するための没入型環境「AvatAR」に関する詳細な概要である。従来のデスクトップベースの2Dまたは3D軌跡プロットは、全体的な位置情報の把握には適しているが、個人の詳細な行動、姿勢、および周囲の環境との相互作用を理解するには限界があった。 AvatARは、拡張現実（AR）ヘッドマウントディスプレイ（HMD）とタブレット端末を組み", "audio": "episodes/Reipschl%C3%A4ger%20et%20al.%20%282022%29%20%E2%80%94%20AvatAR/reipschlager_2022_radio.mp3", "img": "episodes/Reipschl%C3%A4ger%20et%20al.%20%282022%29%20%E2%80%94%20AvatAR/Reipschl%C3%A4ger_et_al_2022_AvatAR_infographic.png", "report": "episodes/Reipschl%C3%A4ger%20et%20al.%20%282022%29%20%E2%80%94%20AvatAR/reipschlager_2022_report.md", "paper": ""}, {"title": "Tanaka et al. (2022) — Electrical Head Actuation", "year": "2022", "desc": "本文書は、シカゴ大学のYudai Tanaka、Jun Nishida、Pedro Lopesらによって提案された、電気筋肉刺激（EMS）を用いてユーザーの頭部の向きを直接操作する新しいインタフェース概念「Electrical Head Actuation」に関する調査報告である。 このシステムは、首の筋肉にEMSを適用することで、ユーザーの頭部をヨー軸（左右）およびピッチ軸（上下）に沿って回転さ", "audio": "episodes/Tanaka%20et%20al.%20%282022%29%20%E2%80%94%20Electrical%20Head%20Actuation/tanaka_2022_radio.mp3", "img": "episodes/Tanaka%20et%20al.%20%282022%29%20%E2%80%94%20Electrical%20Head%20Actuation/Tanaka_et_al_2022_Electrical_Head_Actuation_infographic.png", "report": "episodes/Tanaka%20et%20al.%20%282022%29%20%E2%80%94%20Electrical%20Head%20Actuation/tanaka_2022_report.md", "paper": ""}, {"title": "Han and Marois (2013) — The source of dual-task limitations", "year": "2013", "desc": "本資料は、Suk Won HanおよびRené Marois（2013年）による研究「二重課題制限の源泉：複数の反応選択における直列または並列処理か？」に基づき、人間が同時に2つの課題を遂行する際の認知的な制限について分析したものである。 長年、二重課題におけるパフォーマンスの低下（心理的不応期：PRP）の原因については、「反応選択の段階では一度に一つの課題しか処理できない」とする**直列ボトルネ", "audio": "episodes/Han%20and%20Marois%20%282013%29%20%E2%80%94%20The%20source%20of%20dual-task%20limitations/Han_and_Marois_2013_radio.mp3", "img": "episodes/Han%20and%20Marois%20%282013%29%20%E2%80%94%20The%20source%20of%20dual-task%20limitations/Han_and_Marois_2013_infographic.png", "report": "episodes/Han%20and%20Marois%20%282013%29%20%E2%80%94%20The%20source%20of%20dual-task%20limitations/Han_and_Marois_2013_report.md", "paper": ""}, {"title": "Hegele and Heuer (2010) — Implicit and explicit components of dual adaptation", "year": "2010", "desc": "本ドキュメントは、Mathias Hegele氏とHerbert Heuer氏による研究「Implicit and explicit components of dual adaptation to visuomotor rotations (2010)」に基づき、二つの異なる視覚運動変換に同時に適応する「二重適応（dual adaptation）」のメカニズムと、それに及ぼす加齢の影響を分析した", "audio": "episodes/Hegele%20and%20Heuer%20%282010%29%20%E2%80%94%20Implicit%20and%20explicit%20components%20of%20dual%20adaptation/Hegele_and_Heuer_2010_radio.mp3", "img": "episodes/Hegele%20and%20Heuer%20%282010%29%20%E2%80%94%20Implicit%20and%20explicit%20components%20of%20dual%20adaptation/Hegele_and_Heuer_2010_infographic.png", "report": "episodes/Hegele%20and%20Heuer%20%282010%29%20%E2%80%94%20Implicit%20and%20explicit%20components%20of%20dual%20adaptation/Hegele_and_Heuer_2010_report.md", "paper": ""}, {"title": "Kelly and Garavan (2005) — Human functional neuroimaging of brain changes associated with practice", "year": "2005", "desc": "本文書は、A. M. Clare KellyおよびHugh Garavanによる論文「Human Functional Neuroimaging of Brain Changes Associated with Practice（練習に関連する脳の変化のヒト機能的神経画像）」に基づき、練習が脳の機能的解剖学に与える影響、およびその変化を規定する要因についてまとめたものである。 経験に依存した脳の変", "audio": "episodes/Kelly%20and%20Garavan%20%282005%29%20%E2%80%94%20Human%20functional%20neuroimaging%20of%20brain%20changes%20associated%20with%20practice/Kelly%20and%20Garavan%202005_radio.mp3", "img": "episodes/Kelly%20and%20Garavan%20%282005%29%20%E2%80%94%20Human%20functional%20neuroimaging%20of%20brain%20changes%20associated%20with%20practice/Kelly%20and%20Garavan%202005_infographic.png", "report": "episodes/Kelly%20and%20Garavan%20%282005%29%20%E2%80%94%20Human%20functional%20neuroimaging%20of%20brain%20changes%20associated%20with%20practice/Kelly%20and%20Garavan%202005_report.md", "paper": ""}, {"title": "Kristjánsson and Egeth (2020) — How feature integration theory integrated cognitive psychology, neurophysiology, and psychophysics", "year": "2020", "desc": "本文書は、アン・トライスマン（Anne Treisman）が提唱した「特徴統合理論（Feature Integration Theory: FIT）」の成立背景、理論的構造、およびその学術的影響について分析したものである。FITは1980年に最も有名な形で提唱されたが、それは理論的空白の中に突如現れたものではない。1950年代から70年代にかけて認知心理学、神経生理学、視覚精神物理学の各分野で並行", "audio": "episodes/Kristj%C3%A1nsson%20and%20Egeth%20%282020%29%20%E2%80%94%20How%20feature%20integration%20theory%20integrated%20cognitive%20psychology%2C%20neurophysiology%2C%20and%20psychophysics/Kristj%C3%A1nsson%20and%20Egeth%202020_radio.mp3", "img": "episodes/Kristj%C3%A1nsson%20and%20Egeth%20%282020%29%20%E2%80%94%20How%20feature%20integration%20theory%20integrated%20cognitive%20psychology%2C%20neurophysiology%2C%20and%20psychophysics/Kristj%C3%A1nsson%20and%20Egeth%202020_infographic.png", "report": "episodes/Kristj%C3%A1nsson%20and%20Egeth%20%282020%29%20%E2%80%94%20How%20feature%20integration%20theory%20integrated%20cognitive%20psychology%2C%20neurophysiology%2C%20and%20psychophysics/Kristj%C3%A1nsson%20and%20Egeth%202020_report.md", "paper": ""}, {"title": "Räihä and Špakov (2009) — Disambiguating ninja cursors with eye gaze", "year": "2009", "desc": "", "audio": "episodes/R%C3%A4ih%C3%A4%20and%20%C5%A0pakov%20%282009%29%20%E2%80%94%20Disambiguating%20ninja%20cursors%20with%20eye%20gaze/R%C3%A4ih%C3%A4%20and%20%C5%A0pakov%202009%20-%20Disambiguating%20ninja%20cursors%20with%20eye%20gaze_radio.mp3", "img": "episodes/R%C3%A4ih%C3%A4%20and%20%C5%A0pakov%20%282009%29%20%E2%80%94%20Disambiguating%20ninja%20cursors%20with%20eye%20gaze/R%C3%A4ih%C3%A4_and_%C5%A0pakov_2009_infographic.png", "report": "", "paper": ""}, {"title": "Kobayashi and Igarashi (2008) — Ninja cursors", "year": "2008", "desc": "本文書は、東京大学の小林正朋氏と五十嵐健夫氏によって2008年に発表された研究論文「Ninja Cursors: Using Multiple Cursors to Assist Target Acquisition on Large Screens」に基づき、その主要な概念、技術的設計、実験結果、および実用化に向けた洞察をまとめたブリーフィング・ドキュメントである。 ---", "audio": "episodes/Kobayashi%20and%20Igarashi%20%282008%29%20%E2%80%94%20Ninja%20cursors/Kobayashi%20and%20Igarashi%202008%20-%20Ninja%20cursors_radio.mp3", "img": "episodes/Kobayashi%20and%20Igarashi%20%282008%29%20%E2%80%94%20Ninja%20cursors/Kobayashi_and_Igarashi_2008_infographic.png", "report": "episodes/Kobayashi%20and%20Igarashi%20%282008%29%20%E2%80%94%20Ninja%20cursors/Kobayashi_and_Igarashi_2008_report.md", "paper": ""}, {"title": "Alzahabi and Cain (2021) — Ensemble perception during multiple-object tracking", "year": "2021", "desc": "本ドキュメントは、Reem AlzahabiおよびMatthew S. Cainの研究（2021年）に基づき、動的な環境下で人間が複数のオブジェクトを「群れ（アンサンブル）」としてどのように知覚し、追跡するかについての主要な知見をまとめたものである。 ---", "audio": "episodes/Alzahabi%20and%20Cain%20%282021%29%20%E2%80%94%20Ensemble%20perception%20during%20multiple-object%20tracking/Alzahabi_and_Cain_2021_radio.mp3", "img": "episodes/Alzahabi%20and%20Cain%20%282021%29%20%E2%80%94%20Ensemble%20perception%20during%20multiple-object%20tracking/Alzahabi_and_Cain_2021_infographic.png", "report": "episodes/Alzahabi%20and%20Cain%20%282021%29%20%E2%80%94%20Ensemble%20perception%20during%20multiple-object%20tracking/Alzahabi_and_Cain_2021_report.md", "paper": ""}, {"title": "Quinn et al. (2011) — On the costs of multiple trajectory pointing methods", "year": "2011", "desc": "本文書は、Quinnら（2011年）による研究「On the costs of multiple trajectory pointing methods（複数軌道ポインティング手法のコストについて）」に基づき、ポインティング作業を効率化するために考案された「複数軌道」手法がユーザーのパフォーマンスに与える影響を分析したものである。 フィッツの法則に基づき、ターゲットまでの距離を短縮する手法として「", "audio": "episodes/Quinn%20et%20al.%20%282011%29%20%E2%80%94%20On%20the%20costs%20of%20multiple%20trajectory%20pointing%20methods/Quinn_et_al__2011_radio.mp3", "img": "episodes/Quinn%20et%20al.%20%282011%29%20%E2%80%94%20On%20the%20costs%20of%20multiple%20trajectory%20pointing%20methods/Quinn_et_al__2011_infographic.png", "report resch%20et%20al.%202021%20-%20Measures%20of%20explicit%20and%20implicit%20in%20motor%20learning_infographic.png", "report": "episodes/Maresch%20et%20al.%20%282021%29%20%E2%80%94%20Measures%20of%20explicit%20and%20implicit%20in%20motor%20learning/Maresch%20et%20al.%202021%20-%20Measures%20of%20explicit%20and%20implicit%20in%20motor%20learning_report.md", "paper": ""}, {"title": "Krakauer et al. (1999) — Independent learning of internal models", "year": "1999", "desc": "", "audio": "episodes/Krakauer%20et%20al.%20%281999%29%20%E2%80%94%20Independent%20learning%20of%20internal%20models/Krakauer%20et%20al.%20%281999%29_radio.mp3", "img": "episodes/Krakauer%20et%20al.%20%281999%29%20%E2%80%94%20Independent%20learning%20of%20internal%20models/Krakauer%20et%20al.%20%281999%29_infographic.png", "report": "", "paper": ""}, {"title": "Krakauer et al. (1999) — Independent learning of internal models for kinematic and dynamic control of reaching", "year": "1999", "desc": "このドキュメントは、Krakauerら（1999年）による研究「Independent learning of internal models for kinematic and dynamic control of reaching（リーチングの運動学的および力学的制御のための内部モデルの独立した学習）」に基づき、運動学習のメカニズム、特に運動学と力学の学習がいかに独立して処理されるかを詳細に解", "audio": "episodes/Krakauer%20et%20al.%20%281999%29%20%E2%80%94%20Independent%20learning%20of%20internal%20models%20for%20kinematic%20and%20dynamic%20control%20of%20reaching/Krakauer%20et%20al.%201999_radio.mp3", "img": "episodes/Krakauer%20et%20al.%20%281999%29%20%E2%80%94%20Independent%20learning%20of%20internal%20models%20for%20kinematic%20and%20dynamic%20control%20of%20reaching/Krakauer%20et%20al.%201999%20-%20Independent%20learning%20of%20internal%20models%20for%20kinematic%20and%20dynamic%20control%20of%20reaching_infographic.png", "report": "episodes/Krakauer%20et%20al.%20%281999%29%20%E2%80%94%20Independent%20learning%20of%20internal%20models%20for%20kinematic%20and%20dynamic%20control%20of%20reaching/Krakauer%20et%20al.%201999%20-%20Independent%20learning%20of%20internal%20models%20for%20kinematic%20and%20dynamic%20control%20of%20reaching_report.md", "paper": ""}, {"title": "Osu et al. (2004) — Random presentation enables subjects to adapt to two opposing forces on the hand", "year": "2004", "desc": "本報告書は、人間が相反する2つの運動課題を同時に学習できるかという、運動制御理論における重要な知見をまとめたものである。従来の研究では、相反する力場（force field）や視覚運動回転の同時学習は、ワーキングメモリ内の干渉によって困難であると考えられてきた。 しかし、大須理英子氏らの研究（2004年）は、**「ランダムかつ頻繁な切り替え」**と**「文脈情報（キュー）」**を組み合わせることで", "audio": "episodes/Osu%20et%20al.%20%282004%29%20%E2%80%94%20Random%20presentation%20enables%20subjects%20to%20adapt%20to%20two%20opposing%20forces%20on%20the%20hand/Osu%20et%20al.%202004_radio.mp3", "img": "episodes/Osu%20et%20al.%20%282004%29%20%E2%80%94%20Random%20presentation%20enables%20subjects%20to%20adapt%20to%20two%20opposing%20forces%20on%20the%20hand/Osu%20et%20al.%202004%20-%20Random%20presentation%20enables%20subjects%20to%20adapt%20to%20two%20opposing%20forces%20on%20the%20hand_infographic.png", "report": "episodes/Osu%20et%20al.%20%282004%29%20%E2%80%94%20Random%20presentation%20enables%20subjects%20to%20adapt%20to%20two%20opposing%20forces%20on%20the%20hand/Osu%20et%20al.%202004%20-%20Random%20presentation%20enables%20subjects%20to%20adapt%20to%20two%20opposing%20forces%20on%20the%20hand_report.md", "paper": ""}, {"title": "Karniel and Mussa-Ivaldi (2002) — Does the motor control system use multiple models", "year": "2002", "desc": "本文書は、KarnielおよびMussa-Ivaldi（2002年）による研究に基づき、可変的な環境において人間の運動制御システムが複数の内部モデルを構築し、それらを文脈に応じて切り替えて（コンテキスト・スイッチング）対処しているかという仮説を検証した結果をまとめたものである。 ---", "audio": "episodes/Karniel%20and%20Mussa-Ivaldi%20%282002%29%20%E2%80%94%20Does%20the%20motor%20control%20system%20use%20multiple%20models/Karniel%20and%20Mussa-Ivaldi%202002%20-%20Does%20the%20motor%20control%20system%20use%20multiple%20models%20and%20context%20switching%20to%20cope%20with%20a%20variable%20environment_radio.mp3", "img": "episodes/Karniel%20and%20Mussa-Ivaldi%20%282002%29%20%E2%80%94%20Does%20the%20motor%20control%20system%20use%20multiple%20models/Karniel%20and%20Mussa-Ivaldi%202002%20-%20Does%20the%20motor%20control%20system%20use%20multiple%20models%20and%20context%20switching%20to%20cope%20with%20a%20variable%20environment_infographic.png", "report": "episodes/Karniel%20and%20Mussa-Ivaldi%20%282002%29%20%E2%80%94%20Does%20the%20motor%20control%20system%20use%20multiple%20models/Karniel%20and%20Mussa-Ivaldi%202002%20-%20Does%20the%20motor%20control%20system%20use%20multiple%20models%20and%20context%20switching%20to%20cope%20with%20a%20variable%20environment_report.md", "paper": ""}, {"title": "Welch et al. (1993) — Alternating prism exposure causes dual adaptation", "year": "1993", "desc": "本文書は、ウェルチら（Welch et al., 1993）による研究「交互のプリズム曝露は二重適応と新しい変位への一般化を引き起こす」に基づき、相反する視覚環境への繰り返し曝露がヒトの知覚運動系に与える影響をまとめたものである。 本研究は、互いに矛盾する感覚環境への適応と再適応を繰り返すことが、それぞれの状況に対する個別の適応（**二重適応**）を促進し、さらに未知の視覚変位に対する適応能力（*", "audio": "episodes/Welch%20et%20al.%20%281993%29%20%E2%80%94%20Alternating%20prism%20exposure%20causes%20dual%20adaptation/Welch%20et%20al.%201993%20-%20Alternating%20prism%20exposure%20causes%20dual%20adaptation_radio.mp3", "img": "episodes/Welch%20et%20al.%20%281993%29%20%E2%80%94%20Alternating%20prism%20exposure%20causes%20dual%20adaptation/Welch%20et%20al.%201993%20-%20Alternating%20prism%20exposure%20causes%20dual%20adaptation_infographic.png", "report": "episodes/Welch%20et%20al.%20%281993%29%20%E2%80%94%20Alternating%20prism%20exposure%20causes%20dual%20adaptation/Welch%20et%20al.%201993%20-%20Alternating%20prism%20exposure%20causes%20dual%20adaptation_report.md", "paper": ""}, {"title": "Furlanetto et al. (2013) — The bilocated mind", "year": "2013", "desc": "本報告書は、人間が同時に複数の場所に自己を局在化させる現象「精神的バイロケーション（Mental Bilocation）」についての包括的な分析である。従来の認知科学や現象学（フッサール等）では、自己は身体に拘束され、単一の場所に存在すると考えられてきた。しかし、近年の神経学、認知神経科学、実験心理学のエビデンスは、自己の空間的統一性が一時的に停止し、自己が2つの場所に分散して知覚される「精神的バ", "audio": "episodes/Furlanetto%20et%20al.%20%282013%29%20%E2%80%94%20The%20bilocated%20mind/Furlanetto_et_al_2013_bilocated_mind_radio.mp3", "img": "episodes/Furlanetto%20et%20al.%20%282013%29%20%E2%80%94%20The%20bilocated%20mind/Furlanetto_et_al_2013_bilocated_mind_infographic.png", "report": "episodes/Furlanetto%20et%20al.%20%282013%29%20%E2%80%94%20The%20bilocated%20mind/Furlanetto_et_al_2013_bilocated_mind_report.md", "paper": ""}, {"title": "Kishore et al. (2016) — Multi-Destination Beaming", "year": "2016", "desc": "本文書は、Sameer Kishoreらによる研究（2016年）「Multi-Destination Beaming: Apparently Being in Three Places at Once through Robotic and Virtual Embodiment」に基づき、一人の人間が物理的に離れた複数の場所に同時に存在し、相互作用を行うシステムの有効性を分析したものである。 この", "audio": "episodes/Kishore%20et%20al.%20%282016%29%20%E2%80%94%20Multi-Destination%20Beaming/Kishore_radio.mp3", "img": "episodes/Kishore%20et%20al.%20%282016%29%20%E2%80%94%20Multi-Destination%20Beaming/Kishore_2016_infographic.png", "report": "episodes/Kishore%20et%20al.%20%282016%29%20%E2%80%94%20Multi-Destination%20Beaming/Kishore_report.md", "paper": ""}, {"title": "Brashers-Krug et al. (1996) — Consolidation in human motor memory", "year": "1996", "desc": "本報告書は、提供された学術資料に基づき、ヒトの運動学習における記憶の定着（コンソリデーション）プロセスと、ニコチンが脳内の報酬系に与える神経生物学的な影響という、神経科学における2つの重要な側面をまとめたものである。 ---", "audio": "episodes/Brashers-Krug%20et%20al.%20%281996%29%20%E2%80%94%20Consolidation%20in%20human%20motor%20memory/Brashers-Krug_radio.mp3", "img": "episodes/Brashers-Krug%20et%20al.%20%281996%29%20%E2%80%94%20Consolidation%20in%20human%20motor%20memory/Brashers-Krug_infographic.png", "report": "episodes/Brashers-Krug%20et%20al.%20%281996%29%20%E2%80%94%20Consolidation%20in%20human%20motor%20memory/Brashers-Krug_1996_report.md", "paper": ""}, {"title": "Kilteni et al. (2012) — Extending body space in VR", "year": "2012", "desc": "本報告書は、Kilteniら（2012年）による研究に基づき、没入型バーチャルリアリティ（VR）において、人間の身体表現がどこまで劇的に変容し得るかを分析したものである。本研究は、自身の身体比率とは著しく異なる「非常に長い腕」に対して、人間が身体所有感（Body Ownership）を抱く可能性とその限界を明らかにしている。 ---", "audio": "episodes/Kilteni%20et%20al.%20%282012%29%20%E2%80%94%20Extending%20body%20space%20in%20VR/Kilteni_2012_radio.mp3", "img": "episodes/Kilteni%20et%20al.%20%282012%29%20%E2%80%94%20Extending%20body%20space%20in%20VR/Kilteni_2012_infographic.png", "report": "episodes/Kilteni%20et%20al.%20%282012%29%20%E2%80%94%20Extending%20body%20space%20in%20VR/Kilteni_2012_report.md", "paper": ""}, {"title": "Just et al. (2016) — Upper limb movement profiles in VR stroke rehab", "year": "2016", "desc": "本報告書は、Oculus Riftヘッドマウントディスプレイ（HMD）を用いた仮想現実（VR）環境における上肢の到達動作（リーチング）と、現実世界での動作を比較分析した研究成果をまとめたものである。 VR技術は、患者の動機付けやリハビリテーションへの参加率を向上させる手段として注目されているが、仮想ターゲットへの動作が現実の動作とどのように異なるかは十分に解明されていなかった。本研究の分析により、", "audio": "episodes/Just%20et%20al.%20%282016%29%20%E2%80%94%20Upper%20limb%20movement%20profiles%20in%20VR%20stroke%20rehab/Just_2016_radio.mp3", "img": "episodes/Just%20et%20al.%20%282016%29%20%E2%80%94%20Upper%20limb%20movement%20profiles%20in%20VR%20stroke%20rehab/Just_2016_infographic.png", "report": "episodes/Just%20et%20al.%20%282016%29%20%E2%80%94%20Upper%20limb%20movement%20profiles%20in%20VR%20stroke%20rehab/Just_2016_report.md", "paper": ""}, {"title": "Zhao and Zhang (2022) — Thin-Plate Spline Motion Model for Image Animation", "year": "2022", "desc": "本文書は、清華大学の研究チーム（ZhaoおよびZhang、2022年）によって提案された、教師なし学習による画像アニメーションの新しいフレームワーク「薄板スプライン（TPS）モーションモデル」に関する詳細な分析をまとめたものである。 画像アニメーションは、ソース画像の静止オブジェクトを、駆動ビデオ（ドライビングビデオ）の動きに基づいて動かす技術である。従来の教師なし手法には、ソースと駆動画像の間に", "audio": "episodes/Zhao%20and%20Zhang%20%282022%29%20%E2%80%94%20Thin-Plate%20Spline%20Motion%20Model%20for%20Image%20Animation/Zhao_radio.mp3", "img": "episodes/Zhao%20and%20Zhang%20%282022%29%20%E2%80%94%20Thin-Plate%20Spline%20Motion%20Model%20for%20Image%20Animation/Zhao_infographic.png", "report": "episodes/Zhao%20and%20Zhang%20%282022%29%20%E2%80%94%20Thin-Plate%20Spline%20Motion%20Model%20for%20Image%20Animation/Zhao_report.md", "paper": ""}, {"title": "Yoshida (2014) — Application of saliency map to the analysis of visual search", "year": "2014", "desc": "本ドキュメントは、吉田正俊氏による解説論文「サリエンシー・マップの視覚探索解析への応用」（2014年）に基づき、サリエンシー・マップの定義、計算論的モデル、脳内メカニズム、および盲視モデル動物や臨床研究への応用に関する主要な知見をまとめたものである。 ---", "audio": "episodes/Yoshida%20%282014%29%20%E2%80%94%20Application%20of%20saliency%20map%20to%20the%20analysis%20of%20visual%20search/Yoshida_radio.mp3", "img": "episodes/Yoshida%20%282014%29%20%E2%80%94%20Application%20of%20saliency%20map%20to%20the%20analysis%20of%20visual%20search/Yoshida_infographic.png", "report": "episodes/Yoshida%20%282014%29%20%E2%80%94%20Application%20of%20saliency%20map%20to%20the%20analysis%20of%20visual%20search/Yoshida_report.md", "paper": ""}, {"title": "Dotan et al. (2019) — Track It to Crack It - Dissecting Processing Stages with Finger Tracking", "year": "2019", "desc": "本資料は、Dotanら（2019年）による研究「Track It to Crack It: Dissecting Processing Stages with Finger Tracking」に基づき、認知科学における新たな行動測定手法である「指軌跡トラッキング」の有効性と応用可能性について概説するものである。 長年、心理学における主要な指標であった反応時間（RT）は、試行全体をまとめた総括的な指", "audio": "episodes/Dotan%20et%20al.%20%282019%29%20%E2%80%94%20Track%20It%20to%20Crack%20It%20-%20Dissecting%20Processing%20Stages%20with%20Finger%20Tracking/Dotan_radio.mp3", "img": "", "report": "episodes/Dotan%20et%20al.%20%282019%29%20%E2%80%94%20Track%20It%20to%20Crack%20It%20-%20Dissecting%20Processing%20Stages%20with%20Finger%20Tracking/Dotan_report.md", "paper": ""}, {"title": "Genay et al. (2021) — Being an Avatar 'for Real' - a Survey on Virtual Embodiment in Augmented Reality", "year": "2021", "desc": "本ドキュメントは、拡張現実（AR）環境における自己アバターの知覚、実装、および心理的影響に関する包括的な調査結果をまとめたものである。バーチャル・エンボディメント（身体化）がARにおいてどのように達成され、測定され、そして将来どのような可能性を秘めているかを、技術的および心理学的観点から分析する。 拡張現実（AR）技術の進展に伴い、物理空間に統合されたバーチャル・アバターを自己の身体として知覚する", "audio": "episodes/Genay%20et%20al.%20%282021%29%20%E2%80%94%20Being%20an%20Avatar%20%27for%20Real%27%20-%20a%20Survey%20on%20Virtual%20Embodiment%20in%20Augmented%20Reality/Genay_radio.mp3", "img": "", "report": "episodes/Genay%20et%20al.%20%282021%29%20%E2%80%94%20Being%20an%20Avatar%20%27for%20Real%27%20-%20a%20Survey%20on%20Virtual%20Embodiment%20in%20Augmented%20Reality/Genay_report.md", "paper": ""}, {"title": "Healey et al. (1996) — High-speed visual estimation", "year": "1996", "desc": "本ドキュメントは、Healey、Booth、およびEnns（1996年）による研究「High-Speed Visual Estimation Using Preattentive Processing（予備注意処理を用いた高速視覚的推定）」に基づき、人間の認知能力をデータ可視化ツールの設計にどのように活用できるかを分析したものである。 ---", "audio": "episodes/Healey%20et%20al.%20%281996%29%20%E2%80%94%20High-speed%20visual%20estimation/Healey%20et%20al.%201996%20-%20High-speed%20visual%20estimation_radio.mp3", "img": "", "report": "episodes/Healey%20et%20al.%20%281996%29%20%E2%80%94%20High-speed%20visual%20estimation/Healey%20et%20al.%201996%20-%20High-speed%20visual%20estimation_report.md", "paper": ""}, {"title": "Krekhov and Krueger (2021) — Deadeye", "year": "2021", "desc": "本文書は、Andrey Krekhov氏およびJens Krüger氏による研究論文「Deadeye: A Novel Preattentive Visualization Technique Based on Dichoptic Presentation」に基づき、新しい視覚化技術「Deadeye」の主要な洞察、分析、および実用的応用についてまとめたブリーフィング・ドキュメントである。 ---", "audio": "episodes/Krekhov%20and%20Krueger%20%282021%29%20%E2%80%94%20Deadeye/Krekhov%20and%20Krueger%202021%20-%20Deadeye_radio.mp3", "img": "episodes/Krekhov%20and%20Krueger%20%282021%29%20%E2%80%94%20Deadeye/Krekhov%20and%20Krueger%202021%20-%20Deadeye_infographic.png", "report": "episodes/Krekhov%20and%20Krueger%20%282021%29%20%E2%80%94%20Deadeye/Krekhov%20and%20Krueger%202021%20-%20Deadeye_report.md", "paper": ""}, {"title": "Chang et al. (2014) — Age-related declines of stability in visual perceptual learning", "year": "2014", "desc": "本資料は、Changら（2014年）の研究に基づき、加齢が視覚知覚学習（VPL）の「可塑性（Plasticity）」と「安定性（Stability）」に与える影響を分析したものである。長年、加齢による学習能力の低下は「可塑性」の減退が主因であると考えられてきた。しかし、本研究の結果、高齢者はタスクに無関連な情報を抑制する能力、すなわち「安定性」が著しく低下していることが明らかになった。 実験では、", "audio": "episodes/Chang%20et%20al.%20%282014%29%20%E2%80%94%20Age-related%20declines%20of%20stability%20in%20visual%20perceptual%20learning/Chang%20et%20al.%202014%20-%20Age-related%20declines%20of%20stability%20in%20visual%20perceptual%20learning_radio.mp3", "img": "episodes/Chang%20et%20al.%20%282014%29%20%E2%80%94%20Age-related%20declines%20of%20stability%20i
