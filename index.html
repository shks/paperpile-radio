esc": "本ドキュメントは、Lanfrancoら（2022年）による研究「ラバーハンド錯覚（RHI）における身体所有感の情報処理と知覚バイアスの定量化」の主要な知見をまとめたものである。 従来、身体的錯覚の研究は主観的なアンケートや評価尺度に大きく依存しており、錯覚が感覚情報処理にどの程度依存しているかを直接テストすることは困難であった。本研究は、**信号検出理論（SDT）**の枠組みを導入することで、身体", "audio": "episodes/Lanfranco%20et%20al.%20%282022%29%20%E2%80%94%20Quantifying%20body%20ownership%20information%20processing%20and%20perceptual%20bias%20in%20the%20rubber%20hand%20illusion/Lanfranco_et_al_2022_Quantifying_body_radio.mp3", "img": "episodes/Lanfranco%20et%20al.%20%282022%29%20%E2%80%94%20Quantifying%20body%20ownership%20information%20processing%20and%20perceptual%20bias%20in%20the%20rubber%20hand%20illusion/Lanfranco_et_al_2022_Quantifying_body_infographic.png", "report": "episodes/Lanfranco%20et%20al.%20%282022%29%20%E2%80%94%20Quantifying%20body%20ownership%20information%20processing%20and%20perceptual%20bias%20in%20the%20rubber%20hand%20illusion/Lanfranco_et_al_2022_Quantifying_body_report.md", "paper": ""}, {"title": "Feuchtner and Mueller (2018) — Ownershift", "year": "2018", "desc": "本資料は、バーチャルリアリティ（VR）環境における長時間の頭上操作に伴う身体的負担を軽減するための革新的なインタラクション技術「Ownershift（オーナーシフト）」に関するブリーフィング・ドキュメントである。 従来のVRインタラクションでは、頭上のオブジェクトを操作する際、ユーザーは物理的に腕を上げ続ける必要があり、これは「ゴリラ腕（Gorilla Arm）」と呼ばれる深刻な疲労を引き起こす要", "audio": "episodes/Feuchtner%20and%20Mueller%20%282018%29%20%E2%80%94%20Ownershift/Feuchtner_Mueller_2018_Ownershift_radio.mp3", "img": "episodes/Feuchtner%20and%20Mueller%20%282018%29%20%E2%80%94%20Ownershift/Feuchtner_Mueller_2018_Ownershift_infographic.png", "report": "episodes/Feuchtner%20and%20Mueller%20%282018%29%20%E2%80%94%20Ownershift/Feuchtner_Mueller_2018_Ownershift_report.md", "paper": ""}, {"title": "Ahuja et al. (2021) — CoolMoves", "year": "2021", "desc": "本ドキュメントは、VR（バーチャル・リアリティ）におけるアバターの動きを、プロのパフォーマーのような洗練された動作へとリアルタイムで強調・様式化するシステム「CoolMoves」について詳述したものである。 現在の消費者向けVRシステムは、ヘッドセットとハンドコントローラーという限定的な入力（三点追跡）に依存しており、全身の表現力や「スタイリッシュさ」において、従来のコンソールゲームのような高度な", "audio": "episodes/Ahuja%20et%20al.%20%282021%29%20%E2%80%94%20CoolMoves/Ahuja_et_al_2021_CoolMoves_radio.mp3", "img": "episodes/Ahuja%20et%20al.%20%282021%29%20%E2%80%94%20CoolMoves/Ahuja_et_al_2021_CoolMoves_infographic.png", "report": "episodes/Ahuja%20et%20al.%20%282021%29%20%E2%80%94%20CoolMoves/Ahuja_et_al_2021_CoolMoves_report.md", "paper": ""}, {"title": "Spampinato and Celnik (2021) — Multiple Motor Learning Processes in Humans", "year": "2021", "desc": "本ドキュメントは、Danny SpampinatoおよびPablo Celnikによる研究レビュー「Multiple Motor Learning Processes in Humans: Defining Their Neurophysiological Bases (2021)」に基づき、ヒトが新しい運動行動を獲得・修正する際の神経生理学的メカニズムをまとめたものである。 ---", "audio": "episodes/Spampinato%20and%20Celnik%20%282021%29%20%E2%80%94%20Multiple%20Motor%20Learning%20Processes%20in%20Humans/Spampinato_Celnik_2021_radio.mp3", "img": "episodes/Spampinato%20and%20Celnik%20%282021%29%20%E2%80%94%20Multiple%20Motor%20Learning%20Processes%20in%20Humans/Spampinato_Celnik_2021_infographic.png", "report": "episodes/Spampinato%20and%20Celnik%20%282021%29%20%E2%80%94%20Multiple%20Motor%20Learning%20Processes%20in%20Humans/Spampinato_Celnik_2021_report.md", "paper": ""}, {"title": "Lanillos et al. (2021) — Active strategies for multisensory conflict suppression", "year": "2021", "desc": "本資料は、Lanillosら（2021年）による研究に基づき、自己身体知覚の柔軟性と、感覚情報の不一致を解消するために脳が採用する「能動的戦略」について詳述するものである。 従来、ラバーハンド錯覚（RHI）などの身体所有感の変容は、自己の身体位置が視覚的な対象に近づく「固有感覚のドリフト」という受動的な知覚の変化として理解されてきた。しかし、本研究は**能動的推論（Active Inference", "audio": "episodes/Lanillos%20et%20al.%20%282021%29%20%E2%80%94%20Active%20strategies%20for%20multisensory%20conflict%20suppression/Lanillos_et_al_2021_radio.mp3", "img": "episodes/Lanillos%20et%20al.%20%282021%29%20%E2%80%94%20Active%20strategies%20for%20multisensory%20conflict%20suppression/Lanillos%20et%20al.%202021_infographic.png", "report": "episodes/Lanillos%20et%20al.%20%282021%29%20%E2%80%94%20Active%20strategies%20for%20multisensory%20conflict%20suppression/Lanillos%20et%20al.%202021_report.md", "paper": ""}, {"title": "Iwasaki et al. (2022) — Embodiment modifies attention allotment", "year": "2022", "desc": "本ドキュメントは、岩崎ら（2022年）による研究「Embodiment modifies attention allotment for the benefit of dual task performance（身体化は二重課題のパフォーマンス向上のために注意配分を修正する）」に基づき、身体化（エンボディメント）が人間の注意配分とタスク遂行能力に与える影響を分析したものである。 この研究は、仮想現", "audio": "episodes/Iwasaki%20et%20al.%20%282022%29%20%E2%80%94%20Embodiment%20modifies%20attention%20allotment/Iwasaki%20et%20al.%202022_radio.mp3", "img": "episodes/Iwasaki%20et%20al.%20%282022%29%20%E2%80%94%20Embodiment%20modifies%20attention%20allotment/Iwasaki%20et%20al.%202022_infographic.png", "report": "episodes/Iwasaki%20et%20al.%20%282022%29%20%E2%80%94%20Embodiment%20modifies%20attention%20allotment/Iwasaki%20et%20al.%202022%20%E2%80%94%20Embodiment%20modifies%20attention_radio_report.md", "paper": ""}, {"title": "Maister et al. (2013) — Mirror-touch synaesthesia changes representations of self-identity", "year": "2013", "desc": "本報告書は、ミラータッチ共感覚（MTS）を持つ個人において、他者が触れられる様子を観察することが、自己の身体的アイデンティティ（自己顔認識）のメンタル表象にどのような影響を与えるかを分析した研究資料に基づき作成された。 本研究は、他者が触れられるのを見て自分の体に触覚を感じる「ミラータッチ共感覚（MTS）」が、単なる感覚的な現象に留まらず、自己と他者の境界という高次の認知プロセスにまで影響を及ぼし", "audio": "episodes/Maister%20et%20al.%20%282013%29%20%E2%80%94%20Mirror-touch%20synaesthesia%20changes%20representations%20of%20self-identity/Maister%20et%20al.%202013%20-%20Mirror-touch%20synaesthesia%20changes%20representations%20of%20self-identity_radio.mp3", "img": "", "report": "episodes/Maister%20et%20al.%20%282013%29%20%E2%80%94%20Mirror-touch%20synaesthesia%20changes%20representations%20of%20self-identity/Maister%20et%20al.%202013%20-%20Mirror-touch%20synaesthesia%20changes%20representations%20of%20self-identity_report.md", "paper": ""}, {"title": "Tajadura-Jiménez and Tsakiris (2014) — Balancing the inner and the outer self", "year": "2014", "desc": "本文書は、Ana Tajadura-JiménezおよびManos Tsakiris（2014年）による研究「Balancing the “inner” and the “outer” self: interoceptive sensitivity modulates self-other boundaries（「内」と「外」の自己のバランス：内受容感覚の鋭敏さが自己と他者の境界を調整する）」に基", "audio": "episodes/Tajadura-Jim%C3%A9nez%20and%20Tsakiris%20%282014%29%20%E2%80%94%20Balancing%20the%20inner%20and%20the%20outer%20self/Tajadura-Jimenez%20and%20Tsakiris%202014%20-%20Balancing%20the%20inner%20and%20the%20outer%20self_radio.mp3", "img": "", "report": "episodes/Tajadura-Jim%C3%A9nez%20and%20Tsakiris%20%282014%29%20%E2%80%94%20Balancing%20the%20inner%20and%20the%20outer%20self/Tajadura-Jimenez%20and%20Tsakiris%202014%20-%20Balancing%20the%20inner%20and%20the%20outer%20self_report.md", "paper": ""}, {"title": "Estudillo and Bindemann (2016) — Multisensory stimulation racial prejudice", "year": "2016", "desc": "本ドキュメントは、Alejandro J. Estudillo氏とMarkus Bindemann氏による研究論文「Multisensory stimulation with other-race faces and the reduction of racial prejudice（他種族の顔を用いた多感覚刺激と人種的偏見の軽減）」に基づき、その主要な知見、実験結果、および示唆をまとめたものであ", "audio": "episodes/Estudillo%20and%20Bindemann%20%282016%29%20%E2%80%94%20Multisensory%20stimulation%20racial%20prejudice/Estudillo%20and%20Bindemann%202016_radio.mp3", "img": "", "report": "episodes/Estudillo%20and%20Bindemann%20%282016%29%20%E2%80%94%20Multisensory%20stimulation%20racial%20prejudice/Estudillo%20and%20Bindemann%202016_report.md", "paper": ""}, {"title": "Panagiotopoulou et al. (2017) — Affective Touch Self-Face Recognition", "year": "2017", "desc": "本ドキュメントは、Panagiotopoulouら（2017年）の研究に基づき、アフェクティブ・タッチ（情動的な触覚）がマルチセンソリー（多感覚）統合の過程において、自己の顔の認識をどのように変容させるかを分析したものである。 研究の核心は、特殊な神経線維（C触覚線維：CT線維）を介して伝達される「心地よい、ゆっくりとした愛撫のような刺激」が、自己と他者の境界を曖昧にする「アンフェイスメント（en", "audio": "episodes/Panagiotopoulou%20et%20al.%20%282017%29%20%E2%80%94%20Affective%20Touch%20Self-Face%20Recognition/Panagiotopoulou%20et%20al.%202017_radio.mp3", "img": "", "report": "episodes/Panagiotopoulou%20et%20al.%20%282017%29%20%E2%80%94%20Affective%20Touch%20Self-Face%20Recognition/Panagiotopoulou%20et%20al.%202017_report.md", "paper": ""}, {"title": "Estudillo et al. (2018) — Multisensory stimulation modulates perceptual and conceptual face representations", "year": "2018", "desc": "本ドキュメントは、Estudilloら（2018年）の研究「Multisensory Stimulation Modulates Perceptual and Post-perceptual Face Representations: Evidence from Event-Related Potentials」に基づき、多感覚刺激が自己の顔認識および他者の顔の内的表現にどのような影響を及ぼすかを", "audio": "episodes/Estudillo%20et%20al.%20%282018%29%20%E2%80%94%20Multisensory%20stimulation%20modulates%20perceptual%20and%20conceptual%20face%20representations/Estudillo_2018_radio.mp3", "img": "", "report": "episodes/Estudillo%20et%20al.%20%282018%29%20%E2%80%94%20Multisensory%20stimulation%20modulates%20perceptual%20and%20conceptual%20face%20representations/Estudillo_2018_report.md", "paper": ""}, {"title": "Froese (2022) — Irruption Theory", "year": "2022", "desc": "本文書は、トム・フローゼ（Tom Froese）が提唱する「陥入理論（Irruption Theory）」についての概要、主要なテーマ、重要な引用、および実践的な示唆をまとめたブリーフィング・ドキュメントである。本理論は、意識的な主体性（エージェンシー）が、いかにして身体の物質的プロセスを直接制御することなく、行動に効果的な違いをもたらし得るかを科学的に説明する新しい枠組みを提示している。 ---", "audio": "episodes/Froese%20%282022%29%20%E2%80%94%20Irruption%20Theory/Froese_2022_radio.mp3", "img": "episodes/Froese%20%282022%29%20%E2%80%94%20Irruption%20Theory/Froese_2022_infographic.png", "report": "episodes/Froese%20%282022%29%20%E2%80%94%20Irruption%20Theory/Froese_2022_report.md", "paper": ""}, {"title": "Mazzurega et al. (2011) — Self-other bodily merging", "year": "2011", "desc": "本ドキュメントは、Mazzuregaら（2011年）による研究論文「Self-other bodily merging in the context of synchronous but arbitrary-related multisensory inputs（同期しているが任意に関連付けられた多感覚入力の文脈における自己と他者の身体的融合）」に基づき、多感覚統合が自己の身体表現と社会的知覚に与", "audio": "episodes/Mazzurega%20et%20al.%20%282011%29%20%E2%80%94%20Self-other%20bodily%20merging/Mazzurega_et_al_2011_radio.mp3", "img": "episodes/Mazzurega%20et%20al.%20%282011%29%20%E2%80%94%20Self-other%20bodily%20merging/Mazzurega_et_al_2011_infographic.png", "report": "episodes/Mazzurega%20et%20al.%20%282011%29%20%E2%80%94%20Self-other%20bodily%20merging/Mazzurega_et_al_2011_report.md", "paper": ""}, {"title": "Botvinick and Cohen (1998) — Rubber hands feel touch that eyes see", "year": "1998", "desc": "本ドキュメントは、マシュー・ボトヴィニク（Matthew Botvinick）とジョナサン・コーエン（Jonathan Cohen）による1998年の研究「Rubber hands ‘feel’ touch that eyes see（ラバーハンドは目が捉えた接触を『感じる』）」の内容を網羅的に分析したブリーフィング・ドキュメントである。本研究は、視覚、触覚、および固有感覚（プロプリオセプション）", "audio": "episodes/Botvinick%20and%20Cohen%20%281998%29%20%E2%80%94%20Rubber%20hands%20feel%20touch%20that%20eyes%20see/Botvinick_and_Cohen_1998_radio.mp3", "img": "episodes/Botvinick%20and%20Cohen%20%281998%29%20%E2%80%94%20Rubber%20hands%20feel%20touch%20that%20eyes%20see/Botvinick_and_Cohen_1998_infographic.png", "report": "episodes/Botvinick%20and%20Cohen%20%281998%29%20%E2%80%94%20Rubber%20hands%20feel%20touch%20that%20eyes%20see/Botvinick_and_Cohen_1998_report.md", "paper": ""}, {"title": "Hernandez-Ortega et al. (2021) — Introduction to Presentation Attack Detection in Face Biometrics", "year": "2021", "desc": "本資料は、顔バイオメトリクス認証における「プレゼンテーション攻撃検知（PAD）」の現状、脆弱性、および最新技術について詳述したものである。顔認証システム（FRS）は、スマートフォン認証、入国審査、監視システムなど、社会の多種多様な領域で急速に普及している。しかし、その利便性の裏で、写真やビデオ、3Dマスクなどの「プレゼンテーション攻撃（PA）」に対する脆弱性が深刻な脅威となっている。 歴史的にFR", "audio": "episodes/Hernandez-Ortega%20et%20al.%20%282021%29%20%E2%80%94%20Introduction%20to%20Presentation%20Attack%20Detection%20in%20Face%20Biometrics/Hernandez-Ortega%20et%20al.%202021_radio.mp3", "img": "episodes/Hernandez-Ortega%20et%20al.%20%282021%29%20%E2%80%94%20Introduction%20to%20Presentation%20Attack%20Detection%20in%20Face%20Biometrics/Hernandez-Ortega%20et%20al.%202021_infographic.png", "report": "episodes/Hernandez-Ortega%20et%20al.%20%282021%29%20%E2%80%94%20Introduction%20to%20Presentation%20Attack%20Detection%20in%20Face%20Biometrics/Hernandez-Ortega%20et%20al.%202021_report.md", "paper": ""}, {"title": "Chang and Tsao (2017) — The Code for Facial Identity in the Primate Brain", "year": "2017", "desc": "本報告書は、ChangおよびTsao（2017年）の研究に基づき、霊長類の脳が複雑な顔のアイデンティティをどのように処理し、符号化しているかについて、そのメカニズムと主要な発見をまとめたものである。 ---", "audio": "episodes/Chang%20and%20Tsao%20%282017%29%20%E2%80%94%20The%20Code%20for%20Facial%20Identity%20in%20the%20Primate%20Brain/Chang%20and%20Tsao%202017_radio.mp3", "img": "e 0upon%20the%20free-energy%20principle/Idei%20et%20al.%202022_report.md", "paper": ""}, {"title": "Fribourg et al. (2021) — Mirror, mirror on my phone", "year": "2021", "desc": "本報告書は、スマートフォンアプリ（SnapchatやInstagram等）で広く普及している拡張現実（AR）フィルタが、ユーザーの「自己顔認識」にどのような影響を与えるかを調査した研究（Fribourg et al. 2021）をまとめたものである。 従来、顔の造作と知覚（信頼性、支配性、魅力など）に関する研究は「他者の顔」を対象としたものが中心であった。しかし、本研究はARフィルタを用いた自己顔", "audio": "episodes/Fribourg%20et%20al.%20%282021%29%20%E2%80%94%20Mirror%2C%20mirror%20on%20my%20phone/Fribourg%20et%20al.%202021_radio.mp3", "img": "episodes/Fribourg%20et%20al.%20%282021%29%20%E2%80%94%20Mirror%2C%20mirror%20on%20my%20phone/Fribourg%20et%20al.%202021_infographic.png", "report": "episodes/Fribourg%20et%20al.%20%282021%29%20%E2%80%94%20Mirror%2C%20mirror%20on%20my%20phone/Fribourg%20et%20al.%202021_report.md", "paper": ""}, {"title": "Jublie and Kumar (2022) — Attentional Bias for Self-Face", "year": "2022", "desc": "本ドキュメントは、Aditi Jublie氏およびDevpriya Kumar氏による研究論文「Attentional Bias for Self-Face: Investigation using Drift Diffusion Modelling (2022)」に基づき、自己顔（Self-face）が人間の注意メカニズムに与える影響とその根底にある心理的プロセスを分析したものです。 ---", "audio": "episodes/Jublie%20and%20Kumar%20%282022%29%20%E2%80%94%20Attentional%20Bias%20for%20Self-Face/Jublie%20and%20Kumar%202022_radio.mp3", "img": "episodes/Jublie%20and%20Kumar%20%282022%29%20%E2%80%94%20Attentional%20Bias%20for%20Self-Face/Jublie%20and%20Kumar%202022_infographic.png", "report": "episodes/Jublie%20and%20Kumar%20%282022%29%20%E2%80%94%20Attentional%20Bias%20for%20Self-Face/Jublie%20and%20Kumar%202022_report.md", "paper": ""}, {"title": "Kohatsu et al. (2022) — Predictability and sense of agency", "year": "2022", "desc": "本ドキュメントは、2022年に発表された研究論文「The role of predictability and sense of agency in time estimation（時間推定における予測可能性と主体感の役割）」に基づき、心理的要因が時間の知覚にどのように影響を及ぼすかを詳細にまとめたものである。 本研究は、時間の経過に対する人間の知覚が、主体感（Sense of Agency: S", "audio": "episodes/Kohatsu%20et%20al.%20%282022%29%20%E2%80%94%20Predictability%20and%20sense%20of%20agency/Kohatsu%20et%20al.%2 elf-recognition/Estudillo_and_Bindemann_2017_report.md", "paper": ""}, {"title": "Dobs et al. (2018) — Use and Usefulness of Dynamic Face Stimuli", "year": "2018", "desc": "本ドキュメントは、Dobsら（2018年）による顔知覚研究における動的顔刺激の利用と有用性に関するレビューをまとめたものである。伝統的に、顔知覚の研究は制御の容易さから静止画像に依存してきた。しかし、現実世界の社会交流における顔は常に動いており、人間の視覚システムは自然な顔の動き（フェイシャル・モーション）に対して極めて高い感度を持っていることが明らかになっている。 本分析では、動的情報が静止情報", "audio": "episodes/Dobs%20et%20al.%20%282018%29%20%E2%80%94%20Use%20and%20Usefulness%20of%20Dynamic%20Face%20Stimuli/Dobs_et_al_2018_radio.mp3", "img": "", "report": "episodes/Dobs%20et%20al.%20%282018%29%20%E2%80%94%20Use%20and%20Usefulness%20of%20Dynamic%20Face%20Stimuli/Dobs_et_al_2018_report.md", "paper": ""}, {"title": "Shimada et al. (2009) — Rubber hand illusion under delayed visual feedback", "year": "2009", "desc": "本文書は、嶋田総太郎氏らによる研究論文「Rubber Hand Illusion under Delayed Visual Feedback（視覚フィードバック遅延下におけるラバーハンド錯覚）」の内容を網羅的に分析し、主要な知見をまとめたものである。 本研究は、自己所有感（self-ownership）の成立に関わる多感覚統合プロセスの時間的境界を明らかにすることを目的としている。ラバーハンド錯覚", "audio": "episodes/Shimada%20et%20al.%20%282009%29%20%E2%80%94%20Rubber%20hand%20illusion%20under%20delayed%20visual%20feedback/Shimada_et_al_2009_radio.mp3", "img": "", "report": "episodes/Shimada%20et%20al.%20%282009%29%20%E2%80%94%20Rubber%20hand%20illusion%20under%20delayed%20visual%20feedback/Shimada_et_al_2009_report.md", "paper": ""}, {"title": "Huynh et al. (2019) — Robotic hand illusion", "year": "2019", "desc": "本ドキュメントは、Huynhら（2019年）による研究「Robotic hand illusion with tactile feedback: Unravelling the relative contribution of visuotactile and visuomotor input to the representation of body parts in space」に基づき、ロボ", "audio": "episodes/Huynh%20et%20al.%20%282019%29%20%E2%80%94%20Robotic%20hand%20illusion/Huynh_et_al_2019_radio.mp3", "img": "", "report": "episodes/Huynh%20et%20al.%20%282019%29%20%E2%80%94%20Robotic%20hand%20illusion/Huynh_et_al_2019_report.md", "paper": ""}, {"title": "Newport et al. (2010) — Fake hands in action", "year": "2010", "desc": "本文書は、Newportら（2010年）による研究「Fake hands in action: embodiment and control of supernumerary limbs（アクションにおける偽の手：余剰肢の自己帰属と制御）」の主要な知見をまとめたものである。 本研究は、従来の「ラバーハンド・イリュージョン（RHI）」を拡張し、コンピュータ制御のビデオフィードバックを用いて、身体表現", "audio": "episodes/Newport%20et%20al.%20%282010%29%20%E2%80%94%20Fake%20hands%20in%20action/Newport_et_al_2010_radio.mp3", "img": "episodes/Newport%20et%20al.%20%282010%29%20%E2%80%94%20Fake%20hands%20in%20action/Newport_et_al_2010_infographic.png", "report": "episodes/Newport%20et%20al.%20%282010%29%20%E2%80%94%20Fake%20hands%20in%20action/Newport_et_al_2010_report.md", "paper": ""}, {"title": "Fan et al. (2021) — The supernumerary rubber hand illusion revisited", "year": "2021", "desc": "本資料は、人間が自身の身体計画（腕2本、脚2本など）を超えて、追加の肢体を自身のものとして認識できるかという認知神経科学上の議論を検証した研究「The supernumerary rubber hand illusion revisited（超過剰ラバーハンド錯覚の再検証）」をまとめたものである。 従来の研究では、人間が一度に所有できるゴム製の腕は1本のみであるという説と、複数の腕を同時に所有でき", "audio": "episodes/Fan%20et%20al.%20%282021%29%20%E2%80%94%20The%20supernumerary%20rubber%20hand%20illusion%20revisited/Fan%20et%20al.%202021_radio.mp3", "img": "episodes/Fan%20et%20al.%20%282021%29%20%E2%80%94%20The%20supernumerary%20rubber%20hand%20illusion%20revisited/Fan%20et%20al.%202021_infographic.png", "report": "episodes/Fan%20et%20al.%20%282021%29%20%E2%80%94%20The%20supernumerary%20rubber%20hand%20illusion%20revisited/Fan%20et%20al.%202021_report.md", "paper": ""}, {"title": "Rosa et al. (2019) — The Supernumerary Hand Illusion in Augmented Reality", "year": "2019", "desc": "本報告書は、拡張現実（AR）環境下で、人間が自身の身体の一部ではない「第3の手」を自身の身体として認識する「余剰肢錯覚（Supernumerary Hand Illusion: SHI）」の実現可能性とその条件を調査した研究（Rosa et al. 2019）をまとめたものである。 従来のラバーハンド錯覚（RHI）は、現実や仮想現実（VR）で研究されてきたが、ARにおいては、視覚的に存在する実在の", "audio": "episodes/Rosa%20et%20al.%20%282019%29%20%E2%80%94%20The%20Supernumerary%20Hand%20Illusion%20in%20Augmented%20Reality/Rosa%20et%20al.%202019_radio.mp3", "img": "episodes/Rosa%20et%20al.%20%282019%29%20%E2%80%94%20The%20Supernumerary%20Hand%20Illusion%20in%20Augmented%20Reality/Rosa%20et%20al.%202019_infographic.png", "report": "episodes/Rosa%20et%20al.%20%282019%29%20%E2%80%94%20The%20Supernumerary%20Hand%20Illusion%20in%20Augmented%20Reality/Rosa%20et%20al.%202019_report.md", "paper": ""}, {"title": "Kocur et al. (2022) — The Rubber Hand Illusion in Virtual Reality and the Real World", "year": "2022", "desc": "本ドキュメントは、Kocurら（2022年）の研究論文「The Rubber Hand Illusion in Virtual Reality and the Real World - Comparable but Different（仮想現実と現実世界におけるラバーハンド錯覚：同等だが異なる）」に基づき、仮想環境における身体所有感のメカニズム、現実世界との差異、および生理学的影響について包括的に", "audio": "episodes/Kocur%20et%20al.%20%282022%29%20%E2%80%94%20The%20Rubber%20Hand%20Illusion%20in%20Virtual%20Reality%20and%20the%20Real%20World/Kocur%20et%20al%202022_radio.mp3", "img": "episodes/Kocur%20et%20al.%20%282022%29%20%E2%80%94%20The%20Rubber%20Hand%20Illusion%20in%20Virtual%20Reality%20and%20the%20Real%20World/Kocur%20et%20al%202022_infographic.png", "report": "episodes/Kocur%20et%20al.%20%282022%29%20%E2%80%94%20The%20Rubber%20Hand%20Illusion%20in%20Virtual%20Reality%20and%20the%20Real%20World/Kocur%20et%20al%202022_report.md", "paper": ""}, {"title": "Aucouturier (2022) — The psychophysics of empathy", "year": "2022", "desc": "本ドキュメントは、論文「Aucouturier 2022 - The psychophysics of empathy: Using reverse-correlation to quantify the overlap between self & other representations of emotional expressions」の内容に基づき、共感のメカニズム、自己と他者の心理的表", "audio": "episodes/Aucouturier%20%282022%29%20%E2%80%94%20The%20psychophysics%20of%20empathy/Aucouturier%202022_radio.mp3", "img": "episodes/Aucouturier%20%282022%29%20%E2%80%94%20The%20psychophysics%20of%20empathy/Aucouturier%202022_infographic.png", "report": "episodes/Aucouturier%20%282022%29%20%E2%80%94%20The%20psychophysics%20of%20empathy/Aucouturier%202022_report.md", "paper": ""}, {"title": "Nakano and Yamamoto (2022) — You trust a face like yours", "year": "2022", "desc": "本報告書は、中野珠実氏と山本拓人氏による研究（2022年）「You trust a face like yours（自分の顔に似た顔を信頼する）」に基づき、見知らぬ人の顔の類似性が信頼性の判断に与える影響を分析したものである。本研究は、最新の深層学習技術を用いて、現実世界の自然な顔における自己類似性と信頼感の相関を明らかにしている。 見知らぬ人の顔から信頼性を評価することは、社会生活において極めて", "audio": "episodes/Nakano%20and%20Yamamoto%20%282022%29%20%E2%80%94%20You%20trust%20a%20face%20like%20yours/Nakano%20and%20Yamamoto%202022_radio.mp3", "img": "episodes/Nakano%20and%20Yamamoto%20%282022%29%20%E2%80%94%20You%20trust%20a%20face%20like%20yours/Nakano%20and%20Yamamoto%202022_infographic.png", "report": "episodes/Nakano%20and%20Yamamoto%20%282022%29%20%E2%80%94%20You%20trust%20a%20face%20like%20yours/Nakano%20and%20Yamamoto%202022_report.md", "paper": ""}, {"title": "Nass et al. (1998) — When my face is the interface", "year": "1998", "desc": "本文書は、コンピュータ・インターフェースにおいてユーザー自身の顔（セルフイメージ）を表示することが、ユーザーの心理や認知、および評価の受け止め方にどのような影響を与えるかを調査した研究「When my face is the interface（Nass et al., 1998）」に基づき、その主要な知見と示唆をまとめたものである。 本研究は、コンピュータ画面上のオーディオ・ビジュアル・イメージ", "audio": "episodes/Nass%20et%20al.%20%281998%29%20%E2%80%94%20When%20my%20face%20is%20the%20interface/Nass%20et%20al%201998_radio.mp3", "img": "episodes/Nass%20et%20al.%20%281998%29%20%E2%80%94%20When%20my%20face%20is%20the%20interface/Nass%20et%20al%201998_infographic.png", "report": "episodes/Nass%20et%20al.%20%281998%29%20%E2%80%94%20When%20my%20face%20is%20the%20interface/Nass%20et%20al%201998_report.md", "paper": ""}, {"title": "Verberne et al. (2015) — Trusting a Virtual Driver", "year": "2015", "desc": "本ドキュメントは、Verberneら（2015年）による研究論文「Trusting a Virtual Driver That Looks, Acts, and Thinks Like You（あなたのように見え、振る舞い、考えるバーチャル・ドライバーへの信頼）」に基づき、バーチャル・エージェントに対する類似性が自動運転車への信頼にどのような影響を与えるかを詳細に分析したものである。 ---", "audio": "episodes/Verberne%20et%20al.%20%282015%29%20%E2%80%94%20Trusting%20a%20Virtual%20Driver/Verberne%20et%20al.%20%282015%29%20%E2%80%94%20Trusting%20a%20Virtual%20Driver_radio.mp3", "img": "episodes/Verberne%20et%20al.%20%282015%29%20%E2%80%94%20Trusting%20a%20Virtual%20Driver/Verberne%20et%20al.%20%282015%29%20%E2%80%94%20Trusting%20a%20Virtual%20Driver_infographic.png", "report": "episodes/Verberne%20et%20al.%20%282015%29%20%E2%80%94%20Trusting%20a%20Virtual%20Driver/Verberne%20et%20al.%20%282015%29%20%E2%80%94%20Trusting%20a%20Virtual%20Driver_report.md", "paper": ""}, {"title": "Bailenson et al. (2001) — Intelligent agents who wear your face", "year": "2001", "desc": "本文書は、カリフォルニア大学サンタバーバラ校の研究チーム（Bailenson et al., 2001）による研究論文「Intelligent agents who wear your face: Users' reactions to the virtual self」の内容をまとめたブリーフィング・ドキュメントである。本研究は、ユーザー自身の顔を模したフォトリアルな3Dモデル（バーチャルな自己", "audio": "episodes/Bailenson%20et%20al.%20%282001%29%20%E2%80%94%20Intelligent%20agents%20who%20wear%20your%20face/Bailenson%20et%20al.%20%282001%29%20%E2%80%94%20Intelligent%20agents%20who%20wear%20your%20face_radio.mp3", "img": "episodes/Bailenson%20et%20al.%20%282001%29%20%E2%80%94%20Intelligent%20agents%20who%20wear%20your%20face/Bailenson%20et%20al.%20%282001%29%20%E2%80%94%20Intelligent%20agents%20who%20wear%20your%20face_infographic.png", "report": "episodes/Bailenson%20et%20al.%20%282001%29%20%E2%80%94%20Intelligent%20agents%20who%20wear%20your%20face/Bailenson%20et%20al.%20%282001%29%20%E2%80%94%20Intelligent%20agents%20who%20wear%20your%20face_report.md", "paper": ""}, {"title": "Fox and Bailenson (2009) — Virtual Self-Modeling", "year": "2009", "desc": "本文書は、スタンフォード大学のJesse Fox氏とJeremy N. Bailenson氏による研究「Virtual Self-Modeling: The Effects of Vicarious Reinforcement and Identification on Exercise Behaviors（仮想自己モデリング：代理強化と同一視が運動行動に与える影響）」に基づき、没入型仮想環境技術", "audio": "episodes/Fox%20and%20Bailenson%20%282009%29%20%E2%80%94%20Virtual%20Self-Modeling/Fox%20and%20Bailenson%20%282009%29%20%E2%80%94%20Virtual%20Self-Modeling_radio.mp3", "img": "episodes/Fox%20and%20Bailenson%20%282009%29%20%E2%80%94%20Virtual%20Self-Modeling/Fox%20and%20Bailenson%20%282009%29%20%E2%80%94%20Virtual%20Self-Modeling_infographic.png", "report": "episodes/Fox%20and%20Bailenson%20%282009%29%20%E2%80%94%20Virtual%20Self-Modeling/Fox%20and%20Bailenson%202009%20-%20report.md", "paper": ""}, {"title": "Yokoi et al. (2014) — Lateralized sensitivity of motor memories", "year": "2 report.md", "paper": ""}, {"title": "Ayase et al. (2023) — Eye size recognition of self and others", "year": "2023", "desc": "本ドキュメントは、慶應義塾大学の綾瀬いずみ氏、森将輝氏、加藤貴昭氏による研究論文「Eye size recognition of self and others among people with self-face dissatisfaction（自己顔不満を持つ人々における自己および他者の目の大きさ認識）」に基づき、その主要な知見、分析、および実用的な洞察をまとめたものである。 本研究は、自己", "audio": "episodes/Ayase%20et%20al.%20%282023%29%20%E2%80%94%20Eye%20size%20recognition%20of%20self%20and%20others/Ayase_et_al_2023_radio.mp3", "img": "episodes/Ayase%20et%20al.%20%282023%29%20%E2%80%94%20Eye%20size%20recognition%20of%20self%20and%20others/Ayase_et_al_2023_infographic.png", "report": "episodes/Ayase%20et%20al.%20%282023%29%20%E2%80%94%20Eye%20size%20recognition%20of%20self%20and%20others/Ayase_et_al_2023_report.md", "paper": ""}, {"title": "Wen and Haggard (2020) — Prediction error and regularity detection", "year": "2020", "desc": "本ドキュメントは、Wen WenおよびPatrick Haggardによる研究「Prediction error and regularity detection underlie two dissociable mechanisms for computing the sense of agency (2020)」の深い分析に基づき、エージェンシー感（自己流動感）の背後にある計算メカニズムをまと", "audio": "episodes/Wen%20and%20Haggard%20%282020%29%20%E2%80%94%20Prediction%20error%20and%20regularity%20detection/Wen_Haggard_2020_radio.mp3", "img": "episodes/Wen%20and%20Haggard%20%282020%29%20%E2%80%94%20Prediction%20error%20and%20regularity%20detection/Wen_and_Haggard_2020_infographic.png", "report": "episodes/Wen%20and%20Haggard%20%282020%29%20%E2%80%94%20Prediction%20error%20and%20regularity%20detection/Wen_and_Haggard_2020_report.md", "paper": ""}, {"title": "Okazawa et al. (2021) — Linear Integration of Sensory Evidence", "year": "2021", "desc": "本資料は、Okazawaら（2021年）の研究に基づき、人間が複雑な視覚対象（特に顔）をどのようにカテゴリ化するかについての計算メカニズムをまとめたものである。本研究は、従来の「物体認識は主に瞬間的な感覚処理である」という見解に対し、認識プロセスが空間的および時間的な証拠の**線形統合（Linear Integration）**に基づいていることを実証した。 主な結論として、顔のカテゴリ化は、まず", "audio": "episodes/Okazawa%20et%20al.%20%282021%29%20%E2%80%94%20Linear%20Integration%20of%20Sensory%20Evidence/Okazawa_et_al_2021_radio.mp3", "img": "episodes/Okazawa%20et%20al.%20%282021%29%20%E2%80%94%20Linear%20Integration%20of%20Sensory%20Evidence/Okazawa_et_al_2021_infographic.png", "report": "episodes/Okazawa%20et%20al.%20%282021%29%20%E2%80%94%20Linear%20Integration%20of%20Sensory%20Evidence/Okazawa_et_al_2021_report.md", "paper": ""}, {"title": "Flanagan et al. (2013) — The role of observers gaze behaviour", "year": "2013", "desc": "本文書は、J. Randall Flanagan氏らによる研究論文（2013年）に基づき、他者の物体操作を観察する際の視線行動の機能的役割、およびそれがアクションの予測や評価にどのように寄与するかを分析したブリーフィング・ドキュメントである。 他者の物体操作を観察する際、観察者はアクター（実行者）と同様に、手が物体に到達する前にその物体に視線を向け、操作が完了するまで注視を維持する「先読み的（プロ", "audio": "episodes/Flanagan%20et%20al.%20%282013%29%20%E2%80%94%20The%20role%20of%20observers%20gaze%20behaviour/Flanagan_et_al_2013_radio.mp3", "img": "episodes/Flanagan%20et%20al.%20%282013%29%20%E2%80%94%20The%20role%20of%20observers%20gaze%20behaviour/Flanagan_et_al_2013_infographic.png", "report": "episodes/Flanagan%20et%20al.%20%282013%29%20%E2%80%94%20The%20role%20of%20observers%20gaze%20behaviour/Flanagan_et_al_2013_report.md", "paper": ""}, {"title": "Rangel et al. (2008) — Neurobiology of value-based decision making", "year": "2008", "desc": "本資料は、価値に基づく意思決定の計算基盤と神経生物学的実装を研究する学際的視点「ニューロエコノミクス（神経経済学）」に関する包括的ブリーフィングである。意思決定は、動物が複数の選択肢から主観的価値に基づいて選択を行う際に発生する普遍的なプロセスであり、ミツバチの採餌から人間の株式取引まで多岐にわたる。 本報告の中心となるのは、意思決定を5つの計算段階に分解し、3つの独立した評価システム（パブロフ型", "audio": "episodes/Rangel%20et%20al.%20%282008%29%20%E2%80%94%20Neurobiology%20of%20value-based%20decision%20making/Rangel%20et%20al.%202008%20-%20Neurobiology%20of%20value-based%20decision%20making_radio.mp3", "img": "episodes/Rangel%20et%20al.%20%282008%29%20%E2%80%94%20Neurobiology%20of%20value-based%20decision%20making/Rangel%20et%20al.%202008%20-%20Neurobiology%20of%20value-based%20decision%20making_infographic.png", "report": "episodes/Rangel%20et%20al.%20%282008%29%20%E2%80%94%20Neurobiology%20of%20value-based%20decision%20making/Rangel%20et%20al.%202008%20-%20Neurobiology%20of%20value-based%20decision%20making_report.md", "paper": ""}, {"title": "Geldard and Sherrick (1972) — The cutaneous rabbit", "year": "1972", "desc": "「皮膚兎錯覚（Cutaneous Rabbit Illusion）」は、皮膚上の離れた地点を連続的に刺激した際に、実際には刺激されていない中間地点で「幻の」接触感覚が生じる知覚現象である。1972年にGeldardとSherrickによって報告されたこの現象は、機械的および電気的なパルス刺激の両方で発生し、観察者はまるで小さな兎が皮膚の上を跳ねているかのような、離散的で均等な間隔の連続した衝撃を経", "audio": "episodes/Geldard%20and%20Sherrick%20%281972%29%20%E2%80%94%20The%20cutaneous%20rabbit/Geldard%20and%20Sherrick%201972%20-%20The%20cutaneous%20rabbit_radio.mp3", "img": "episodes/Geldard%20and%20Sherrick%20%281972%29%20%E2%80%94%20The%20cutaneous%20rabbit/Geldard%20and%20Sherrick%201972%20-%20The%20cutaneous%20rabbit_infographic.png", "report": "episodes/Geldard%20and%20Sherrick%20%281972%29%20%E2%80%94%20The%20cutaneous%20rabbit/Geldard%20and%20Sherrick%201972%20-%20The%20cutaneous%20rabbit_report.md", "paper": ""}, {"title": "Niwa et al. (2023) — Investigating Effects of Facial Self-Similarity Levels on the Impression of Virtual Agents in Serious Non-Serious Contexts", "year": "2023", "desc": "本ドキュメントは、AIエージェントの顔の造形において、ユーザー自身の顔の特徴をどの程度取り入れるべきか、またそれが意思決定の文脈（深刻な状況か、日常的な状況か）によってどのように印象を左右するかを調査した研究報告（Niwa et al., 2023）に基づき、その主要な知見をまとめたものである。 近年、意思決定を支援するAIエージェントの活用が広がっているが、その効果を最大化するためには、ユーザー", "audio": "episodes/Niwa%20et%20al.%20%282023%29%20%E2%80%94%20Investigating%20Effects%20of%20Facial%20Self-Similarity%20Levels%20on%20the%20Impression%20of%20Virtual%20Agents%20in%20Serious%20Non-Serious%20Contexts/Niwa_et_al_2023_radio.mp3", "img": "episodes/Niwa%20et%20al.%20%282023%29%20%E2%80%94%20Investigating%20Effects%20of%20Facial%20Self-Similarity%20Levels%20on%20the%20Impression%20of%20Virtual%20Agents%20in%20Serious%20Non-Serious%20Contexts/Niwa_et_al_2023_infographic.png", "report": "episodes/Niwa%20et%20al.%20%282023%29%20%E2%80%94%20Investigating%20Effects%20of%20Facial%20Self-Similarity%20Levels%20on%20the%20Impression%20of%20Virtual%20Agents%20in%20Serious%20Non-Serious%20Contexts/Niwa_et_al_2023_report.md", "paper": ""}, {"title": "Kondo and Sugimoto (2023) — Effects of the Number of Bodies on Ownership of Multiple Bodies", "year": "2023", "desc": "本報告書は、慶應義塾大学の近藤亮太氏および杉本麻樹氏による研究「Effects of the Number of Bodies on Ownership of Multiple Bodies（複数身体の所有感に対する身体数の影響）」に基づき、バーチャルリアリティ（VR）における複数身体の所有感と身体の数の相関関係について詳述するものである。 VR技術は、自己の本来の身体ではない身体や、複数の身体に", "audio": "episodes/Kondo%20and%20Sugimoto%20%282023%29%20%E2%80%94%20Effects%20of%20the%20Number%20of%20Bodies%20on%20Ownership%20of%20Multiple%20Bodies/Kondo_and_Sugimoto_2023_radio.mp3", "img": "episodes/Kondo%20and%20Sugimoto%20%282023%29%20%E2%80%94%20Effects%20of%20the%20Number%20of%20Bodies%20on%20Ownership%20of%20Multiple%20Bodies/Kondo_and_Sugimoto_2023_infographic.png", "report": "episodes/Kondo%20and%20Sugimoto%20%282023%29%20%E2%80%94%20Effects%20of%20the%20Number%20of%20Bodies%20on%20Ownership%20of%20Multiple%20Bodies/Kondo_and_Sugimoto_2023_report.md", "paper": ""}, {"title": "Danry et al. (2023) — Don't Just Tell Me, Ask Me", "year": "2023", "desc": "本ドキュメントは、AIシステムが単に答えや理由を提示する（教える）のではなく、ユーザーに「問いかける」ことで、人間の論理的思考と批判的判断力をどのように向上させ得るかを分析した研究論文「Don’t Just Tell Me, Ask Me: AI Systems that Intelligently Frame Explanations as Questions Improve Human Log", "audio": "episodes/Danry%20et%20al.%20%282023%29%20%E2%80%94%20Don%27t%20Just%20Tell%20Me%2C%20Ask%20Me/Danry_et_al_2023_radio.mp3", "img": "episodes/Danry%20et%20al.%20%282023%29%20%E2%80%94%20Don%27t%20Just%20Tell%20Me%2C%20Ask%20Me/Danry_et_al_2023_infographic.png", "report": "episodes/Danry%20et%20al.%20%282023%29%20%E2%80%94%20Don%27t%20Just%20Tell%20Me%2C%20Ask%20Me/Danry_et_al_2023_report.md", "paper": ""}, {"title": "Schaffner et al. (2023) — Sensory perception relies on fitness-maximizing codes", "year": "2023", "desc": "本文書は、Schaffnerら（2023年）による研究論文「Sensory perception relies on fitness-maximizing codes」に基づき、生物および人工知能における感覚情報の符号化（エンコーディング）の基本原理を詳述するものである。 長年、神経科学や行動科学では、生物の感覚システムは生物学的限界の範囲内で「可能な限り正確に」外界を再現するように進化してきたと", "audio": "episodes/Schaffner%20et%20al.%20%282023%29%20%E2%80%94%20Sensory%20perception%20relies%20on%20fitness-maximizing%20codes/Schaffner_et_al_2023_radio.mp3", "img": "episodes/Schaffner%20et%20al.%20%282023%29%20%E2%80%94%20Sensory%20perception%20relies%20on%20fitness-maximizing%20codes/Schaffner_et_al_2023_infographic.png", "report": "episodes/Schaffner%20et%20al.%20%282023%29%20%E2%80%94%20Sensory%20perception%20relies%20on%20fitness-maximizing%20codes/Schaffner_et_al_2023_report.md", "paper": ""}, {"title": "Wang et al. (2020) — New measures of agency", "year": "2020", "desc": "本ドキュメントは、Shiyun Wang氏ら（2020年）による研究論文「New measures of agency from an adaptive sensorimotor task」に基づき、自己主体感を測定するための新しいオンライン・モーション・トラッキング・タスクの有効性と、その臨床的応用の可能性についてまとめたものである。 ---", "audio": "episodes/Wang%20et%20al.%20%282020%29%20%E2%80%94%20New%20measures%20of%20agency/Wang_et_al_2020_radio.mp3", "img": "episodes/Wang%20et%20al.%20%282020%29%20%E2%80%94%20New%20measures%20of%20agency/Wang_et_al_2020_infographic.png", "report": "episodes/Wang%20et%20al.%20%282020%29%20%E2%80%94%20New%20measures%20of%20agency/Wang_et_al_2020_report.md", "paper": ""}, {"title": "Yebra et al. (2019) — Action boosts episodic memory encoding", "year": "2019", "desc": "本資料は、人間が環境と相互作用する際に行う「行動」が、その瞬間に提示された情報の記憶（エピソード記憶）の形成にどのような影響を与えるかを分析した研究結果（Yebra et al. 2019）をまとめたものである。 全7件の実験（参加者総数296名）を通じて、自発的な行動（Go反応）が、その行動自体とは無関係な刺激の記憶符号化を促進することが明らかになった。この現象は「行動誘発性記憶促進（AIME:", "audio": "episodes/Yebra%20et%20al.%20%282019%29%20%E2%80%94%20Action%20boosts%20episodic%20memory%20encoding/Yebra_et_al_2019_radio.mp3", "img": "episodes/Yebra%20et%20al.%20%282019%29%20%E2%80%94%20Action%20boosts%20episodic%20memory%20encoding/Yebra_et_al_2019_infographic.png", "report": "episodes/Yebra%20et%20al.%20%282019%29%20%E2%80%94%20Action%20boosts%20episodic%20memory%20encoding/Yebra_et_al_2019_report.md", "paper": ""}, {"title": "Lombardi et al. (2021) — Mixture of Volumetric Primitives", "year": "2021", "desc": "", "audio": "episodes/Lombardi%20et%20al.%20%282021%29%20%E2%80%94%20Mixture%20of%20Volumetric%20Primitives/Lombardi%20et%20al.%202021%20-%20MVP_radio.mp3", "img": "", "report": "", "paper": ""}, {"title": "Bi et al. (2021) — Deep Relightable Appearance Models", "year": "2021", "desc": "", "audio": "episodes/Bi%20et%20al.%20%282021%29%20%E2%80%94%20Deep%20Relightable%20Appearance%20Models/Bi%20et%20al.%202021%20-%20DRAM_radio.mp3", "img": "", "report": "", "paper": ""}, {"title": "Blattmann et al. (2023) — Align your Latents", "year": "2023", "desc": "本文書は、Blattmannら（2023年）による研究論文「Align your Latents: High-Resolution Video Synthesis with Latent Diffusion Models」に基づき、潜在拡散モデル（LDM）をビデオ生成に応用した革新的な手法「Video LDM」の主要な洞察、技術的ブレークスルー、および実用的な応用についてまとめたブリーフィング・ド", "audio": "episodes/Blattmann%20et%20al.%20%282023%29%20%E2%80%94%20Align%20your%20Latents/Blattmann%20et%20al.%202023%20-%20Align%20your%20Latents_radio.mp3", "img": "episodes/Blattmann%20et%20al.%20%282023%29%20%E2%80%94%20Align%20your%20Latents/Blattmann%20et%20al.%202023%20-%20Align%20your%20Latents_infographic.png", "report": "episodes/Blattmann%20et%20al.%20%282023%29%20%E2%80%94%20Align%20your%20Latents/Blattmann%20et%20al.%202023%20-%20Align%20your%20Latents_report.md", "paper": "https://research.nvidia.com/labs/toronto-ai/VideoLDM/"}, {"title": "Wang et al. (2023) — StyleAvatar", "year": "2023", "desc": "本文書は、清華大学の研究チームによって発表された論文「StyleAvatar: Real-time Photo-realistic Portrait Avatar from a Single Video」の内容に基づき、その革新的な手法、技術的詳細、および成果をまとめたブリーフィング・ドキュメントである。 ---", "audio": "episodes/Wang%20et%20al.%20%282023%29%20%E2%80%94%20StyleAvatar/Wang%20et%20al.%202023%20-%20StyleAvatar_radio.mp3", "img": "episodes/Wang%20et%20al.%20%282023%29%20%E2%80%94%20StyleAvatar/Wang%20et%20al.%202023%20-%20StyleAvatar_infographic.png", "report": "episodes/Wang%20et%20al.%20%282023%29%20%E2%80%94%20StyleAvatar/Wang%20et%20al.%202023%20-%20StyleAvatar_report.md", "paper": ""}, {"title": "Azevedo et al. (2023) — Re-cognizing the new self", "year": "2023", "desc": "本文書は、Azevedoら（2023年）による研究報告「Re-cognizing the new self」に基づき、顔面移植手術を受け al.%20%282013%29%20%E2%80%94%20What%20is%20the%20most%20interesting%20part%20of%20the%20brain/Behrens%20et%20al.%202013_report.md", "paper": ""}, {"title": "Low et al. (2026) — Habermolt", "year": "2026", "desc": "本文書は、Joseph Low氏らによる研究報告「HABERMOLT: Delegating Deliberation to AI Representatives」（2026年5月28日公開）の内容を統合し、分析したものである。 熟議民主主義（Deliberative democracy）は、より良い集団的決定を導く可能性がある一方で、人間の注意持続時間や帯域幅（bandwidth）という物理的制", "audio": "episodes/Low%20et%20al.%20%282026%29%20%E2%80%94%20Habermolt/low_et_al_2026_radio.mp3", "img": "", "report": "episodes/Low%20et%20al.%20%282026%29%20%E2%80%94%20Habermolt/low_et_al_2026_report.md", "paper": ""}, {"title": "Grießbach et al. (2026) — Bridging the divide in motor learning research", "year": "2026", "desc": "本文書は、運動学習研究の分野において長年存在する「基礎研究（メカニズムの解明）」と「応用研究（スキルの最適化）」の間の分断を分析し、その統合に向けた戦略を提示するものである。 運動学習は、子供の最初の一歩から外科医の精密な手技に至るまで、人間行動のあらゆる側面に不可欠な要素である。しかし、歴史的経緯により、この分野は計算論的神経科学を背景とする「基礎志向コミュニティ」と、実験心理学や運動科学を背景", "audio": "episodes/Grie%C3%9Fbach%20et%20al.%20%282026%29%20%E2%80%94%20Bridging%20the%20divide%20in%20motor%20learning%20research/griessbach_et_al_2026_radio.mp3", "img": "episodes/Grie%C3%9Fbach%20et%20al.%20%282026%29%20%E2%80%94%20Bridging%20the%20divide%20in%20motor%20learning%20research/griessbach_et_al_2026_infographic.png", "report": "episodes/Grie%C3%9Fbach%20et%20al.%20%282026%29%20%E2%80%94%20Bridging%20the%20divide%20in%20motor%20learning%20research/griessbach_et_al_2026_report.md", "paper": ""}, {"title": "Shimizu et al. (2023) — Morphing Identity", "year": "2023", "desc": "本文書は、ソニーコンピュータサイエンス研究所の研究チーム（Kye Shimizu氏、Santa Naruse氏、Jun Nishida氏、Shunichi Kasahara氏）によって発表された、リアルタイム対人顔モーフィングシステム「Morphing Identity」に関するブリーフィングである。 この研究は、2人のユーザーの顔画像をリアルタイムで混合・入れ替えを行うことで、自己と他者のアイデ", "audio": "episodes/Shimizu%20et%20al.%20%282023%29%20%E2%80%94%20Morphing%20Identity/shimizu2023_radio.mp3", "img": "episodes/Shimizu%20et%20al.%20%282023%29%20%E2%80%94%20Morphing%20Identity/Shimizu_et_al_2023_Morphing_Identity_infographic.png", "re coni et al. (2022) — Neuroscience robotics for hallucinations", "year": "2022", "desc": "本文書は、Bernasconiら（2022年）による研究に基づき、ロボット技術と認知神経科学を統合して「実在感幻覚（Presence Hallucination: PH）」を実験的に誘導・評価する新しい手法についてまとめたものである。 実在感幻覚（PH）とは、周囲に誰もいないにもかかわらず、誰かが近くにいるという鮮明な感覚を抱く現象であり、パーキンソン病、レビー小体型認知症（DLB）、統合失調症な", "audio": "episodes/Bernasconi%20et%20al.%20%282022%29%20%E2%80%94%20Neuroscience%20robotics%20for%20hallucinations/bernasconi_2022_radio.mp3", "img": "", "report": "episodes/Bernasconi%20et%20al.%20%282022%29%20%E2%80%94%20Neuroscience%20robotics%20for%20hallucinations/Bernasconi%20et%20al.%202022_report.md", "paper": ""}, {"title": "Albert et al. (2024) — Numerosity estimation of virtual humans", "year": "2024", "desc": "本文書は、Albertら（2024年）による研究に基づき、パーキンソン病（PD）における「実在感幻覚（Presence Hallucination: PH）」を定量的に評価するための新しいデジタル指標についてまとめたものである。 パーキンソン病患者の約半数が経験する幻覚は、認知症のリスクや死亡率の低下に関連する極めて重要な非運動症状である。しかし、従来の評価方法は患者の主観的な自己報告に依存してお", "audio": "episodes/Albert%20et%20al.%20%282024%29%20%E2%80%94%20Numerosity%20estimation%20of%20virtual%20humans/albert_2024_radio.mp3", "img": "", "report": "episodes/Albert%20et%20al.%20%282024%29%20%E2%80%94%20Numerosity%20estimation%20of%20virtual%20humans/albert_2024_report.md", "paper": ""}, {"title": "Dijkstra and Fleming (2023) — Subjective signal strength distinguishes reality from imagination", "year": "2023", "desc": "本文書は、Nadine DijkstraおよびStephen M. Fleming（2023年）による研究に基づき、人間がどのようにして内部で生成された「想像（イメージ）」と外部からの「現実（知覚）」を区別しているのか、その計算論的および神経科学的なメカニズムを解説するものである。 長年、心理学においては「想像が現実の知覚を抑制する（パーキー効果）」という説が有力であったが、本研究は最新の計算モデ", "audio": "episodes/Dijkstra%20and%20Fleming%20%282023%29%20%E2%80%94%20Subjective%20signal%20strength%20distinguishes%20reality%20from%20imagination/Dijkstra%20and%20Fleming%202023_radio.mp3", "img": "", "report": "episodes/Dijkstra%20and%20Fleming%20%282023%29%20%E2%80%94%20Subjective%20signal%20strength%20distinguishes%20reality%20from%20imagination/Dijkstra%20and%20Fleming%202023_report.md", "paper": ""}, {"title": "Krüger et al. (2024) ons（人間ら", "audio": "episodes/Roselli%20et%20al.%20%282022%29%20%E2%80%94%20Human-likeness%20and%20attribution%20of%20intentionality%20predict%20vicarious%20sense%20of%20agency/roselli_et_al_2022_radio.mp3", "img": "episodes/Roselli%20et%20al.%20%282022%29%20%E2%80%94%20Human-likeness%20and%20attribution%20of%20intentionality%20predict%20vicarious%20sense%20of%20agency/roselli_et_al_2022_infographic.png", "report": "episodes/Roselli%20et%20al.%20%282022%29%20%E2%80%94%20Human-likeness%20and%20attribution%20of%20intentionality%20predict%20vicarious%20sense%20of%20agency/roselli_et_al_2022_report.md", "paper": ""}, {"title": "Cameron et al. (2022) — Undetectable very-low frequency sound increases dancing at a live concert", "year": "2022", "desc": "本ドキュメントは、Cameronら（2022年）による研究「知覚不可能な超低周波音がライブコンサートにおけるダンスを増加させる（Undetectable very-low frequency sound increases dancing at a live concert）」に基づき、その主要な知見をまとめたものである。 この研究は、ライブコンサートという現実的かつ社会的な文脈において、意識的に", "audio": "episodes/Cameron%20et%20al.%20%282022%29%20%E2%80%94%20Undetectable%20very-low%20frequency%20sound%20increases%20dancing%20at%20a%20live%20concert/cameron_et_al_2022_radio.mp3", "img": "episodes/Cameron%20et%20al.%20%282022%29%20%E2%80%94%20Undetectable%20very-low%20frequency%20sound%20increases%20dancing%20at%20a%20live%20concert/cameron_et_al_2022_infographic.png", "report": "episodes/Cameron%20et%20al.%20%282022%29%20%E2%80%94%20Undetectable%20very-low%20frequency%20sound%20increases%20dancing%20at%20a%20live%20concert/cameron_et_al_2022_report.md", "paper": ""}, {"title": "Prescott et al. (2024) — Understanding the sense of self through robotics", "year": "2024", "desc": "本文書は、Tony J. Prescottらによる2024年のレビュー論文「Understanding the sense of self through robotics（ロボット工学を通じた自己の理解）」に基づき、自己意識の科学的解明におけるロボット工学の役割を網羅的にまとめたものである。 自己（セルフ）とは、身体の所有感（SoO）、エージェンシー感（SoA）、そして時間的な経験の統一性といっ", "audio": "episodes/Prescott%20et%20al.%20%282024%29%20%E2%80%94%20Understanding%20the%20sense%20of%20self%20through%20robotics/Prescott_radio.m io.mp3", "img": "", "report": "episodes/Littman%20%281994%29%20%E2%80%94%20Markov%20games/Littman_1994_Markov_games_report.md", "paper": ""}, {"title": "Piao et al. (2025) — AgentSociety", "year": "2025", "desc": "本文書は、大規模言語モデル（LLM）を活用した大規模社会シミュレータ「AgentSociety」に関するブリーフィング・ドキュメントである。AgentSocietyは、1万体以上のエージェントと500万件以上の相互作用を通じて、人間行動のメカニズム解明と社会現象の予測を目指す「計算社会科学2.0」の基盤となるプラットフォームである。 「AgentSociety」は、LLM駆動型の生成社会エージェン", "audio": "episodes/Piao%20et%20al.%20%282025%29%20%E2%80%94%20AgentSociety/Piao_et_al_2025_AgentSociety_radio.mp3", "img": "episodes/Piao%20et%20al.%20%282025%29%20%E2%80%94%20AgentSociety/Piao_et_al_2025_AgentSociety_infographic.png", "report": "episodes/Piao%20et%20al.%20%282025%29%20%E2%80%94%20AgentSociety/Piao_et_al_2025_AgentSociety_report.md", "paper": ""}, {"title": "Gero et al. (2026) — From planning to revision", "year": "2026", "desc": "", "audio": "episodes/Gero%20et%20al.%20%282026%29%20%E2%80%94%20From%20planning%20to%20revision/Gero_et_al_2026_From_planning_to_revision_radio.mp3", "img": "", "report": "", "paper": ""}, {"title": "Logg et al. (2026) — The Cost of Generative AI Collaboration Strategies", "year": "2026", "desc": "", "audio": "episodes/Logg%20et%20al.%20%282026%29%20%E2%80%94%20The%20Cost%20of%20Generative%20AI%20Collaboration%20Strategies/Logg_et_al_2026_The_Cost_of_Generative_AI_Collaboration_Strategies_radio.mp3", "img": "", "report": "", "paper": ""}, {"title": "Smolla and Akcay (2019) — Cultural selection shapes network structure", "year": "2019", "desc": "本ドキュメントは、Marco Smolla氏とErol Akçay氏による研究論文「Cultural selection shapes network structure（文化選択がネットワーク構造を形成する）」の深い分析に基づき、社会ネットワークと文化進化の相互作用についてまとめたものである。 本研究は、人口の社会ネットワーク構造が文化の伝達に影響を与えるだけでなく、どのような文化的特性（スキル", "audio": "episodes/Smolla%20and%20Akcay%20%282019%29%20%E2%80%94%20Cultural%20selection%20shapes%20network%20structure/Smolla_and_Akcay_2019_Cultural_selection_shapes_network_structure_radio.mp3", "img": "", "report": "episodes/Smolla%20and%20Akcay%20%282019%29%20%E2%80%94%20Cultural%20selection%20shapes%20network%20structure/Smolla_and_Akcay_2019_Cultural_selection_shapes_network_structure_report.md", "paper": ""}, {"title": "Glickman and Sharot (2025) — How human AI feedback loops", "year": "2025", "desc": "本資料は、人間と人工知能（AI）の相互作用が、人間の知覚、感情、および社会的判断における偏見（バイアス）をどのように増幅させるかを調査した研究結果をまとめたものである。 1,401名の参加者を対象とした一連の実験により、**「人間とAIのフィードバックループ」**の存在が明らかになった。このループにおいて、AIは学習データに含まれる微細な人間由来の偏見を増幅して出力し、人間はそのAIの出力を学習す", "audio": "episodes/Glickman%20and%20Sharot%20%282025%29%20%E2%80%94%20How%20human%20AI%20feedback%20loops/Glickman_and_Sharot_2025_How_human_AI_feedback_loops_radio.mp3", "img": "", "report": "episodes/Glickman%20and%20Sharot%20%282025%29%20%E2%80%94%20How%20human%20AI%20feedback%20loops/Glickman_and_Sharot_2025_How_human_AI_feedback_loops_report.md", "paper": ""}, {"title": "Yang et al. (2017) — Medical robotics", "year": "2017", "desc": "医療用ロボット工学は、低侵襲手術、標的治療、病院の最適化から緊急対応、義肢、在宅支援に至るまで、医療機器業界の中で最も急速に成長している分野の一つである。技術が進歩し、自律性が高まるにつれ、規制、倫理、法的な障壁が顕在化しており、これらを慎重に検討する必要がある。 本ドキュメントでは、自動運転車の定義を参考に提案された「医療用ロボットにおける6段階の自律性レベル」を軸に、技術的要件、規制上のコスト", "audio": "episodes/Yang%20et%20al.%20%282017%29%20%E2%80%94%20Medical%20robotics/yang2017_medical_robotics_radio.mp3", "img": "", "report": "episodes/Yang%20et%20al.%20%282017%29%20%E2%80%94%20Medical%20robotics/yang2017_medical_robotics_report.md", "paper": ""}, {"title": "Battaglia et al. (2021) — Autonomous surgery", "year": "2021", "desc": "本報告書は、論文「Rethinking Autonomous Surgery: Focusing on Enhancement over Autonomy（自律型手術の再考：自律性から機能強化への焦点移行）」に基づき、手術支援ロボットの現状、技術的課題、および将来の方向性についてまとめたものである。 ---", "audio": "episodes/Battaglia%20et%20al.%20%282021%29%20%E2%80%94%20Autonomous%20surgery/battaglia2021_autonomous_surgery_radio.mp3", "img": "", "report": "episodes/Battaglia%20et%20al.%20%282021%29%20%E2%80%94%20Autonomous%20surgery/battaglia2021_autonomous_surgery_report.md", "paper": ""}, {"title": "Ehrsson (2020) — Multisensory processes in body ownership", "year": "2020", "desc": "", "audio": "episodes/Ehrsson%20%282020%29%20%E2%80%94%20Multisensory%20processes%20in%20body%20ownership/Ehrsson_2020_Multisensory_processes_in_body_ownership_radio.mp3", "img": "", "report": "", "paper": ""}, {"title": "Heirani Moghaddam et al. (2021) — Explicit processes in visuomotor adaptation", "year": "2021", "desc": "本資料は、視覚運動適応（visuomotor adaptation）における「明示的プロセス（意識的なプロセス）」と「暗示的プロセス（無意識的なプロセス）」の評価手法を比較した研究（Heirani Moghaddam et al., 2021）の内容をまとめたものである。 この研究の核心的な問いは、現在広く用いられている2つの評価手法、**プロセス解離手続（PDP）**と**言語報告フレームワーク", "audio": "episodes/Heirani%20Moghaddam%20et%20al.%20%282021%29%20%E2%80%94%20Explicit%20processes%20in%20visuomotor%20adaptation/Heirani_Moghaddam_et_al_2021_Explicit_processes_visuomotor_radio.mp3", "img": "", "report": "episodes/Heirani%20Moghaddam%20et%20al.%20%282021%29%20%E2%80%94%20Explicit%20processes%20in%20visuomotor%20adaptation/Heirani_Moghaddam_et_al_2021_Explicit_processes_visuomotor_report.md", "paper": ""}, {"title": "Brooks et al. (2023) — Deep learning reveals what vocal bursts express", "year": "2023", "desc": "本ドキュメントは、2023年に発表された論文「Deep learning reveals what vocal bursts express in different cultures（深層学習が明らかにする、異なる文化におけるボーカル・バーストの表現内容）」に基づき、非言語音声が持つ感情的意味の構造、文化的共通性、および最新の解析手法についてまとめたものである。 本研究は、ため息、笑い声、叫び声", "audio": "episodes/Brooks%20et%20al.%20%282023%29%20%E2%80%94%20Deep%20learning%20reveals%20what%20vocal%20bursts%20express/Brooks_et_al_2023_Deep_learning_vocal_bursts_radio.mp3", "img": "", "report": "episodes/Brooks%20et%20al.%20%282023%29%20%E2%80%94%20Deep%20learning%20reveals%20what%20vocal%20bursts%20express/Brooks_et_al_2023_Deep_learning_vocal_bursts_report.md", "paper": ""}, {"title": "Mehring et al. (2019) — Augmented manipulation ability", "year": "2019", "desc": "本ドキュメントは、Mehringら（2019年）による、多指症（六本指）の被験者を対象とした神経力学および操作能力に関する調査結果をまとめたものである。この研究は、人間の脳が追加の自由度（dof）をどのように制御し、それが身体能力の向上にどのように寄与するかを明らかにしている。 ---", "audio": "episodes/Mehring%20et%20al.%20%282019%29%20%E2%80%94%20Augmented%20manipulation%20ability/Mehring_et_al_2019_Augmented_manipulation_ability_radio.mp3", "img": "", "report": "episodes/Mehring%20et%20al.%20%282019%29%20%E2%80%94%20Augmented%20manipulation%20ability/Mehring_et_al_2019_Augmented_manipulation_ability_report.md", "paper": ""}, {"title": "Luo et al. (2024) — Precise and dexterous robotic manipulation", "year": "2024", "desc": "本文書は、カリフォルニア大学バークレー校の研究チーム（Luo et al., 2024）が開発した、ビジョンベースのロボット操作システム「HIL-SERL（Human-in-the-Loop Sample-Efficient Robotic Reinforcement Learning）」に関するブリーフィング・ドキュメントである。本システムは、実世界での短時間のトレーニングにより、人間を凌駕する", "audio": "episodes/Luo%20et%20al.%20%282024%29%20%E2%80%94%20Precise%20and%20dexterous%20robotic%20manipulation/Luo_et_al_2024_Precise_and_dexterous_robotic_manipulation_radio.mp3", "img": "", "report": "episodes/Luo%20et%20al.%20%282024%29%20%E2%80%94%20Precise%20and%20dexterous%20robotic%20manipulation/Luo_et_al_2024_Precise_and_dexterous_robotic_manipulation_report.md", "paper": ""}, {"title": "Diaz et al. (2023) — Human-in-the-loop optimization of wearable robotic devices", "year": "2023", "desc": "", "audio": "episodes/Diaz%20et%20al.%20%282023%29%20%E2%80%94%20Human-in-the-loop%20optimization%20of%20wearable%20robotic%20devices/Diaz_et_al_2023_Human-in-the-loop_optimization_of_wearable_robotic_devices_radio.mp3", "img": "", "report": "", "paper": ""}, {"title": "Eden et al. (2022) — Principles of human movement augmentation", "year": "2022", "desc": "Edenら（2022）による総説論文。人間の運動能力（自由度：DoF）を人工的に拡張する「運動拡張」技術を体系的に分類し、実現に向けた神経科学的・工学的・倫理的課題を包括的に論じている。 - **自律的拡張（Autonomous augmentation）**: デバイスが自律的に動作", "audio": "episodes/Eden%20et%20al.%20%282022%29%20%E2%80%94%20Principles%20of%20human%20movement%20augmentation/Eden_et_al_2022_Principles_of_human_movement_augmentation_radio.mp3", "img": "episodes/Eden%20et%20al.%20%282022%29%20%E2%80%94%20Principles%20of%20human%20movement%20augmentation/Eden%20et%20al.%202022_infographic.png", "report": "episodes/Eden%20et%20al.%20%282022%29%20%E2%80%94%20Principles%20of%20human%20movement%20augmentation/Eden%20et%20al.%202022%20%E2%80%94%20Principles%20of%20human_radio_report.md", "paper": ""}];

var player = document.getElementById('player');
var current = -1;
var els = {
  count: document.getElementById('ep-count'),
  grid: document.getElementById('episodes'),
  art: document.getElementById('pb-art'),
  title: document.getElementById('pb-title'),
  sub: document.getElementById('pb-sub'),
  play: document.getElementById('btn-play'),
  icPlay: document.getElementById('ic-play'),
  icPause: document.getElementById('ic-pause'),
  seek: document.getElementById('seek'),
  tCur: document.getElementById('t-cur'),
  tDur: document.getElementById('t-dur'),
  vol: document.getElementById('vol')
};

function fmt(s) {
  s = Math.max(0, Math.floor(s || 0));
  return Math.floor(s / 60) + ':' + ('0' + (s % 60)).slice(-2);
}
function setP(el) {
  var pct = el.max > 0 ? (el.value / el.max * 100) : 0;
  el.style.setProperty('--p', pct + '%');
}

function render() {
  els.count.textContent = EPISODES.length;
  var html = '';
  for (var i = 0; i < EPISODES.length; i++) {
    var ep = EPISODES[i];
    var hue = (i * 47) % 360;
    var art = ep.img
      ? '<img src="' + ep.img + '" alt="" loading="lazy">'
      : '<div class="ph" style="background:linear-gradient(135deg,hsl(' + hue + ',45%,30%),hsl(' + ((hue + 40) % 360) + ',55%,14%))">🎧</div>';
    html += '<div class="card" id="card-' + i + '" onclick="play(' + i + ')">'
      + '<div class="card-art">' + art
      + '<div class="eq"><i></i><i></i><i></i></div>'
      + '<button class="card-play" aria-label="再生"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button>'
      + '</div>'
      + '<h3>' + ep.title + '</h3>'
      + '<div class="card-meta">' + (ep.year || '') + (ep.desc ? ' · ' + ep.desc : '') + '</div>'
      + '</div>';
  }
  els.grid.innerHTML = html;
}

function showEpisode(i, doPlay) {
  var ep = EPISODES[i];
  current = i;
  player.src = ep.audio;
  if (doPlay) {
    initAudioGraph();
    if (actx && actx.state === 'suspended') actx.resume();
    player.play();
  }
  els.title.textContent = ep.title;
  els.sub.textContent = ep.year ? ep.year + '年の論文' : 'Paperpile Radio';
  els.art.innerHTML = ep.img ? '<img src="' + ep.img + '" alt="">' : '🎧';
  document.title = ep.title + ' — Paperpile Radio';
  var active = document.querySelector('.card.active');
  if (active) active.classList.remove('active');
  var card = document.getElementById('card-' + i);
  if (card) card.classList.add('active');
  if ('mediaSession' in navigator) {
    navigator.mediaSession.metadata = new MediaMetadata({
      title: ep.title,
      artist: 'Paperpile Radio',
      artwork: ep.img ? [{ src: ep.img }] : []
    });
  }
  openPanel(i);
}

function play(i) {
  if (i < 0 || i >= EPISODES.length) return;
  if (i === current) {
    openPanel(i);
    togglePlay();
    return;
  }
  showEpisode(i, true);
}

function togglePlay() {
  if (current < 0) { play(0); return; }
  if (player.paused) {
    if (actx && actx.state === 'suspended') actx.resume();
    player.play();
  } else {
    player.pause();
  }
}

els.play.addEventListener('click', togglePlay);
document.getElementById('btn-prev').addEventListener('click', function () {
  if (current > 0 && player.currentTime < 3) { play(current - 1); }
  else { player.currentTime = 0; }
});
document.getElementById('btn-next').addEventListener('click', function () { play(current + 1); });

player.addEventListener('play', function () {
  document.body.classList.add('playing');
  els.icPlay.style.display = 'none';
  els.icPause.style.display = 'block';
});
player.addEventListener('pause', function () {
  document.body.classList.remove('playing');
  els.icPlay.style.display = 'block';
  els.icPause.style.display = 'none';
});
player.addEventListener('ended', function () {
  if (current < EPISODES.length - 1) play(current + 1);
});
player.addEventListener('loadedmetadata', function () {
  els.seek.max = player.duration || 0;
  els.tDur.textContent = fmt(player.duration);
});

var seeking = false;
player.addEventListener('timeupdate', function () {
  if (seeking) return;
  els.seek.value = player.currentTime || 0;
  setP(els.seek);
  els.tCur.textContent = fmt(player.currentTime);
});
els.seek.addEventListener('input', function () {
  seeking = true;
  setP(els.seek);
  els.tCur.textContent = fmt(+els.seek.value);
});
els.seek.addEventListener('change', function () {
  player.currentTime = +els.seek.value;
  seeking = false;
});

els.vol.addEventListener('input', function () {
  player.volume = +els.vol.value;
  setP(els.vol);
});

document.addEventListener('keydown', function (e) {
  if (e.code === 'Space' && !/INPUT|TEXTAREA|BUTTON/.test(document.activeElement.tagName)) {
    e.preventDefault();
    togglePlay();
  }
  if (e.code === 'Escape') {
    if (lightbox.classList.contains('open')) closeLightbox();
    else if (document.body.classList.contains('panel-open')) closePanel();
  }
});

/* ---- now-playing panel ---- */
var panelEp = -1, mdCache = {};
var panelEls = {
  art: document.getElementById('panel-art'),
  title: document.getElementById('panel-title'),
  year: document.getElementById('panel-year'),
  links: document.getElementById('panel-links'),
  md: document.getElementById('panel-md')
};
var lightbox = document.getElementById('lightbox');
var lightboxImg = document.getElementById('lightbox-img');

function escapeHtml(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
function inlineMd(s) {
  s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
  s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  s = s.replace(/(^|[\s（(])(https?:\/\/[^\s<）)]+)/g, '$1<a href="$2" target="_blank" rel="noopener">$2</a>');
  return s;
}
function mdToHtml(md) {
  var lines = escapeHtml(md).split(/\r?\n/);
  var out = [], stack = [], para = [];
  function closePara() {
    if (para.length) { out.push('<p>' + inlineMd(para.join(' ')) + '</p>'); para = []; }
  }
  function closeLists(d) {
    while (stack.length > d) out.push('</' + stack.pop() + '>');
  }
  for (var k = 0; k < lines.length; k++) {
    var ln = lines[k], m;
    if (/^\s*$/.test(ln)) { closePara(); closeLists(0); continue; }
    if (/^\s*(---+|\*\*\*+)\s*$/.test(ln)) { closePara(); closeLists(0); out.push('<hr>'); continue; }
    if ((m = ln.match(/^(#{1,4})\s+(.*)/))) {
      closePara(); closeLists(0);
      var h = Math.min(m[1].length + 1, 4);
      out.push('<h' + h + '>' + inlineMd(m[2]) + '</h' + h + '>');
      continue;
    }
    if ((m = ln.match(/^(\s*)([*+-]|\d+\.)\s+(.*)/))) {
      closePara();
      var depth = Math.min(Math.floor(m[1].length / 4) + 1, 3);
      var tag = /\d/.test(m[2].charAt(0)) ? 'ol' : 'ul';
      closeLists(depth);
      while (stack.length < depth) { stack.push(tag); out.push('<' + tag + '>'); }
      out.push('<li>' + inlineMd(m[3]) + '</li>');
      continue;
    }
    para.push(ln.trim());
  }
  closePara(); closeLists(0);
  return out.join('\n');
}

function openPanel(i) {
  var ep = EPISODES[i];
  if (panelEp !== i) {
    panelEp = i;
    panelEls.title.textContent = ep.title;
    panelEls.year.textContent = ep.year ? ep.year + '年の論文' : '';
    panelEls.art.innerHTML = ep.img
      ? '<img src="' + ep.img + '" alt="インフォグラフィック" onclick="openLightbox()">'
      : '<div class="ph">🎧</div>';
    var links = '';
    if (ep.paper) links += '<a class="pill" href="' + ep.paper + '" target="_blank" rel="noopener">📄 論文を開く</a>';
    links += '<a class="pill" href="https://scholar.google.com/scholar?q=' + encodeURIComponent(ep.title) + '" target="_blank" rel="noopener">🔍 Google Scholarで探す</a>';
    if (ep.img) links += '<button class="pill" onclick="openLightbox()">🖼 インフォグラフィックを拡大</button>';
    panelEls.links.innerHTML = links;
    loadReport(ep, i);
    document.getElementById('panel').scrollTop = 0;
  }
  document.body.classList.add('panel-open');
  history.replaceState(null, '', '#ep=' + i);
}
function closePanel() {
  document.body.classList.remove('panel-open');
  history.replaceState(null, '', location.pathname + location.search);
}
document.getElementById('panel-close').addEventListener('click', closePanel);
document.getElementById('pb-left').addEventListener('click', function () {
  if (current < 0) return;
  if (document.body.classList.contains('panel-open') && panelEp === current) closePanel();
  else openPanel(current);
});

function loadReport(ep, i) {
  if (!ep.report) {
    panelEls.md.innerHTML = ep.desc
      ? '<p>' + escapeHtml(ep.desc) + '…</p>'
      : '<p class="md-missing">このエピソードの解説はまだありません。</p>';
    return;
  }
  if (mdCache[ep.report]) { panelEls.md.innerHTML = mdCache[ep.report]; return; }
  panelEls.md.innerHTML = '<p class="md-missing">解説を読み込み中…</p>';
  fetch(ep.report)
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); })
    .then(function (t) {
      mdCache[ep.report] = mdToHtml(t);
      if (panelEp === i) panelEls.md.innerHTML = mdCache[ep.report];
    })
    .catch(function () {
      if (panelEp === i) panelEls.md.innerHTML = '<p class="md-missing">解説を読み込めませんでした。</p>';
    });
}

function openLightbox() {
  var ep = EPISODES[panelEp];
  if (!ep || !ep.img) return;
  lightboxImg.src = ep.img;
  lightbox.classList.add('open');
}
function closeLightbox() { lightbox.classList.remove('open'); }
lightbox.addEventListener('click', closeLightbox);

/* ---- VU level meter ---- */
var actx = null, analyserL = null, analyserR = null, bufL = null, bufR = null;
function initAudioGraph() {
  if (actx) return;
  try {
    actx = new (window.AudioContext || window.webkitAudioContext)();
    var src = actx.createMediaElementSource(player);
    var splitter = actx.createChannelSplitter(2);
    analyserL = actx.createAnalyser();
    analyserR = actx.createAnalyser();
    analyserL.fftSize = 1024;
    analyserR.fftSize = 1024;
    src.connect(splitter);
    splitter.connect(analyserL, 0);
    splitter.connect(analyserR, 1);
    src.connect(actx.destination);
    bufL = new Uint8Array(analyserL.fftSize);
    bufR = new Uint8Array(analyserR.fftSize);
  } catch (e) {
    actx = null; analyserL = null; analyserR = null;
  }
}
function rmsOf(an, buf) {
  an.getByteTimeDomainData(buf);
  var s = 0;
  for (var i = 0; i < buf.length; i++) {
    var v = (buf[i] - 128) / 128;
    s += v * v;
  }
  return Math.sqrt(s / buf.length);
}

var vu = document.getElementById('vu');
var mctx = vu.getContext('2d');
var dpr = window.devicePixelRatio || 1;
var vuW = 0, vuH = 0;
function sizeMeter() {
  vuW = vu.clientWidth; vuH = vu.clientHeight;
  vu.width = vuW * dpr; vu.height = vuH * dpr;
}
window.addEventListener('resize', sizeMeter);

var LVL = [0, 0], PK = [0, 0], PKT = [0, 0];
function drawMeter(ts) {
  requestAnimationFrame(drawMeter);
  if (!vuW) sizeMeter();
  mctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  mctx.clearRect(0, 0, vuW, vuH);
  var rms = [0, 0];
  if (analyserL && !player.paused) {
    rms[0] = rmsOf(analyserL, bufL);
    rms[1] = rmsOf(analyserR, bufR);
    if (rms[1] < 1e-4 && rms[0] > 1e-3) rms[1] = rms[0]; /* モノラル音源はLを両chに */
  }
  var n = 20, x0 = 15, segW = (vuW - x0 - 3) / n;
  var rowH = (vuH - 14) / 2;
  mctx.font = '9px ui-monospace,monospace';
  for (var c = 0; c < 2; c++) {
    var db = 20 * Math.log(Math.max(rms[c], 1e-6)) / Math.LN10;
    var t = Math.max(0, Math.min(1, (db + 48) / 48));
    LVL[c] = t > LVL[c] ? t : Math.max(t, LVL[c] - 0.04);
    if (LVL[c] >= PK[c]) { PK[c] = LVL[c]; PKT[c] = ts || 0; }
    else if ((ts || 0) - PKT[c] > 700) { PK[c] = Math.max(LVL[c], PK[c] - 0.015); }
    var y = 5 + c * (rowH + 4);
    mctx.globalAlpha = 1;
    mctx.fillStyle = '#8b8b8b';
    mctx.fillText(c ? 'R' : 'L', 4, y + rowH - 1);
    var lit = Math.round(LVL[c] * n);
    var pk = Math.round(PK[c] * n) - 1;
    for (var i = 0; i < n; i++) {
      mctx.fillStyle = i < n * 0.55 ? '#1db954' : (i < n * 0.8 ? '#e7a917' : '#e9432f');
      mctx.globalAlpha = (i < lit || (i === pk && pk >= lit)) ? 1 : 0.13;
      mctx.fillRect(x0 + i * segW, y, segW - 1.5, rowH);
    }
  }
  mctx.globalAlpha = 1;
}

setP(els.seek);
setP(els.vol);
render();
requestAnimationFrame(drawMeter);

var hashEp = location.hash.match(/^#ep=(\d+)$/);
if (hashEp) {
  var hi = +hashEp[1];
  if (hi >= 0 && hi < EPISODES.length) showEpisode(hi, false);
}
</script>
