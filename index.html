<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#121212">
<title>Paperpile Radio 🎧</title>
<style>
  :root { --bg:#121212; --card:#181818; --card-hover:#282828; --text:#fff; --muted:#b3b3b3; --sub:#a7a7a7; --green:#1db954; --green-hover:#1ed760; --track:#4d4d4d; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html { scroll-behavior:smooth; }
  body { background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif; line-height:1.5; padding-bottom:130px; }
  a { color:var(--muted); }
  a:hover { color:var(--text); }

  /* ---- hero ---- */
  .hero { background:linear-gradient(180deg,#1f4a38 0%,#16281f 45%,var(--bg) 100%); padding:56px 24px 36px; }
  .hero-inner { max-width:1200px; margin:0 auto; display:flex; align-items:flex-end; gap:28px; }
  .hero-inner > div { min-width:0; }
  .hero-art { width:168px; height:168px; flex-shrink:0; border-radius:10px; background:linear-gradient(135deg,#1db954,#0e5c2f 60%,#083b1e); display:flex; align-items:center; justify-content:center; font-size:72px; box-shadow:0 16px 48px rgba(0,0,0,.55); }
  .eyebrow { font-size:.78rem; font-weight:700; letter-spacing:.06em; }
  .hero h1 { font-size:clamp(2.2rem,5.5vw,4.2rem); font-weight:900; letter-spacing:-.02em; line-height:1.1; margin:.2em 0 .25em; }
  .hero-desc { color:var(--muted); font-size:.95rem; }
  .hero-meta { color:var(--muted); font-size:.85rem; margin-top:.6em; }
  .hero-meta b { color:var(--text); font-weight:700; }

  /* ---- episode grid ---- */
  main { max-width:1200px; margin:0 auto; padding:0 24px; }
  .section-title { font-size:1.45rem; font-weight:800; margin:28px 0 18px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:22px; }
  .card { background:var(--card); border-radius:8px; padding:14px; cursor:pointer; transition:background .25s; }
  .card:hover { background:var(--card-hover); }
  .card-art { position:relative; aspect-ratio:1/1; border-radius:6px; overflow:hidden; margin-bottom:12px; box-shadow:0 8px 24px rgba(0,0,0,.4); }
  .card-art img, .card-art .ph { width:100%; height:100%; object-fit:cover; display:flex; align-items:center; justify-content:center; font-size:52px; }
  .card h3 { font-size:.95rem; font-weight:700; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .card-meta { color:var(--sub); font-size:.8rem; line-height:1.6; margin-top:.4em; display:-webkit-box; -webkit-line-clamp:5; -webkit-box-orient:vertical; overflow:hidden; }
  .card.active h3 { color:var(--green); }
  .card-play { position:absolute; right:8px; bottom:8px; width:44px; height:44px; border:none; border-radius:50%; background:var(--green); color:#000; display:flex; align-items:center; justify-content:center; cursor:pointer; opacity:0; transform:translateY(8px); transition:opacity .25s,transform .25s,background .15s; box-shadow:0 8px 16px rgba(0,0,0,.5); }
  .card:hover .card-play { opacity:1; transform:none; }
  .card-play:hover { background:var(--green-hover); transform:scale(1.05); }
  .card-play svg { width:18px; height:18px; fill:currentColor; }
  .eq { position:absolute; left:10px; bottom:10px; display:none; gap:2.5px; align-items:flex-end; height:16px; }
  .card.active .eq { display:flex; }
  .eq i { width:3px; height:5px; background:var(--green); border-radius:1px; animation:eq 1.1s infinite ease-in-out; }
  .eq i:nth-child(2) { animation-delay:.25s; }
  .eq i:nth-child(3) { animation-delay:.5s; }
  @keyframes eq { 0%,100%{height:5px} 50%{height:16px} }
  body:not(.playing) .eq i { animation-play-state:paused; }

  footer { text-align:center; padding:44px 0 24px; color:var(--sub); font-size:.8rem; }

  /* ---- now-playing panel ---- */
  main, .hero-inner { transition:margin-right .3s; }
  .panel { position:fixed; top:0; right:0; bottom:86px; width:min(580px,46vw); max-width:100vw; background:#121212; border-left:1px solid #282828; z-index:40; transform:translateX(102%); transition:transform .3s; overflow-y:auto; overscroll-behavior:contain; }
  body.panel-open .panel { transform:none; }
  .panel-head { position:sticky; top:0; z-index:2; display:flex; justify-content:space-between; align-items:center; padding:10px 14px; background:rgba(18,18,18,.88); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); }
  .panel-label { font-size:.75rem; font-weight:700; letter-spacing:.05em; color:var(--muted); }
  .panel-art img { width:100%; display:block; cursor:zoom-in; }
  .panel-art .ph { width:100%; height:180px; display:flex; align-items:center; justify-content:center; font-size:56px; background:linear-gradient(135deg,#1f3d2f,#132218); }
  .panel-body { padding:18px 20px 40px; }
  .panel-body h2 { font-size:1.05rem; font-weight:800; line-height:1.4; }
  .panel-year { color:var(--sub); font-size:.8rem; margin:.3em 0 1em; }
  .links-row { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:1.2em; }
  .pill { display:inline-flex; align-items:center; gap:6px; border:1px solid #3e3e3e; border-radius:999px; padding:6px 14px; font-size:.78rem; color:var(--text); background:none; text-decoration:none; cursor:pointer; transition:border-color .15s,transform .1s; }
  .pill:hover { border-color:#fff; color:var(--text); transform:scale(1.03); }
  .md { color:#c9c9c9; font-size:.86rem; line-height:1.75; }
  .md h2 { font-size:1rem; color:#fff; margin:1.5em 0 .5em; }
  .md h3 { font-size:.92rem; color:#fff; margin:1.2em 0 .4em; }
  .md h4 { font-size:.86rem; color:#fff; margin:1em 0 .3em; }
  .md p { margin:.6em 0; }
  .md ul, .md ol { margin:.4em 0 .9em; padding-left:1.4em; }
  .md li { margin:.28em 0; }
  .md strong { color:#fff; }
  .md hr { border:none; border-top:1px solid #2e2e2e; margin:1.3em 0; }
  .md code { background:#2a2a2a; padding:.1em .4em; border-radius:4px; font-size:.85em; }
  .md a { color:var(--green); }
  .md-missing { color:var(--sub); font-size:.85rem; }
  @media (min-width:761px) {
    body.panel-open main, body.panel-open .hero-inner { margin-right:calc(min(580px,46vw) + 16px); }
  }

  /* ---- lightbox ---- */
  .lightbox { position:fixed; inset:0; z-index:100; background:rgba(0,0,0,.93); display:none; overflow:auto; cursor:zoom-out; }
  .lightbox.open { display:block; }
  .lightbox img { display:block; margin:28px auto; width:min(96vw,1400px); }

  /* ---- player bar ---- */
  .playerbar { position:fixed; left:0; right:0; bottom:0; z-index:50; background:#181818; border-top:1px solid #282828; display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1.5fr) minmax(0,1fr); align-items:center; gap:16px; padding:12px 18px; min-height:86px; }
  .pb-left { display:flex; align-items:center; gap:12px; min-width:0; cursor:pointer; }
  .pb-art { width:56px; height:56px; flex-shrink:0; border-radius:6px; overflow:hidden; background:linear-gradient(135deg,#2a2a2a,#1a1a1a); display:flex; align-items:center; justify-content:center; font-size:24px; }
  .pb-art img { width:100%; height:100%; object-fit:cover; }
  .pb-info { min-width:0; }
  .pb-title { font-size:.85rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .pb-sub { font-size:.75rem; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .pb-center { display:flex; flex-direction:column; align-items:center; gap:7px; min-width:0; }
  .pb-buttons { display:flex; align-items:center; gap:18px; }
  .ctl { background:none; border:none; color:var(--muted); cursor:pointer; padding:2px; display:flex; }
  .ctl:hover { color:var(--text); }
  .ctl svg { width:17px; height:17px; fill:currentColor; }
  .play-btn { width:34px; height:34px; border:none; border-radius:50%; background:#fff; color:#000; display:flex; align-items:center; justify-content:center; cursor:pointer; transition:transform .1s; }
  .play-btn:hover { transform:scale(1.07); }
  .play-btn svg { width:17px; height:17px; fill:currentColor; }
  .pb-progress { display:flex; align-items:center; gap:9px; width:100%; max-width:600px; }
  .pb-progress time { font-size:.7rem; color:var(--sub); min-width:35px; text-align:center; font-variant-numeric:tabular-nums; }
  .pb-right { display:flex; align-items:center; justify-content:flex-end; gap:14px; min-width:0; }
  #vu { width:150px; height:38px; background:#0a0a0a; border-radius:5px; flex-shrink:0; }
  .vol-wrap { display:flex; align-items:center; gap:7px; color:var(--muted); }
  .vol-wrap svg { width:16px; height:16px; fill:currentColor; flex-shrink:0; }
  #vol { width:92px; }

  /* ---- sliders ---- */
  input[type=range] { -webkit-appearance:none; appearance:none; height:4px; border-radius:2px; flex:1; background:linear-gradient(to right,var(--fill,#fff) var(--p,0%),var(--track) var(--p,0%)); cursor:pointer; outline:none; }
  input[type=range]:hover { --fill:var(--green); }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; width:12px; height:12px; border-radius:50%; background:#fff; opacity:0; transition:opacity .15s; }
  input[type=range]:hover::-webkit-slider-thumb { opacity:1; }
  input[type=range]::-moz-range-thumb { width:12px; height:12px; border:none; border-radius:50%; background:#fff; opacity:0; transition:opacity .15s; }
  input[type=range]:hover::-moz-range-thumb { opacity:1; }

  @media (max-width:760px) {
    .hero { padding:36px 18px 24px; }
    .hero-inner { gap:18px; }
    .hero-art { width:104px; height:104px; font-size:44px; }
    .hero h1 { font-size:clamp(1.5rem,7.5vw,2.4rem); }
    .hero-meta { font-size:.78rem; }
    main { padding:0 18px; }
    .grid { grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:16px; }
    .card-meta { -webkit-line-clamp:3; }
    .playerbar { grid-template-columns:minmax(0,1fr) auto; grid-template-rows:auto auto; row-gap:8px; }
    .pb-left { grid-column:1; grid-row:1; }
    .pb-right { grid-column:2; grid-row:1; }
    .pb-center { grid-column:1/-1; grid-row:2; }
    .pb-art { width:42px; height:42px; }
    #vu { width:104px; height:32px; }
    .vol-wrap { display:none; }
    body { padding-bottom:150px; }
    .panel { width:100%; bottom:0; border-left:none; }
    .panel-body { padding-bottom:170px; }
  }
</style>
</head>
<body>

<div class="hero">
  <div class="hero-inner">
    <div class="hero-art">🎧</div>
    <div>
      <div class="eyebrow">公開ポッドキャスト</div>
      <h1>Paperpile Radio</h1>
      <p class="hero-desc">論文の音声概要ポッドキャスト — NotebookLM AIによる日本語ダイジェスト</p>
      <p class="hero-meta"><b>Paperpile Radio</b> · 全 <b id="ep-count">0</b> エピソード · <a href="feed.xml">RSS Feed</a></p>
    </div>
  </div>
</div>

<main>
  <h2 class="section-title">すべてのエピソード</h2>
  <div class="grid" id="episodes"></div>
  <footer>
    Generated by <a href="https://github.com/shks/paperpile-radio">Paperpile Radio</a> ·
    <a href="feed.xml">RSS Feed</a> ·
    Powered by NotebookLM
  </footer>
</main>

<aside class="panel" id="panel">
  <div class="panel-head">
    <span class="panel-label">エピソード解説</span>
    <button class="ctl" id="panel-close" aria-label="閉じる"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" fill="none"/></svg></button>
  </div>
  <div class="panel-art" id="panel-art"></div>
  <div class="panel-body">
    <h2 id="panel-title"></h2>
    <div class="panel-year" id="panel-year"></div>
    <div class="links-row" id="panel-links"></div>
    <div class="md" id="panel-md"></div>
  </div>
</aside>
<div class="lightbox" id="lightbox"><img id="lightbox-img" alt="インフォグラフィック拡大表示"></div>

<div class="playerbar">
  <div class="pb-left" id="pb-left" title="解説パネルを開く">
    <div class="pb-art" id="pb-art">🎧</div>
    <div class="pb-info">
      <div class="pb-title" id="pb-title">Paperpile Radio</div>
      <div class="pb-sub" id="pb-sub">エピソードを選んでください</div>
    </div>
  </div>
  <div class="pb-center">
    <div class="pb-buttons">
      <button class="ctl" id="btn-prev" aria-label="前のエピソード"><svg viewBox="0 0 24 24"><path d="M6 6h2.5v12H6zM20 6l-10.5 6L20 18z"/></svg></button>
      <button class="play-btn" id="btn-play" aria-label="再生 / 一時停止">
        <svg id="ic-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        <svg id="ic-pause" viewBox="0 0 24 24" style="display:none"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>
      </button>
      <button class="ctl" id="btn-next" aria-label="次のエピソード"><svg viewBox="0 0 24 24"><path d="M15.5 6H18v12h-2.5zM4 6l10.5 6L4 18z"/></svg></button>
    </div>
    <div class="pb-progress">
      <time id="t-cur">0:00</time>
      <input type="range" id="seek" min="0" max="0" step="0.1" value="0" aria-label="シーク">
      <time id="t-dur">0:00</time>
    </div>
  </div>
  <div class="pb-right">
    <canvas id="vu" aria-hidden="true"></canvas>
    <div class="vol-wrap">
      <svg viewBox="0 0 24 24"><path d="M3 10v4h4l5 4V6L7 10H3zm13.5 2a3.5 3.5 0 0 0-2-3.15v6.3a3.5 3.5 0 0 0 2-3.15zm-2-7v2.06A5 5 0 0 1 18 12a5 5 0 0 1-3.5 4.94V19A7 7 0 0 0 20 12a7 7 0 0 0-5.5-7z"/></svg>
      <input type="range" id="vol" min="0" max="1" step="0.01" value="1" aria-label="音量">
    </div>
  </div>
</div>

<audio id="player" preload="none"></audio>

ng", "report": "episodes/Okazawa%20et%20al.%20%282021%29%20%E2%80%94%20Linear%20Integration%20of%20Sensory%20Evidence/Okazawa_et_al_2021_report.md", "paper": ""}, {"title": "Flanagan et al. (2013) — The role of observers gaze behaviour", "year": "2013", "desc": "本文書は、J. Randall Flanagan氏らによる研究論文（2013年）に基づき、他者の物体操作を観察する際の視線行動の機能的役割、およびそれがアクションの予測や評価にどのように寄与するかを分析したブリーフィング・ドキュメントである。 他者の物体操作を観察する際、観察者はアクター（実行者）と同様に、手が物体に到達する前にその物体に視線を向け、操作が完了するまで注視を維持する「先読み的（プロ", "audio": "episodes/Flanagan%20et%20al.%20%282013%29%20%E2%80%94%20The%20role%20of%20observers%20gaze%20behaviour/Flanagan_et_al_2013_radio.mp3", "img": "episodes/Flanagan%20et%20al.%20%282013%29%20%E2%80%94%20The%20role%20of%20observers%20gaze%20behaviour/Flanagan_et_al_2013_infographic.png", "report": "episodes/Flanagan%20et%20al.%20%282013%29%20%E2%80%94%20The%20role%20of%20observers%20gaze%20behaviour/Flanagan_et_al_2013_report.md", "paper": ""}, {"title": "Rangel et al. (2008) — Neurobiology of value-based decision making", "year": "2008", "desc": "本資料は、価値に基づく意思決定の計算基盤と神経生物学的実装を研究する学際的視点「ニューロエコノミクス（神経経済学）」に関する包括的ブリーフィングである。意思決定は、動物が複数の選択肢から主観的価値に基づいて選択を行う際に発生する普遍的なプロセスであり、ミツバチの採餌から人間の株式取引まで多岐にわたる。 本報告の中心となるのは、意思決定を5つの計算段階に分解し、3つの独立した評価システム（パブロフ型", "audio": "episodes/Rangel%20et%20al.%20%282008%29%20%E2%80%94%20Neurobiology%20of%20value-based%20decision%20making/Rangel%20et%20al.%202008%20-%20Neurobiology%20of%20value-based%20decision%20making_radio.mp3", "img": "episodes/Rangel%20et%20al.%20%282008%29%20%E2%80%94%20Neurobiology%20of%20value-based%20decision%20making/Rangel%20et%20al.%202008%20-%20Neurobiology%20of%20value-based%20decision%20making_infographic.png", "report": "episodes/Rangel%20et%20al.%20%282008%29%20%E2%80%94%20Neurobiology%20of%20value-based%20decision%20making/Rangel%20et%20al.%202008%20-%20Neurobiology%20of%20value-based%20decision%20making_report.md", "paper": ""}, {"title": "Geldard and Sherrick (1972) — The cutaneous rabbit", "year": "1972", "desc": "「皮膚兎錯覚（Cutaneous Rabbit Illusion）」は、皮膚上の離れた地点を連続的に刺激した際に、実際には刺激されていない中間地点で「幻の」接触感覚が生じる知覚現象である。1972年にGeldardとSherrickによって報告されたこの現象は、機械的および電気的なパルス刺激の両方で発生し、観察者はまるで小さな兎が皮膚の上を跳ねているかのような、離散的で均等な間隔の連続した衝撃を経", "audio": "episodes/Geldard%20and%20Sherrick%20%281972%29%20%E2%80%94%20The%20cutaneous%20rabbit/Geldard%20and%20Sherrick%201972%20-%20The%20cutaneous%20rabbit_radio.mp3", "img": "episodes/Geldard%20and%20Sherrick%20%281972%29%20%E2%80%94%20The%20cutaneous%20rabbit/Geldard%20and%20Sherrick%201972%20-%20The%20cutaneous%20rabbit_infographic.png", "report": "episodes/Geldard%20and%20Sherrick%20%281972%29%20%E2%80%94%20The%20cutaneous%20rabbit/Geldard%20and%20Sherrick%201972%20-%20The%20cutaneous%20rabbit_report.md", "paper": ""}, {"title": "Niwa et al. (2023) — Investigating Effects of Facial Self-Similarity Levels on the Impression of Virtual Agents in Serious Non-Serious Contexts", "year": "2023", "desc": "本ドキュメントは、AIエージェントの顔の造形において、ユーザー自身の顔の特徴をどの程度取り入れるべきか、またそれが意思決定の文脈（深刻な状況か、日常的な状況か）によってどのように印象を左右するかを調査した研究報告（Niwa et al., 2023）に基づき、その主要な知見をまとめたものである。 近年、意思決定を支援するAIエージェントの活用が広がっているが、その効果を最大化するためには、ユーザー", "audio": "episodes/Niwa%20et%20al.%20%282023%29%20%E2%80%94%20Investigating%20Effects%20of%20Facial%20Self-Similarity%20Levels%20on%20the%20Impression%20of%20Virtual%20Agents%20in%20Serious%20Non-Serious%20Contexts/Niwa_et_al_2023_radio.mp3", "img": "episodes/Niwa%20et%20al.%20%282023%29%20%E2%80%94%20Investigating%20Effects%20of%20Facial%20Self-Similarity%20Levels%20on%20the%20Impression%20of%20Virtual%20Agents%20in%20Serious%20Non-Serious%20Contexts/Niwa_et_al_2023_infographic.png", "report": "episodes/Niwa%20et%20al.%20%282023%29%20%E2%80%94%20Investigating%20Effects%20of%20Facial%20Self-Similarity%20Levels%20on%20the%20Impression%20of%20Virtual%20Agents%20in%20Serious%20Non-Serious%20Contexts/Niwa_et_al_2023_report.md", "paper": ""}, {"title": "Kondo and Sugimoto (2023) — Effects of the Number of Bodies on Ownership of Multiple Bodies", "year": "2023", "desc": "本報告書は、慶應義塾大学の近藤亮太氏および杉本麻樹氏による研究「Effects of the Number of Bodies on Ownership of Multiple Bodies（複数身体の所有感に対する身体数の影響）」に基づき、バーチャルリアリティ（VR）における複数身体の所有感と身体の数の相関関係について詳述するものである。 VR技術は、自己の本来の身体ではない身体や、複数の身体に", "audio": "episodes/Kondo%20and%20Sugimoto%20%282023%29%20%E2%80%94%20Effects%20of%20the%20Number%20of%20Bodies%20on%20Ownership%20of%20Multiple%20Bodies/Kondo_and_Sugimoto_2023_radio.mp3", "img": "episodes/Kondo%20and%20Sugimoto%20%282023%29%20%E2%80%94%20Effects%20of%20the%20Number%20of%20Bodies%20on%20Ownership%20of%20Multiple%20Bodies/Kondo_and_Sugimoto_2023_infographic.png", "report": "episodes/Kondo%20and%20Sugimoto%20%282023%29%20%E2%80%94%20Effects%20of%20the%20Number%20of%20Bodies%20on%20Ownership%20of%20Multiple%20Bodies/Kondo_and_Sugimoto_2023_report.md", "paper": ""}, {"title": "Danry et al. (2023) — Don't Just Tell Me, Ask Me", "year": "2023", "desc": "本ドキュメントは、AIシステムが単に答えや理由を提示する（教える）のではなく、ユーザーに「問いかける」ことで、人間の論理的思考と批判的判断力をどのように向上させ得るかを分析した研究論文「Don’t Just Tell Me, Ask Me: AI Systems that Intelligently Frame Explanations as Questions Improve Human Log", "audio": "episodes/Danry%20et%20al.%20%282023%29%20%E2%80%94%20Don%27t%20Just%20Tell%20Me%2C%20Ask%20Me/Danry_et_al_2023_radio.mp3", "img": "episodes/Danry%20et%20al.%20%282023%29%20%E2%80%94%20Don%27t%20Just%20Tell%20Me%2C%20Ask%20Me/Danry_et_al_2023_infographic.png", "report": "episodes/Danry%20et%20al.%20%282023%29%20%E2%80%94%20Don%27t%20Just%20Tell%20Me%2C%20Ask%20Me/Danry_et_al_2023_report.md", "paper": ""}, {"title": "Schaffner et al. (2023) — Sensory perception relies on fitness-maximizing codes", "year": "2023", "desc": "本文書は、Schaffnerら（2023年）による研究論文「Sensory perception relies on fitness-maximizing codes」に基づき、生物および人工知能における感覚情報の符号化（エンコーディング）の基本原理を詳述するものである。 長年、神経科学や行動科学では、生物の感覚システムは生物学的限界の範囲内で「可能な限り正確に」外界を再現するように進化してきたと", "audio": "episodes/Schaffner%20et%20al.%20%282023%29%20%E2%80%94%20Sensory%20perception%20relies%20on%20fitness-maximizing%20codes/Schaffner_et_al_2023_radio.mp3", "img": "episodes/Schaffner%20et%20al.%20%282023%29% : ""}, {"title": "Low et al. (2026) — Habermolt", "year": "2026", "desc": "本文書は、Joseph Low氏らによる研究報告「HABERMOLT: Delegating Deliberation to AI Representatives」（2026年5月28日公開）の内容を統合し、分析したものである。 熟議民主主義（Deliberative democracy）は、より良い集団的決定を導く可能性がある一方で、人間の注意持続時間や帯域幅（bandwidth）という物理的制", "audio": "episodes/Low%20et%20al.%20%282026%29%20%E2%80%94%20Habermolt/low_et_al_2026_radio.mp3", "img": "", "report": "episodes/Low%20et%20al.%20%282026%29%20%E2%80%94%20Habermolt/low_et_al_2026_report.md", "paper": ""}, {"title": "Grießbach et al. (2026) — Bridging the divide in motor learning research", "year": "2026", "desc": "本文書は、運動学習研究の分野において長年存在する「基礎研究（メカニズムの解明）」と「応用研究（スキルの最適化）」の間の分断を分析し、その統合に向けた戦略を提示するものである。 運動学習は、子供の最初の一歩から外科医の精密な手技に至るまで、人間行動のあらゆる側面に不可欠な要素である。しかし、歴史的経緯により、この分野は計算論的神経科学を背景とする「基礎志向コミュニティ」と、実験心理学や運動科学を背景", "audio": "episodes/Grie%C3%9Fbach%20et%20al.%20%282026%29%20%E2%80%94%20Bridging%20the%20divide%20in%20motor%20learning%20research/griessbach_et_al_2026_radio.mp3", "img": "episodes/Grie%C3%9Fbach%20et%20al.%20%282026%29%20%E2%80%94%20Bridging%20the%20divide%20in%20motor%20learning%20research/griessbach_et_al_2026_infographic.png", "report": "episodes/Grie%C3%9Fbach%20et%20al.%20%282026%29%20%E2%80%94%20Bridging%20the%20divide%20in%20motor%20learning%20research/griessbach_et_al_2026_report.md", "paper": ""}, {"title": "Shimizu et al. (2023) — Morphing Identity", "year": "2023", "desc": "本文書は、清水海氏（ソニーコンピュータサイエンス研究所）らによる研究「Morphing Identity」に関するブリーフィング・ドキュメントである。この研究は、2人のユーザーの顔画像をリアルタイムで合成（モーフィング）し、徐々に入れ替えていくインタラクティブなシステムを通じて、自己と他者のアイデンティティの境界を探索するものである。 従来の研究が静的な状況での顔の所有感に焦点を当てていたのに対し", "audio": "episodes/Shimizu%20et%20al.%20%282023%29%20%E2%80%94%20Morphing%20Identity/shimizu2023_radio.mp3", "img": "episodes/Shimizu%20et%20al.%20%282023%29%20%E2%80%94%20Morphing%20Identity/Shimizu%20et%20al%202023_infographic.png", "report": "episodes/Shimizu%20et%20al.%20%282023%29%20%E2%80%94%20Morphing%20Identity/Shimizu%20et%20al%202023_report.md", "paper": ""}, {"title": "Kawamu 0effects%20in%20sensorimotor%20adaptation/avraham2022_contextual_report.md", "paper": ""}, {"title": "Yoshimura et al. (2024) — Synlogue with Aizuchi-bot", "year": "2024", "desc": "このブリーフィング・ドキュメントは、吉村らによる研究論文「Synlogue with Aizuchi-bot: Investigating the Co-Adaptive and Open-Ended Interaction Paradigm (2024)」に基づき、新しいコミュニケーション・パラダイムである「Synlogue（共話）」の概念、実験的知見、およびヒューマン・コンピュータ・インタラク", "audio": "episodes/Yoshimura%20et%20al.%20%282024%29%20%E2%80%94%20Synlogue%20with%20Aizuchi-bot/yoshimura2024_radio.mp3", "img": "episodes/Yoshimura%20et%20al.%20%282024%29%20%E2%80%94%20Synlogue%20with%20Aizuchi-bot/Yoshimura%20et%20al.%202024_infographic.png", "report": "episodes/Yoshimura%20et%20al.%20%282024%29%20%E2%80%94%20Synlogue%20with%20Aizuchi-bot/Yoshimura%20et%20al.%202024_report.md", "paper": ""}, {"title": "Tunçgenç et al. (2023) — Mimicry and social affiliation", "year": "2023", "desc": "", "audio": "episodes/Tun%C3%A7gen%C3%A7%20et%20al.%20%282023%29%20%E2%80%94%20Mimicry%20and%20social%20affiliation/tuncgenc2023_radio.mp3", "img": "episodes/Tun%C3%A7gen%C3%A7%20et%20al.%20%282023%29%20%E2%80%94%20Mimicry%20and%20social%20affiliation/tuncgenc2023_infographic.png", "report": "", "paper": ""}, {"title": "Yao et al. (2023) — Editing Large Language Models", "year": "2023", "desc": "本ドキュメントは、Yaoら（2023年）による研究「Editing Large Language Models: Problems, Methods, and Opportunities」に基づき、大規模言語モデル（LLM）の知識を効率的に修正・更新する手法である「モデル編集」の現状、課題、および評価に関する包括的な概要をまとめたものである。 大規模言語モデル（LLM）は優れたテキスト生成能力を持", "audio": "episodes/Yao%20et%20al.%20%282023%29%20%E2%80%94%20Editing%20Large%20Language%20Models/yao_et_al_2023_radio.mp3", "img": "episodes/Yao%20et%20al.%20%282023%29%20%E2%80%94%20Editing%20Large%20Language%20Models/Yao%20et%20al.%202023%20-%20Editing%20Large%20Language%20Models_infographic.png", "report": "episodes/Yao%20et%20al.%20%282023%29%20%E2%80%94%20Editing%20Large%20Language%20Models/Yao%20et%20al.%202023%20-%20Editing%20Large%20Language%20Models_report.md", "paper": ""}, {"title": "Yana i_chatbots_report.md", "paper": ""}, {"title": "Yao et al. (2023) — PromptVC voice conversion", "year": "2023", "desc": "本資料は、自然言語プロンプトを用いて音声のスタイル（音色、感情、リズムなど）を柔軟に制御する新しい声質変換（Voice Conversion: VC）手法「PromptVC」に関する研究報告書である。 従来のスイル声質変換は、事前定義されたカテゴリラベルや参照音声に依存しており、スタイルの多様性や直感的な操作性に課題があった。PromptVCは、**潜在拡散モデル（Latent Diffusion", "audio": "episodes/Yao%20et%20al.%20%282023%29%20%E2%80%94%20PromptVC%20voice%20conversion/Yao%20et%20al.%202023%20-%20PromptVC%20voice%20conversion_radio.mp3", "img": "episodes/Yao%20et%20al.%20%282023%29%20%E2%80%94%20PromptVC%20voice%20conversion/Yao_et_al_2023_PromptVC_infographic.png", "report": "episodes/Yao%20et%20al.%20%282023%29%20%E2%80%94%20PromptVC%20voice%20conversion/Yao_et_al_2023_PromptVC_report.md", "paper": ""}, {"title": "Keating and Cook (2023) — Inside Out model of emotion recognition", "year": "2023", "desc": "本ドキュメントは、Connor Tom KeatingおよびJennifer Louise Cookによる研究論文「The inside out model of emotion recognition: how the shape of one’s internal emotional landscape influences the recognition of others’ emotion", "audio": "episodes/Keating%20and%20Cook%20%282023%29%20%E2%80%94%20Inside%20Out%20model%20of%20emotion%20recognition/Keating%20and%20Cook%202023%20-%20The%20inside%20out%20model%20of%20emotion%20recognition_radio.mp3", "img": "episodes/Keating%20and%20Cook%20%282023%29%20%E2%80%94%20Inside%20Out%20model%20of%20emotion%20recognition/Keating_Cook_2023_Inside_Out_infographic.png", "report": "episodes/Keating%20and%20Cook%20%282023%29%20%E2%80%94%20Inside%20Out%20model%20of%20emotion%20recognition/Keating_Cook_2023_Inside_Out_report.md", "paper": ""}, {"title": "Gonzalez-Rodriguez et al. (2024) — DOP schizotypy", "year": "2024", "desc": "本報告書は、2024年にGonzález-Rodríguezらによって発表された研究に基づき、動的な感情表情認識における「異質な結果手続き（Differential Outcomes Procedure: DOP）」の効果と、統合失調質パーソナリティ（スキゾタイピー）特性がそのパフォーマンスに与える影響を分析したものである。 研究の結果、DOPは特定の感情（恐れと驚き）が低い強度で示された際の認識", "audio": "episodes/Gonzalez-Rodriguez%20et%20al.%20%282024%29%20%E2%80%94%20DOP%20schizoty 意思決定および実行にどのような影響を与えるかを分析したものである。日常生活における目標指向型の動作（例：棚のマグカップを手に取る、券売機のボタンを押す）には、常に「不確実性」を伴う意思決定が含まれる。 本研究では、若年成人と高齢者を対象に、視覚的なシーケンス（単純なパターンと複雑なパターン）に基づくポインティング課題を", "audio": "episodes/Kr%C3%BCger%20et%20al.%20%282024%29%20%E2%80%94%20Influence%20of%20age%20and%20cognitive%20demand%20on%20motor%20decision%20making/Kr%C3%BCger%20et%20al.%202024_radio.mp3", "img": "episodes/Kr%C3%BCger%20et%20al.%20%282024%29%20%E2%80%94%20Influence%20of%20age%20and%20cognitive%20demand%20on%20motor%20decision%20making/Kr%C3%BCger%20et%20al.%202024_infographic.png", "report": "episodes/Kr%C3%BCger%20et%20al.%20%282024%29%20%E2%80%94%20Influence%20of%20age%20and%20cognitive%20demand%20on%20motor%20decision%20making/Kr%C3%BCger%20et%20al.%202024_report.md", "paper": ""}, {"title": "Lanfranco et al. (2024) — Minimal exposure durations reveal visual processing priorities", "year": "2024", "desc": "本ドキュメントは、Lanfrancoら（2024年）による研究論文「Minimal exposure durations reveal visual processing priorities for different stimulus attributes（最小露出時間は異なる刺激属性に対する視覚処理の優先順位を明らかにする）」に基づき、人間が意味のある情報を抽出するために必要な最小限の視覚入", "audio": "episodes/Lanfranco%20et%20al.%20%282024%29%20%E2%80%94%20Minimal%20exposure%20durations%20reveal%20visual%20processing%20priorities/Lanfranco%20et%20al.%202024_radio.mp3", "img": "episodes/Lanfranco%20et%20al.%20%282024%29%20%E2%80%94%20Minimal%20exposure%20durations%20reveal%20visual%20processing%20priorities/Lanfranco%20et%20al.%202024%20%E2%80%94%20Minimal%20exposure%20durations_radio_infographic.png", "report": "episodes/Lanfranco%20et%20al.%20%282024%29%20%E2%80%94%20Minimal%20exposure%20durations%20reveal%20visual%20processing%20priorities/Lanfranco%20et%20al.%202024%20%E2%80%94%20Minimal%20exposure%20durations_radio_report.md", "paper": ""}, {"title": "Dijkstra et al. (2024) — Confidence ratings do not distinguish imagination from reality", "year": "2024", "desc": "本文書は、Nadine Dijkstra、Matan Mazor、Stephen M. Flemingによる研究（2024年）に基づき、人間が内部で生成された「想像」と外部からの「現実」をどのように区別しているか、そしてその過程における自 _ownership_radio.mp3", "img": "", "report": "", "paper": ""}, {"title": "Heirani Moghaddam et al. (2021) — Explicit processes in visuomotor adaptation", "year": "2021", "desc": "本資料は、視覚運動適応（visuomotor adaptation）における「明示的プロセス（意識的なプロセス）」と「暗示的プロセス（無意識的なプロセス）」の評価手法を比較した研究（Heirani Moghaddam et al., 2021）の内容をまとめたものである。 この研究の核心的な問いは、現在広く用いられている2つの評価手法、**プロセス解離手続（PDP）**と**言語報告フレームワーク", "audio": "episodes/Heirani%20Moghaddam%20et%20al.%20%282021%29%20%E2%80%94%20Explicit%20processes%20in%20visuomotor%20adaptation/Heirani_Moghaddam_et_al_2021_Explicit_processes_visuomotor_radio.mp3", "img": "", "report": "episodes/Heirani%20Moghaddam%20et%20al.%20%282021%29%20%E2%80%94%20Explicit%20processes%20in%20visuomotor%20adaptation/Heirani_Moghaddam_et_al_2021_Explicit_processes_visuomotor_report.md", "paper": ""}, {"title": "Brooks et al. (2023) — Deep learning reveals what vocal bursts express", "year": "2023", "desc": "本ドキュメントは、2023年に発表された論文「Deep learning reveals what vocal bursts express in different cultures（深層学習が明らかにする、異なる文化におけるボーカル・バーストの表現内容）」に基づき、非言語音声が持つ感情的意味の構造、文化的共通性、および最新の解析手法についてまとめたものである。 本研究は、ため息、笑い声、叫び声", "audio": "episodes/Brooks%20et%20al.%20%282023%29%20%E2%80%94%20Deep%20learning%20reveals%20what%20vocal%20bursts%20express/Brooks_et_al_2023_Deep_learning_vocal_bursts_radio.mp3", "img": "", "report": "episodes/Brooks%20et%20al.%20%282023%29%20%E2%80%94%20Deep%20learning%20reveals%20what%20vocal%20bursts%20express/Brooks_et_al_2023_Deep_learning_vocal_bursts_report.md", "paper": ""}, {"title": "Mehring et al. (2019) — Augmented manipulation ability", "year": "2019", "desc": "本ドキュメントは、Mehringら（2019年）による、多指症（六本指）の被験者を対象とした神経力学および操作能力に関する調査結果をまとめたものである。この研究は、人間の脳が追加の自由度（dof）をどのように制御し、それが身体能力の向上にどのように寄与するかを明らかにしている。 ---", "audio": "episodes/Mehring%20et%20al.%20%282019%29%20%E2%80%94%20Augmented%20manipulation%20ability/Mehring_et_al_2019_Augmented_manipulation_ability_radio.mp3", "img": "", "report": "episodes/Mehring%20et%20al.%20%282019%29%20%E2%80%94%20Augmented%20man var player = document.getElementById('player');
var current = -1;
var els = {
  count: document.getElementById('ep-count'),
  grid: document.getElementById('episodes'),
  art: document.getElementById('pb-art'),
  title: document.getElementById('pb-title'),
  sub: document.getElementById('pb-sub'),
  play: document.getElementById('btn-play'),
  icPlay: document.getElementById('ic-play'),
  icPause: document.getElementById('ic-pause'),
  seek: document.getElementById('seek'),
  tCur: document.getElementById('t-cur'),
  tDur: document.getElementById('t-dur'),
  vol: document.getElementById('vol')
};

function fmt(s) {
  s = Math.max(0, Math.floor(s || 0));
  return Math.floor(s / 60) + ':' + ('0' + (s % 60)).slice(-2);
}
function setP(el) {
  var pct = el.max > 0 ? (el.value / el.max * 100) : 0;
  el.style.setProperty('--p', pct + '%');
}

function render() {
  els.count.textContent = EPISODES.length;
  var html = '';
  for (var i = 0; i < EPISODES.length; i++) {
    var ep = EPISODES[i];
    var hue = (i * 47) % 360;
    var art = ep.img
      ? '<img src="' + ep.img + '" alt="" loading="lazy">'
      : '<div class="ph" style="background:linear-gradient(135deg,hsl(' + hue + ',45%,30%),hsl(' + ((hue + 40) % 360) + ',55%,14%))">🎧</div>';
    html += '<div class="card" id="card-' + i + '" onclick="play(' + i + ')">'
      + '<div class="card-art">' + art
      + '<div class="eq"><i></i><i></i><i></i></div>'
      + '<button class="card-play" aria-label="再生"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button>'
      + '</div>'
      + '<h3>' + ep.title + '</h3>'
      + '<div class="card-meta">' + (ep.year || '') + (ep.desc ? ' · ' + ep.desc : '') + '</div>'
      + '</div>';
  }
  els.grid.innerHTML = html;
}

function showEpisode(i, doPlay) {
  var ep = EPISODES[i];
  current = i;
  player.src = ep.audio;
  if (doPlay) {
    initAudioGraph();
    if (actx && actx.state === 'suspended') actx.resume();
    player.play();
  }
  els.title.textContent = ep.title;
  els.sub.textContent = ep.year ? ep.year + '年の論文' : 'Paperpile Radio';
  els.art.innerHTML = ep.img ? '<img src="' + ep.img + '" alt="">' : '🎧';
  document.title = ep.title + ' — Paperpile Radio';
  var active = document.querySelector('.card.active');
  if (active) active.classList.remove('active');
  var card = document.getElementById('card-' + i);
  if (card) card.classList.add('active');
  if ('mediaSession' in navigator) {
    navigator.mediaSession.metadata = new MediaMetadata({
      title: ep.title,
      artist: 'Paperpile Radio',
      artwork: ep.img ? [{ src: ep.img }] : []
    });
  }
  openPanel(i);
}

function play(i) {
  if (i < 0 || i >= EPISODES.length) return;
  if (i === current) {
    openPanel(i);
    togglePlay();
    return;
  }
  showEpisode(i, true);
}

function togglePlay() {
  if (current < 0) { play(0); return; }
  if (player.paused) {
    if (actx && actx.state === 'suspended') actx.resume();
    player.play();
  } else {
    player.pause();
  }
}

els.play.addEventListener('click', togglePlay);
document.getElementById('btn-prev').addEventListener('click', function () {
  if (current > 0 && player.currentTime < 3) { play(current - 1); }
  else { player.currentTime = 0; }
});
document.getElementById('btn-next').addEventListener('click', function () { play(current + 1); });

player.addEventListener('play', function () {
  document.body.classList.add('playing');
  els.icPlay.style.display = 'none';
  els.icPause.style.display = 'block';
});
player.addEventListener('pause', function () {
  document.body.classList.remove('playing');
  els.icPlay.style.display = 'block';
  els.icPause.style.display = 'none';
});
player.addEventListener('ended', function () {
  if (current < EPISODES.length - 1) play(current + 1);
});
player.addEventListener('loadedmetadata', function () {
  els.seek.max = player.duration || 0;
  els.tDur.textContent = fmt(player.duration);
});

var seeking = false;
player.addEventListener('timeupdate', function () {
  if (seeking) return;
  els.seek.value = player.currentTime || 0;
  setP(els.seek);
  els.tCur.textContent = fmt(player.currentTime);
});
els.seek.addEventListener('input', function () {
  seeking = true;
  setP(els.seek);
  els.tCur.textContent = fmt(+els.seek.value);
});
els.seek.addEventListener('change', function () {
  player.currentTime = +els.seek.value;
  seeking = false;
});

els.vol.addEventListener('input', function () {
  player.volume = +els.vol.value;
  setP(els.vol);
});

document.addEventListener('keydown', function (e) {
  if (e.code === 'Space' && !/INPUT|TEXTAREA|BUTTON/.test(document.activeElement.tagName)) {
    e.preventDefault();
    togglePlay();
  }
  if (e.code === 'Escape') {
    if (lightbox.classList.contains('open')) closeLightbox();
    else if (document.body.classList.contains('panel-open')) closePanel();
  }
});

var panelEls = {
  art: document.getElementById('panel-art'),
  title: document.getElementById('panel-title'),
  year: document.getElementById('panel-year'),
  links: document.getElementById('panel-links'),
  md: document.getElementById('panel-md')
};
var lightbox = document.getElementById('lightbox');
var lightboxImg = document.getElementById('lightbox-img');

function escapeHtml(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
function inlineMd(s) {
  s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
  s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  s = s.replace(/(^|[\s（(])(https?:\/\/[^\s<）)]+)/g, '$1<a href="$2" target="_blank" rel="noopener">$2</a>');
  return s;
}
function mdToHtml(md) {
  var lines = escapeHtml(md).split(/\r?\n/);
  var out = [], stack = [], para = [];
  function closePara() {
    if (para.length) { out.push('<p>' + inlineMd(para.join(' ')) + '</p>'); para = []; }
  }
  function closeLists(d) {
    while (stack.length > d) out.push('</' + stack.pop() + '>');
  }
  for (var k = 0; k < lines.length; k++) {
    var ln = lines[k], m;
    if (/^\s*$/.test(ln)) { closePara(); closeLists(0); continue; }
    if (/^\s*(---+|\*\*\*+)\s*$/.test(ln)) { closePara(); closeLists(0); out.push('<hr>'); continue; }
    if ((m = ln.match(/^(#{1,4})\s+(.*)/))) {
      closePara(); closeLists(0);
      var h = Math.min(m[1].length + 1, 4);
      out.push('<h' + h + '>' + inlineMd(m[2]) + '</h' + h + '>');
      continue;
    }
    if ((m = ln.match(/^(\s*)([*+-]|\d+\.)\s+(.*)/))) {
      closePara();
      var depth = Math.min(Math.floor(m[1].length / 4) + 1, 3);
      var tag = /\d/.test(m[2].charAt(0)) ? 'ol' : 'ul';
      closeLists(depth);
      while (stack.length < depth) { stack.push(tag); out.push('<' + tag + '>'); }
      out.push('<li>' + inlineMd(m[3]) + '</li>');
      continue;
    }
    para.push(ln.trim());
  }
  closePara(); closeLists(0);
  return out.join('\n');
}

function openPanel(i) {
  var ep = EPISODES[i];
  if (panelEp !== i) {
    panelEp = i;
    panelEls.title.textContent = ep.title;
    panelEls.year.textContent = ep.year ? ep.year + '年の論文' : '';
    panelEls.art.innerHTML = ep.img
      ? '<img src="' + ep.img + '" alt="インフォグラフィック" onclick="openLightbox()">'
      : '<div class="ph">🎧</div>';
    var links = '';
    if (ep.paper) links += '<a class="pill" href="' + ep.paper + '" target="_blank" rel="noopener">📄 論文を開く</a>';
    links += '<a class="pill" href="https://scholar.google.com/scholar?q=' + encodeURIComponent(ep.title) + '" target="_blank" rel="noopener">🔍 Google Scholarで探す</a>';
    if (ep.img) links += '<button class="pill" onclick="openLightbox()">🖼 インフォグラフィックを拡大</button>';
    panelEls.links.innerHTML = links;
    loadReport(ep, i);
    document.getElementById('panel').scrollTop = 0;
  }
  document.body.classList.add('panel-open');
  history.replaceState(null, '', '#ep=' + i);
}
function closePanel() {
  document.body.classList.remove('panel-open');
  history.replaceState(null, '', location.pathname + location.search);
}
document.getElementById('panel-close').addEventListener('click', closePanel);
document.getElementById('pb-left').addEventListener('click', function () {
  if (current < 0) return;
  if (document.body.classList.contains('panel-open') && panelEp === current) closePanel();
  else openPanel(current);
});

function loadReport(ep, i) {
  if (!ep.report) {
    panelEls.md.innerHTML = ep.desc
      ? '<p>' + escapeHtml(ep.desc) + '…</p>'
      : '<p class="md-missing">このエピソードの解説はまだありません。</p>';
    return;
  }
  if (mdCache[ep.report]) { panelEls.md.innerHTML = mdCache[ep.report]; return; }
  panelEls.md.innerHTML = '<p class="md-missing">解説を読み込み中…</p>';
  fetch(ep.report)
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); })
    .then(function (t) {
      mdCache[ep.report] = mdToHtml(t);
      if (panelEp === i) panelEls.md.innerHTML = mdCache[ep.report];
    })
    .catch(function () {
      if (panelEp === i) panelEls.md.innerHTML = '<p class="md-missing">解説を読み込めませんでした。</p>';
    });
}

function openLightbox() {
  var ep = EPISODES[panelEp];
  if (!ep || !ep.img) return;
  lightboxImg.src = ep.img;
  lightbox.classList.add('open');
}
function closeLightbox() { lightbox.classList.remove('open'); }
lightbox.addEventListener('click', closeLightbox);

/* ---- VU level meter ---- */
var actx = null, analyserL = null, analyserR = null, bufL = null, bufR = null;
function initAudioGraph() {
  if (actx) return;
  try {
    actx = new (window.AudioContext || window.webkitAudioContext)();
    var src = actx.createMediaElementSource(player);
    var splitter = actx.createChannelSplitter(2);
    analyserL = actx.createAnalyser();
    analyserR = actx.createAnalyser();
    analyserL.fftSize = 1024;
    analyserR.fftSize = 1024;
    src.connect(splitter);
    splitter.connect(analyserL, 0);
    splitter.connect(analyserR, 1);
    src.connect(actx.destination);
    bufL = new Uint8Array(analyserL.fftSize);
    bufR = new Uint8Array(analyserR.fftSize);
  } catch (e) {
    actx = null; analyserL = null; analyserR = null;
  }
}
function rmsOf(an, buf) {
  an.getByteTimeDomainData(buf);
  var s = 0;
  for (var i = 0; i < buf.length; i++) {
    var v = (buf[i] - 128) / 128;
    s += v * v;
  }
  return Math.sqrt(s / buf.length);
}

var vu = document.getElementById('vu');
var mctx = vu.getContext('2d');
var dpr = window.devicePixelRatio || 1;
var vuW = 0, vuH = 0;
function sizeMeter() {
  vuW = vu.clientWidth; vuH = vu.clientHeight;
  vu.width = vuW * dpr; vu.height = vuH * dpr;
}
window.addEventListener('resize', sizeMeter);

var LVL = [0, 0], PK = [0, 0], PKT = [0, 0];
function drawMeter(ts) {
  requestAnimationFrame(drawMeter);
  if (!vuW) sizeMeter();
  mctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  mctx.clearRect(0, 0, vuW, vuH);
  var rms = [0, 0];
  if (analyserL && !player.paused) {
    rms[0] = rmsOf(analyserL, bufL);
    rms[1] = rmsOf(analyserR, bufR);
    if (rms[1] < 1e-4 && rms[0] > 1e-3) rms[1] = rms[0]; /* モノラル音源はLを両chに */
  }
  var n = 20, x0 = 15, segW = (vuW - x0 - 3) / n;
  var rowH = (vuH - 14) / 2;
  mctx.font = '9px ui-monospace,monospace';
  for (var c = 0; c < 2; c++) {
    var db = 20 * Math.log(Math.max(rms[c], 1e-6)) / Math.LN10;
    var t = Math.max(0, Math.min(1, (db + 48) / 48));
    LVL[c] = t > LVL[c] ? t : Math.max(t, LVL[c] - 0.04);
    if (LVL[c] >= PK[c]) { PK[c] = LVL[c]; PKT[c] = ts || 0; }
    else if ((ts || 0) - PKT[c] > 700) { PK[c] = Math.max(LVL[c], PK[c] - 0.015); }
    var y = 5 + c * (rowH + 4);
    mctx.globalAlpha = 1;
    mctx.fillStyle = '#8b8b8b';
    mctx.fillText(c ? 'R' : 'L', 4, y + rowH - 1);
    var lit = Math.round(LVL[c] * n);
    var pk = Math.round(PK[c] * n) - 1;
    for (var i = 0; i < n; i++) {
      mctx.fillStyle = i < n * 0.55 ? '#1db954' : (i < n * 0.8 ? '#e7a917' : '#e9432f');
      mctx.globalAlpha = (i < lit || (i === pk && pk >= lit)) ? 1 : 0.13;
      mctx.fillRect(x0 + i * segW, y, segW - 1.5, rowH);
    }
  }
  mctx.globalAlpha = 1;
}

setP(els.seek);
setP(els.vol);
render();
requestAnimationFrame(drawMeter);

var hashEp = location.hash.match(/^#ep=(\d+)$/);
if (hashEp) {
  var hi = +hashEp[1];
  if (hi >= 0 && hi < EPISODES.length) showEpisode(hi, false);
}
</script>
